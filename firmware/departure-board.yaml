    restore_mode: RESTORE_DEFAULT_OFF   # on = "Due" / "5 min" instead of "On time" / expected time
  - platform: template
    name: "Large text"
    id: text_large
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # large text shows at most 4 trains
  - platform: template
    name: "Scrolling text"
    id: scroll_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON    # off = long lines are shortened with ...
  - platform: template
    name: "Clock seconds"
    id: show_seconds
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "12 hour clock"
    id: clock_12h
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Hide cancelled"
    id: hide_cancelled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Show platform"
    id: show_platform
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
