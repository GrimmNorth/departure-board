  - platform: template
    name: "Fade cancelled trains"
    id: fade_cancelled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Column headings"
    id: col_headings
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Page animation"
    id: page_anim
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Night follows sun"
    id: night_sun
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Show logo"
    id: show_logo
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Demo mode"
    id: demo_mode
    optimistic: true
    restore_mode: ALWAYS_OFF   # shows a fake delayed and cancelled train, for testing colours

text:
  - platform: template
    name: "Logo image"
    id: logo_url
    mode: text
    min_length: 0
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""     # web address of a PNG, e.g. http://homeassistant.local:8123/local/logo.png
    entity_category: config
    on_value:
      - lambda: 'id(logo_ok) = false;'
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - lambda: 'id(custom_logo)->set_url(x); id(custom_logo)->update();'
  - platform: template
    name: "Destination filter"
    id: dest_filter
    mode: text
    min_length: 0
    max_length: 40
    optimistic: true
    restore_value: true
    initial_value: ""     # e.g. "Leeds" = only trains calling at Leeds
  - platform: template
    name: "Favourite stop"
    id: fav_stop
    mode: text
    min_length: 0
    max_length: 40
    optimistic: true
    restore_value: true
    initial_value: ""     # a stop name to highlight on the board, e.g. "Leeds"
  - platform: template
    name: "Favourite trains"
    id: fav_times
