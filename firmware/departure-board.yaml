          then:
            - lambda: 'id(stn_switch_ms) = millis();'
            - homeassistant.event:                 # the blueprint sends the new station's trains straight away
                event: esphome.departure_board_station
                data:
                  number: !lambda 'return to_string((int) x);'   # sent with the signal, so it can't arrive late
  - platform: template
    name: "Page interval"
    id: page_secs
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 5
    max_value: 30
    step: 1
    unit_of_measurement: "s"
    mode: box
    entity_category: config
  - platform: template
    name: "Panel colour warmth"
    id: pc_warm
    icon: mdi:palette
    min_value: 0
    max_value: 20
    step: 1
    mode: slider
    initial_value: 10
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: apply_theme
      - lambda: 'id(main_display).update();'
  - platform: template
    name: "Brightness"
    id: brightness_num
    icon: mdi:brightness-6
    min_value: 10
    max_value: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      - lambda: |-
          // the daytime brightness; applied now unless the board is dimmed for the night or idle
          id(day_brightness) = x / 100.0f;
          if (id(dim_state) != 0 || !id(backlight).current_values.is_on()) return;
          if (std::fabs(id(backlight).current_values.get_brightness() - x / 100.0f) < 0.005f) return;
          auto c = id(backlight).turn_on();
          c.set_brightness(x / 100.0f);
          c.set_transition_length(0);
          c.perform();
  - platform: template
    name: "Night brightness"
    id: night_level
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 30
  - platform: template
    name: "Idle dim after"
    id: idle_minutes
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = never dim when idle
  - platform: template
    name: "Idle brightness"
    id: idle_level
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 30
  - platform: template
    name: "Departed grace"
    id: departed_grace
    min_value: 1
    max_value: 5
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 1          # minutes a train stays listed after its time
  - platform: template
    name: "Clock screen after"
    id: clock_after
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = off. After this long without a touch, show the big clock screen
  - platform: template
    name: "Walking time"
    id: walk_minutes
    min_value: 0
    max_value: 30
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = off. Trains sooner than this are greyed out

