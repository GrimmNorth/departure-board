text:
  - platform: template
    name: "National Rail board logo image"
    id: logo_url
    mode: text
    min_length: 0
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""     # web address of a PNG, e.g. http://homeassistant.local:8123/local/logo.png
    entity_category: config
    on_value:
      - lambda: 'id(logo_ok) = false;'
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - lambda: 'id(custom_logo)->set_url(x); id(custom_logo)->update();'
  - platform: template
    name: "TfL board logo image"
    id: logo_tfl_url
    mode: text
    min_length: 0
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""     # web address of a PNG for Tube / DLR stations, e.g. http://homeassistant.local:8123/local/roundel.png
    entity_category: config
    on_value:
      - lambda: 'id(logo_tfl_ok) = false;'
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - lambda: 'id(custom_logo_tfl)->set_url(x); id(custom_logo_tfl)->update();'
