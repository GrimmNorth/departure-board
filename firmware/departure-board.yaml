# UK departure board for the Elecrow CrowPanel Basic 7.0" (ESP32-S3, 800x480).
# Train data is sent by the Home Assistant blueprint in blueprints/automation/
# (from the My Rail Commute integration). Prebuilt firmware and install page:
# https://grimmnorth.github.io/departure-board/
substitutions:
  update_url: "https://grimmnorth.github.io/departure-board/manifest.json"
  update_url_beta: "https://grimmnorth.github.io/departure-board/manifest-beta.json"

esphome:
  name: departure-board
  friendly_name: Departure Board
  name_add_mac_suffix: true   # several boards on one network stay distinct
  on_boot:
    priority: -100
    then:
      # follow the update channel chosen in Home Assistant (Stable unless changed)
      - lambda: |-
          if (id(update_channel).active_index().value_or(0) == 1) id(fw_update).set_source_url("${update_url_beta}");
  project:
    name: "community.uk_departure_board"
    version: "1.6.0"
  platformio_options:
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  includes:
    - departure_board.h

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB            # 4MB, NOT 16MB (16MB causes a boot loop)
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0   # the USB-C port is wired to UART0 via a CH340 chip
  baud_rate: 115200

api:
  reboot_timeout: 15min      # no Home Assistant connection for 15 min = reboot
  actions:
    # Called by the Home Assistant blueprint (about once a minute).
    - action: update_status
      variables:
        station: string
        status: string
      then:
        - lambda: |-
            id(station_ts).publish_state(station);
            id(stn_status).publish_state(status);
            id(data_ms_stn) = millis();
    - action: update_train
      variables:
        n: int
        sched: string
        expct: string
        plat: string
        pchg: string
        stat: string
        dreason: string
        creason: string
        oper: string
        delaym: string
        sarr: string
        earr: string
        pprev: string
        stops: string
        calls: string[]
      then:
        - lambda: |-
            std::string cp = "[";
            for (size_t i = 0; i < calls.size(); i++) { if (i) cp += ", "; cp += "\"" + calls[i] + "\""; }
            cp += "]";
            switch (n) {
              case 1: id(stn_t1_scheduled_departure).publish_state(sched); id(stn_t1_expected_departure).publish_state(expct); id(stn_t1_platform).publish_state(plat); id(stn_t1_platform_changed).publish_state(pchg); id(stn_t1_status).publish_state(stat); id(stn_t1_delay_reason).publish_state(dreason); id(stn_t1_cancellation_reason).publish_state(creason); id(stn_t1_operator).publish_state(oper); id(stn_t1_delay_minutes).publish_state(delaym); id(stn_t1_scheduled_arrival).publish_state(sarr); id(stn_t1_estimated_arrival).publish_state(earr); id(stn_t1_previous_platform).publish_state(pprev); id(stn_t1_stops).publish_state(stops); id(stn_t1_calling_points).publish_state(cp); break;
              case 2: id(stn_t2_scheduled_departure).publish_state(sched); id(stn_t2_expected_departure).publish_state(expct); id(stn_t2_platform).publish_state(plat); id(stn_t2_platform_changed).publish_state(pchg); id(stn_t2_status).publish_state(stat); id(stn_t2_delay_reason).publish_state(dreason); id(stn_t2_cancellation_reason).publish_state(creason); id(stn_t2_operator).publish_state(oper); id(stn_t2_delay_minutes).publish_state(delaym); id(stn_t2_scheduled_arrival).publish_state(sarr); id(stn_t2_estimated_arrival).publish_state(earr); id(stn_t2_previous_platform).publish_state(pprev); id(stn_t2_stops).publish_state(stops); id(stn_t2_calling_points).publish_state(cp); break;
              case 3: id(stn_t3_scheduled_departure).publish_state(sched); id(stn_t3_expected_departure).publish_state(expct); id(stn_t3_platform).publish_state(plat); id(stn_t3_platform_changed).publish_state(pchg); id(stn_t3_status).publish_state(stat); id(stn_t3_delay_reason).publish_state(dreason); id(stn_t3_cancellation_reason).publish_state(creason); id(stn_t3_operator).publish_state(oper); id(stn_t3_delay_minutes).publish_state(delaym); id(stn_t3_scheduled_arrival).publish_state(sarr); id(stn_t3_estimated_arrival).publish_state(earr); id(stn_t3_previous_platform).publish_state(pprev); id(stn_t3_stops).publish_state(stops); id(stn_t3_calling_points).publish_state(cp); break;
              case 4: id(stn_t4_scheduled_departure).publish_state(sched); id(stn_t4_expected_departure).publish_state(expct); id(stn_t4_platform).publish_state(plat); id(stn_t4_platform_changed).publish_state(pchg); id(stn_t4_status).publish_state(stat); id(stn_t4_delay_reason).publish_state(dreason); id(stn_t4_cancellation_reason).publish_state(creason); id(stn_t4_operator).publish_state(oper); id(stn_t4_delay_minutes).publish_state(delaym); id(stn_t4_scheduled_arrival).publish_state(sarr); id(stn_t4_estimated_arrival).publish_state(earr); id(stn_t4_previous_platform).publish_state(pprev); id(stn_t4_stops).publish_state(stops); id(stn_t4_calling_points).publish_state(cp); break;
              case 5: id(stn_t5_scheduled_departure).publish_state(sched); id(stn_t5_expected_departure).publish_state(expct); id(stn_t5_platform).publish_state(plat); id(stn_t5_platform_changed).publish_state(pchg); id(stn_t5_status).publish_state(stat); id(stn_t5_delay_reason).publish_state(dreason); id(stn_t5_cancellation_reason).publish_state(creason); id(stn_t5_operator).publish_state(oper); id(stn_t5_delay_minutes).publish_state(delaym); id(stn_t5_scheduled_arrival).publish_state(sarr); id(stn_t5_estimated_arrival).publish_state(earr); id(stn_t5_previous_platform).publish_state(pprev); id(stn_t5_stops).publish_state(stops); id(stn_t5_calling_points).publish_state(cp); break;
              case 6: id(stn_t6_scheduled_departure).publish_state(sched); id(stn_t6_expected_departure).publish_state(expct); id(stn_t6_platform).publish_state(plat); id(stn_t6_platform_changed).publish_state(pchg); id(stn_t6_status).publish_state(stat); id(stn_t6_delay_reason).publish_state(dreason); id(stn_t6_cancellation_reason).publish_state(creason); id(stn_t6_operator).publish_state(oper); id(stn_t6_delay_minutes).publish_state(delaym); id(stn_t6_scheduled_arrival).publish_state(sarr); id(stn_t6_estimated_arrival).publish_state(earr); id(stn_t6_previous_platform).publish_state(pprev); id(stn_t6_stops).publish_state(stops); id(stn_t6_calling_points).publish_state(cp); break;
              case 7: id(stn_t7_scheduled_departure).publish_state(sched); id(stn_t7_expected_departure).publish_state(expct); id(stn_t7_platform).publish_state(plat); id(stn_t7_platform_changed).publish_state(pchg); id(stn_t7_status).publish_state(stat); id(stn_t7_delay_reason).publish_state(dreason); id(stn_t7_cancellation_reason).publish_state(creason); id(stn_t7_operator).publish_state(oper); id(stn_t7_delay_minutes).publish_state(delaym); id(stn_t7_scheduled_arrival).publish_state(sarr); id(stn_t7_estimated_arrival).publish_state(earr); id(stn_t7_previous_platform).publish_state(pprev); id(stn_t7_stops).publish_state(stops); id(stn_t7_calling_points).publish_state(cp); break;
              case 8: id(stn_t8_scheduled_departure).publish_state(sched); id(stn_t8_expected_departure).publish_state(expct); id(stn_t8_platform).publish_state(plat); id(stn_t8_platform_changed).publish_state(pchg); id(stn_t8_status).publish_state(stat); id(stn_t8_delay_reason).publish_state(dreason); id(stn_t8_cancellation_reason).publish_state(creason); id(stn_t8_operator).publish_state(oper); id(stn_t8_delay_minutes).publish_state(delaym); id(stn_t8_scheduled_arrival).publish_state(sarr); id(stn_t8_estimated_arrival).publish_state(earr); id(stn_t8_previous_platform).publish_state(pprev); id(stn_t8_stops).publish_state(stops); id(stn_t8_calling_points).publish_state(cp); break;
              case 9: id(stn_t9_scheduled_departure).publish_state(sched); id(stn_t9_expected_departure).publish_state(expct); id(stn_t9_platform).publish_state(plat); id(stn_t9_platform_changed).publish_state(pchg); id(stn_t9_status).publish_state(stat); id(stn_t9_delay_reason).publish_state(dreason); id(stn_t9_cancellation_reason).publish_state(creason); id(stn_t9_operator).publish_state(oper); id(stn_t9_delay_minutes).publish_state(delaym); id(stn_t9_scheduled_arrival).publish_state(sarr); id(stn_t9_estimated_arrival).publish_state(earr); id(stn_t9_previous_platform).publish_state(pprev); id(stn_t9_stops).publish_state(stops); id(stn_t9_calling_points).publish_state(cp); break;
              case 10: id(stn_t10_scheduled_departure).publish_state(sched); id(stn_t10_expected_departure).publish_state(expct); id(stn_t10_platform).publish_state(plat); id(stn_t10_platform_changed).publish_state(pchg); id(stn_t10_status).publish_state(stat); id(stn_t10_delay_reason).publish_state(dreason); id(stn_t10_cancellation_reason).publish_state(creason); id(stn_t10_operator).publish_state(oper); id(stn_t10_delay_minutes).publish_state(delaym); id(stn_t10_scheduled_arrival).publish_state(sarr); id(stn_t10_estimated_arrival).publish_state(earr); id(stn_t10_previous_platform).publish_state(pprev); id(stn_t10_stops).publish_state(stops); id(stn_t10_calling_points).publish_state(cp); break;
              default: break;
            }
            id(data_ms_stn) = millis();

ota:
  - platform: esphome
  - platform: http_request

http_request:
  timeout: 30s

update:
  - platform: http_request
    id: fw_update
    name: "Departure board firmware"
    source: ${update_url}
    update_interval: 6h

wifi:
  reboot_timeout: 15min      # no Wi-Fi for 15 min = reboot
  power_save_mode: none      # steadier connection for an always-on display
  # Fallback hotspot: if the board can't join the network above it starts its own
  # "Departure-Board" Wi-Fi so new details can be entered from a phone.
  ap:
    ssid: "Departure-Board"

captive_portal:

# Lets the install page ask for Wi-Fi details right after flashing (over the USB cable).
improv_serial:

# After 5 failed starts in a row the board boots a minimal "safe mode" that can still
# receive a fixed update, so a bad release never needs a USB cable to recover.
safe_mode:
  num_attempts: 5
  reboot_timeout: 10min

debug:
  update_interval: 60s

button:
  - platform: restart
    name: "Departure board restart"
    entity_category: config
  - platform: safe_mode
    name: "Departure board restart in safe mode"
    entity_category: config

globals:
  - id: settings_page
    type: int
    initial_value: "0"
  - id: ui_screen          # 0 = departures, 1 = settings
    type: int
    initial_value: "0"
  - id: touch_down
    type: bool
    initial_value: "false"
  - id: last_event
    type: uint32_t
    initial_value: "0"
  - id: last_fresh
    type: uint32_t
    initial_value: "0"
  - id: last_touch_any
    type: uint32_t
    initial_value: "0"
  - id: dim_state          # 0 normal, 1 night dim, 2 night screen off, 3 idle dim
    type: int
    initial_value: "0"
  - id: was_on
    type: bool
    initial_value: "true"
  - id: wake_until
    type: uint32_t
    initial_value: "0"
  - id: detail_train       # train number shown on the detail screen
    type: int
    initial_value: "0"
  - id: slot_train         # which train is drawn in each row (for taps)
    type: int[6]
    initial_value: "{0, 0, 0, 0, 0, 0}"
  - id: last_period        # auto station: -1 unknown, 0 before switch time, 1 after
    type: int
    initial_value: "-1"
  - id: day_brightness
    type: float
    initial_value: "1.0"
  - id: data_ms_stn
    type: uint32_t
    initial_value: "0"

time:
  - platform: homeassistant
    id: ha_time

# Decides every 2 seconds whether the screen should be normal, dimmed for the night,
# off for the night (tap to wake) or dimmed after inactivity.
script:
  - id: apply_theme
    mode: single
    then:
      - lambda: |-
          static const uint8_t P[6][7][3] = {
              {{0, 0, 0}, {255, 176, 0}, {255, 77, 0}, {255, 0, 0}, {51, 255, 51}, {115, 115, 115}, {255, 255, 255}},
              {{0, 0, 0}, {242, 242, 242}, {255, 176, 0}, {255, 59, 59}, {125, 255, 125}, {110, 110, 110}, {255, 200, 0}},
              {{11, 31, 74}, {255, 255, 255}, {255, 212, 0}, {255, 90, 90}, {123, 228, 149}, {120, 135, 170}, {255, 212, 0}},
              {{2, 10, 2}, {60, 255, 90}, {200, 255, 60}, {255, 80, 80}, {60, 255, 90}, {30, 110, 40}, {220, 255, 220}},
              {{0, 0, 0}, {255, 230, 0}, {255, 255, 255}, {255, 64, 64}, {80, 255, 80}, {150, 150, 150}, {0, 255, 255}},
              {{244, 241, 232}, {26, 26, 26}, {179, 92, 0}, {196, 30, 30}, {30, 122, 46}, {150, 150, 150}, {0, 70, 180}}
          };
          static int applied = -1;
          int t = id(theme_select).active_index().value_or(0);
          if (t == 5 && (id(dim_state) == 1 || id(dim_state) == 2)) t = 0;   // no bright screen at night
          if (t == applied) return;
          applied = t;
          Color *dst[7] = {&id(bg_col), &id(amber), &id(orange), &id(red), &id(green), &id(grey), &id(hilite)};
          for (int k = 0; k < 7; k++) *dst[k] = Color(P[t][k][0], P[t][k][1], P[t][k][2]);
  - id: update_dim
    mode: single
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          uint32_t ms = millis();
          bool inwin = false;
          if (t.is_valid()) {
            int nowm = t.hour * 60 + t.minute;
            int s = id(night_start).hour * 60 + id(night_start).minute;
            int e = id(night_end).hour * 60 + id(night_end).minute;
            inwin = (s <= e) ? (nowm >= s && nowm < e) : (nowm >= s || nowm < e);
          }
          bool night_active = id(night_dimming).state && inwin;
          bool idle_active = id(idle_minutes).state > 0 &&
                             (ms - id(last_touch_any)) > (uint32_t) (id(idle_minutes).state * 60000.0f);
          if (id(wake_until) != 0 && ms >= id(wake_until)) id(wake_until) = 0;
          bool waking = id(wake_until) != 0;
          int target = 0;
          if (night_active) target = (id(night_screen_off).state && !waking) ? 2 : 1;
          else if (idle_active) target = 3;
          int prev = id(dim_state);
          if (target == prev) return;
          id(dim_state) = target;
          if (prev == 0) {
            id(was_on) = id(backlight).current_values.is_on();
            if (id(was_on)) id(day_brightness) = id(backlight).current_values.get_brightness();
          }
          if (!id(was_on)) return;          // the screen was switched off by hand: leave it alone
          if (target == 2) {
            auto c = id(backlight).turn_off();
            c.set_transition_length(0);
            c.perform();
            return;
          }
          float b = id(day_brightness);
          if (target == 1) b = id(night_level).state / 100.0f;
          if (target == 3) b = id(idle_level).state / 100.0f;
          auto c = id(backlight).turn_on();
          c.set_brightness(b);
          c.set_transition_length(0);
          c.perform();

interval:
  - interval: 2s
    then:
      - script.execute: update_dim
  # Memory watchdog: restart cleanly before low memory can freeze the board.
  - interval: 60s
    then:
      - lambda: |-
          static uint8_t low_count = 0;
          size_t fr = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t blk = heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL);
          if (fr < 16384 || blk < 8192) low_count++; else low_count = 0;
          if (low_count >= 3) {
            ESP_LOGW("watchdog", "Memory critically low (%u free, %u block) - restarting", (unsigned) fr, (unsigned) blk);
            App.safe_reboot();
          }
          // memory slowly running down: restart quietly at 03:30 instead
          auto t = id(ha_time).now();
          if (t.is_valid() && t.hour == 3 && t.minute == 30 && millis() > 3600000UL && fr < 40960) {
            ESP_LOGW("watchdog", "Memory low (%u free) - overnight restart", (unsigned) fr);
            App.safe_reboot();
          }
      - script.execute: apply_theme
i2c:
  - id: touch_i2c
    sda: GPIO19
    scl: GPIO20
    frequency: 400kHz
    scan: false              # scanning can upset the GT911

touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: touch_i2c
    address: 0x5D            # try 0x14 if touch is dead
    update_interval: 50ms
    on_touch:
      - lambda: |-
          uint32_t now = millis();
          uint32_t prev_touch = id(last_touch_any);
          id(last_touch_any) = now;
          bool fresh = !id(touch_down) || (now - id(last_event) > 400);
          id(last_event) = now;
          id(touch_down) = true;
          if (!fresh) return;
          // screen off or dimmed: the first tap only wakes it
          if (id(dim_state) == 2 || id(dim_state) == 3 || id(wake_until) != 0) {
            bool wasoff = (id(dim_state) == 2) || (id(wake_until) != 0);
            if (wasoff) id(wake_until) = now + 60000;
            id(update_dim).execute();
            if (id(dim_state) == 2 || id(dim_state) == 3) return;
          }
          // clock screen: the first tap just brings the list back
          if (id(ui_screen) == 0 && id(clock_after).state > 0 &&
              (now - prev_touch) > (uint32_t) (id(clock_after).state * 60000.0f)) {
            id(main_display).update();
            return;
          }
          int x = touch.x, y = touch.y;
          id(last_fresh) = now;
          if (id(ui_screen) == 0) {
            // departures screen: tap the clock (bottom right) for settings, anywhere else = next station
            if (y >= 410 && x >= 540) { id(ui_screen) = 1; id(settings_page) = 0; }
            else if (y < 406) {
              // tap a train for its details
              int cnt = (int) id(train_count).state;
              if (cnt < 3) cnt = 3;
              if (cnt > 5) cnt = 5;
              if (id(text_large).state && cnt > 4) cnt = 4;
              int sl = id(focus_mode).state ? 0 : (y - 6) / (406 / cnt);
              int tn = (sl >= 0 && sl < cnt) ? id(slot_train)[sl] : 0;
              if (tn > 0) { id(detail_train) = tn; id(ui_screen) = 2; }
              else id(station_select).make_call().select_next(true).perform();
            }
            else id(station_select).make_call().select_next(true).perform();   // tap the footer = next station
          } else if (id(ui_screen) == 2) {
            id(ui_screen) = 0;                  // any tap closes the detail view
          } else {
            if (y >= 424) {
              if (x < 400) id(settings_page) = (id(settings_page) + 1) % 5;   // NEXT
              else id(ui_screen) = 0;                                          // CLOSE
            } else if (y >= 50 && y < 418) {
              int row = (y - 50) / 46;
              bool plus = x > 640;
              bool minus = !plus && x >= 500;
              int si = id(station_select).active_index().value_or(0);
              switch (id(settings_page)) {
                case 0:
                  switch (row) {
                    case 0: id(theme_select).make_call().select_next(true).perform(); break;
                    case 1: if (plus || minus) { float v = id(train_count).state + (plus ? 1 : -1); if (v < 3) v = 3; if (v > 5) v = 5; auto c = id(train_count).make_call(); c.set_value(v); c.perform(); } break;
                    case 2: id(text_large).toggle(); break;
                    case 3: id(font_select).make_call().select_next(true).perform(); break;
                    case 4: id(scroll_speed).make_call().select_next(true).perform(); break;
                    case 5: id(scroll_enabled).toggle(); break;
                    case 6: id(show_seconds).toggle(); break;
                    case 7: id(clock_12h).toggle(); break;
                  }
                  break;
                case 1:
                  switch (row) {
                    case 0: id(countdown_mode).toggle(); break;
                    case 1: {
                    std::vector<std::string> opts;
                    opts.push_back("");
                    auto add = [&](const std::string &d) {
                      if (d.empty()) return;
                      for (auto &o : opts) if (o == d) return;
                      opts.push_back(d);
                    };
                    switch (si) {
                      case 0: add(departure::destination(id(stn_t1_calling_points).state, 40)); add(departure::destination(id(stn_t2_calling_points).state, 40)); add(departure::destination(id(stn_t3_calling_points).state, 40)); add(departure::destination(id(stn_t4_calling_points).state, 40)); add(departure::destination(id(stn_t5_calling_points).state, 40)); add(departure::destination(id(stn_t6_calling_points).state, 40)); add(departure::destination(id(stn_t7_calling_points).state, 40)); add(departure::destination(id(stn_t8_calling_points).state, 40)); add(departure::destination(id(stn_t9_calling_points).state, 40)); add(departure::destination(id(stn_t10_calling_points).state, 40)); break;
                    }
                    std::string cur = id(dest_filter).state;
                    size_t idx = 0;
                    for (size_t i = 0; i < opts.size(); i++) if (opts[i] == cur) idx = i;
                    idx = (idx + 1) % opts.size();
                    auto c = id(dest_filter).make_call();
                    c.set_value(opts[idx]);
                    c.perform();
                  } break;
                    case 2: id(hide_cancelled).toggle(); break;
                    case 3: id(show_platform).toggle(); break;
                    case 4: if (plus || minus) { float v = id(departed_grace).state + (plus ? 1 : -1); if (v < 1) v = 1; if (v > 5) v = 5; auto c = id(departed_grace).make_call(); c.set_value(v); c.perform(); } break;
                    case 5: if (plus || minus) { float v = id(walk_minutes).state + (plus ? 1 : -1); if (v < 0) v = 0; if (v > 30) v = 30; auto c = id(walk_minutes).make_call(); c.set_value(v); c.perform(); } break;
                  }
                  break;
                case 2:
                  switch (row) {
                    case 0: {
                    std::vector<std::string> opts;
                    opts.push_back("");
                    auto add = [&](const std::string &d) {
                      if (d.empty()) return;
                      for (auto &o : opts) if (o == d) return;
                      opts.push_back(d);
                    };
                    switch (si) {
                      case 0: for (auto &p : departure::points(id(stn_t1_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t2_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t3_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t4_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t5_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t6_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t7_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t8_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t9_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t10_calling_points).state)) add(p); break;
                    }
                    std::string cur = id(fav_stop).state;
                    size_t idx = 0;
                    for (size_t i = 0; i < opts.size(); i++) if (opts[i] == cur) idx = i;
                    idx = (idx + 1) % opts.size();
                    auto c = id(fav_stop).make_call();
                    c.set_value(opts[idx]);
                    c.perform();
                  } break;
                    case 1: id(disruption_banner).toggle(); break;
                    case 2: id(show_logo).toggle(); break;
                    case 3: id(focus_mode).toggle(); break;
                    case 4: if (plus || minus) { float v = id(clock_after).state + (plus ? 5 : -5); if (v < 0) v = 0; if (v > 60) v = 60; auto c = id(clock_after).make_call(); c.set_value(v); c.perform(); } break;
                  }
                  break;
                case 3:
                  switch (row) {
                    case 0: if (plus || minus) { float b = id(backlight).current_values.get_brightness() + (plus ? 0.1f : -0.1f); if (b < 0.1f) b = 0.1f; if (b > 1.0f) b = 1.0f; auto c = id(backlight).turn_on(); c.set_brightness(b); c.set_transition_length(0); c.perform(); } break;
                    case 1: id(night_dimming).toggle(); break;
                    case 2: if (plus || minus) { float v = id(night_level).state + (plus ? 5 : -5); if (v < 1) v = 1; if (v > 100) v = 100; auto c = id(night_level).make_call(); c.set_value(v); c.perform(); } break;
                    case 3: if (plus || minus) { int h = (id(night_start).hour + (plus ? 1 : 23)) % 24; auto c = id(night_start).make_call(); c.set_time(h, id(night_start).minute, 0); c.perform(); } break;
                    case 4: if (plus || minus) { int h = (id(night_end).hour + (plus ? 1 : 23)) % 24; auto c = id(night_end).make_call(); c.set_time(h, id(night_end).minute, 0); c.perform(); } break;
                    case 5: id(night_screen_off).toggle(); break;
                    case 6: if (plus || minus) { float v = id(idle_minutes).state + (plus ? 5 : -5); if (v < 0) v = 0; if (v > 60) v = 60; auto c = id(idle_minutes).make_call(); c.set_value(v); c.perform(); } break;
                    case 7: if (plus || minus) { float v = id(idle_level).state + (plus ? 5 : -5); if (v < 5) v = 5; if (v > 100) v = 100; auto c = id(idle_level).make_call(); c.set_value(v); c.perform(); } break;
                  }
                  break;
                case 4:
                  switch (row) {
                  }
                  break;
              }
            }
          }
          id(main_display).update();
    on_release:
      - lambda: |-
          id(touch_down) = false;

