    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://DotGothic16"
    id: f_row_0
    size: 32
  - file: "gfonts://DotGothic16"
    id: f_sub_0
    size: 32
  - file: "gfonts://DotGothic16"
    id: f_clk_0
    size: 32
  - file: "gfonts://DotGothic16"
    id: f_row_l_0
    size: 48
  - file: "gfonts://DotGothic16"
    id: f_sub_l_0
    size: 32
  - file: "gfonts://DotGothic16"
    id: f_big_0
    size: 144
    glyphs: "0123456789: apmDueinh"
  - file: "gfonts://DotGothic16"
    id: f_hdr_0
    size: 16

color:
  - id: band_col
    red: 12%
    green: 10%
    blue: 6%
  - id: bg_col
    red: 0%
    green: 0%
    blue: 0%
  - id: hilite
    red: 100%
    green: 100%
    blue: 100%
  - id: amber
    red: 100%
    green: 69%
    blue: 0%
  - id: red
    red: 100%
    green: 0%
    blue: 0%
  - id: green
    red: 20%
    green: 100%
    blue: 20%
  - id: grey
    red: 45%
    green: 45%
    blue: 45%
  - id: orange
    red: 100%
    green: 30%
    blue: 0%

number:
  - platform: template
    name: "Station number"
    id: stn_num
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 5
    step: 1
    mode: box
    on_value:
      - if:
          condition:
            lambda: 'return millis() > 30000;'     # a real change, not the value restored at start-up
          then:
            - lambda: 'id(stn_switch_ms) = millis();'
            - homeassistant.event:                 # the blueprint sends the new station's trains straight away
                event: esphome.departure_board_station
                data:
                  number: !lambda 'return to_string((int) x);'   # sent with the signal, so it can't arrive late
  - platform: template
    name: "Page interval"
    id: page_secs
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 5
    max_value: 30
    step: 1
    unit_of_measurement: "s"
    mode: box
    entity_category: config
  - platform: template
    name: "Trains shown"
    id: train_count
    min_value: 3
    max_value: 5
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    name: "Night brightness"
    id: night_level
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 20
  - platform: template
    name: "Idle dim after"
    id: idle_minutes
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = never dim when idle
  - platform: template
    name: "Idle brightness"
    id: idle_level
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 30
  - platform: template
    name: "Departed grace"
    id: departed_grace
    min_value: 1
    max_value: 5
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 1          # minutes a train stays listed after its time
  - platform: template
    name: "Clock screen after"
    id: clock_after
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = off. After this long without a touch, show the big clock screen
  - platform: template
    name: "Walking time"
    id: walk_minutes
    min_value: 0
    max_value: 30
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = off. Trains sooner than this are greyed out

datetime:
  - platform: template
    name: "Night starts"
    id: night_start
    type: time
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
  - platform: template
    name: "Night ends"
    id: night_end
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"

switch:
