light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    on_state:
      - lambda: |-
          // daytime only (night / idle dimming change the backlight too): keep the Brightness slider in step
          if (id(dim_state) != 0 || !id(backlight).current_values.is_on()) return;
          const float pct = std::round(id(backlight).current_values.get_brightness() * 100.0f);
          if (!id(brightness_num).has_state() || std::fabs(id(brightness_num).state - pct) >= 1.0f) id(brightness_num).publish_state(pct);

