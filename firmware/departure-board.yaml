          } else {
            const int cyc = rw + 120;
            const int off = (int) (((uint64_t) millis() * sp / 1000) % cyc);
            it.start_clipping(20, ytop + sT - 3, 780, ytop + sB + 3);
            it.printf(20 - off, ytop, fs2, sc, TextAlign::TOP_LEFT, "%s", rs.c_str());
