        for (int i = 1; i < 10 && i < elig_prev; i++) if (cmp_page[i] == page) { n++; sum += C_ROWB + (cmp_tall[i] ? C_SUBB + 1 : 0); }
        int gap = n > 0 ? (C_BOT - C_TOP - sum) / n : 0;   // spread the rows down the screen
        gap = std::max(6, std::min(gap, 14));
