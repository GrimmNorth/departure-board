      const bool hi_con = id(theme_select).active_index().value_or(0) == 4;
      const Color cxl_col = Color((amber.r * 45 + band_col.r * 55) / 100, (amber.g * 45 + band_col.g * 55) / 100, (amber.b * 45 + band_col.b * 55) / 100);
      const Color sub_col = hi_con ? amber : Color((amber.r * 6 + band_col.r * 4) / 10, (amber.g * 6 + band_col.g * 4) / 10, (amber.b * 6 + band_col.b * 4) / 10);
      const Color sub_ora = hi_con ? orange : Color((orange.r * 6 + band_col.r * 4) / 10, (orange.g * 6 + band_col.g * 4) / 10, (orange.b * 6 + band_col.b * 4) / 10);
