  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: template
    name: "Display frame time"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return (float) id(frame_ms);'
  - platform: debug
    free:
      id: heap_free
      name: "Free memory"
      entity_category: diagnostic
    block:
      name: "Largest free memory block"
      entity_category: diagnostic
  - platform: template
    name: "Data age"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (id(data_ms_stn) == 0) return NAN;     // nothing received since start-up
      return (float) ((millis() - id(data_ms_stn)) / 60000);
  - platform: template
    id: leave_in_s
    name: "Leave in"
    unit_of_measurement: "min"
    accuracy_decimals: 0

display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    dimensions:
      width: 800
      height: 480
    invert_colors: true      # both this and pclk_inverted are required
    color_order: RGB
    auto_clear_enabled: false
    update_interval: 250ms
    de_pin: GPIO41
    hsync_pin: GPIO39
    vsync_pin: GPIO40
    pclk_pin: GPIO0
    pclk_frequency: 15MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red: [GPIO14, GPIO21, GPIO47, GPIO48, GPIO45]
      green: [GPIO9, GPIO46, GPIO3, GPIO8, GPIO16, GPIO1]
      blue: [GPIO15, GPIO7, GPIO6, GPIO5, GPIO4]
    lambda: |-
      if (id(shot_req)) {
        // a screenshot: the buffer still holds the last finished frame, so copy it before drawing the next
        struct ShotSrc : public mipi_rgb::MipiRgb {
          static uint16_t *get(mipi_rgb::MipiRgb *d) { return d->*(&ShotSrc::buffer_); }
        };
        uint16_t *src = ShotSrc::get(id(main_display));
        const size_t n = (size_t) it.get_width() * it.get_height();
        if (id(shot_buf) == nullptr) id(shot_buf) = (uint16_t *) heap_caps_malloc(n * 2, MALLOC_CAP_SPIRAM);
        if (src != nullptr && id(shot_buf) != nullptr) { memcpy(id(shot_buf), src, n * 2); id(shot_ready) = true; }
        id(shot_req) = false;
      }
      it.fill(bg_col);

      // panel warmth for colours that are not from the theme (Tube line colours)
      const int pw = id(pc_warm).has_state() ? (int) id(pc_warm).state : 0;
      auto warm_rgb = [&](int &r, int &g, int &b) {
        if (pw <= 0) return;
        const float gg = 1.0f + 0.1f * pw;
        auto f = [&](int c) { c = std::max(0, std::min(255, c)); return (int) lroundf(255.0f * powf(c / 255.0f, gg)); };
        r = f(r); g = f(g); b = f(b);
      };
      // the project logo, a dot-matrix train. sh > 0 slides it in from the left, a column at a time
      auto draw_logo = [&](int cx, int top, int pitch, int rl, int ru, Color on, Color off, int sh) {
        static const char *const LOGO[11] = {"...........", "...........", "#######....", "#.#.#.##...", "#.#.#.###..",
                                             "##########.", "###########", "...........", ".#..#..#..#", "###########", "..........."};
        const int x0 = cx - 5 * pitch;
        for (int j = 0; j < 11; j++)
          for (int i = 0; i < 11; i++) {
            const int si = i + sh;
            const bool lit = si >= 0 && si < 11 && LOGO[j][si] == '#';
            if (lit) it.filled_circle(x0 + i * pitch, top + j * pitch, rl, on);
            else if (ru > 0) it.filled_circle(x0 + i * pitch, top + j * pitch, ru, off);
          }
      };
      // start-up: the logo drives in and the title wipes in like an LED board, then the details appear
      static uint32_t boot_t0 = 0;
      if (boot_t0 == 0) boot_t0 = millis();
      const uint32_t bt = millis() - boot_t0;
      if (bt < 5000) {
        draw_logo(400, 28, 10, 4, 3, amber, band_col, std::max<int>(0, 11 - (int) (bt * 11 / 1300)));
        it.filled_rectangle(60, 164, 680, 64, band_col);
        const int wipe = std::min<int>(800, (int) (bt * 800 / 1600));
        it.start_clipping(0, 0, wipe, 480);
        it.printf(400, 196, id(f_row_0), amber, TextAlign::CENTER, "UK Departure Board");
        it.end_clipping();
        if (wipe > 60 && wipe < 740) it.filled_rectangle(wipe, 164, 4, 64, hilite);   // the bright "cursor"
        if (bt > 1800) it.printf(400, 258, id(f_sub_0), amber, TextAlign::CENTER, "Version %s", ESPHOME_PROJECT_VERSION);
        if (bt > 2200) it.printf(400, 294, id(f_sub_0), amber, TextAlign::CENTER, "ESPHome %s", id(esphome_ver_ts).state.c_str());
        if (bt > 2600) {
          if (wifi::global_wifi_component->is_connected())
            it.printf(400, 330, id(f_sub_0), green, TextAlign::CENTER, "Wi-Fi connected");
          else
            it.printf(400, 330, id(f_sub_0), orange, TextAlign::CENTER, "Connecting to Wi-Fi...");
        }
        for (int d = 0; d < 24; d++)                     // a row of dots fills up while it starts
          it.filled_circle(400 - 230 + d * 20, 410, 4, bt > (uint32_t) d * 200 ? amber : band_col);
        return;
      }

      auto now = id(ha_time).now();
      bool tv = now.is_valid();
      int nowmin = tv ? now.hour * 60 + now.minute : -1;
      const char *THEME_NAMES[] = {"Classic", "White LED", "Modern LCD", "Retro green", "High contrast", "Daylight"};
      const char *FONT_NAMES[] = {"DotGothic"};
      std::string stn_name = id(station_ts).state.empty() ? std::string("Departures") : id(station_ts).state;
      const char *STATION_NAMES[] = {stn_name.c_str()};
      int si = id(station_select).active_index().value_or(0);
      uint32_t dms = 0;
      std::string disr;
      switch (si) {
        case 0: dms = id(data_ms_stn); disr = id(stn_status).state; break;
      }

      // ---------------- settings screen (tap the clock to open) ----------------
      if (id(ui_screen) == 1 && millis() - id(last_touch_any) > 60000) id(ui_screen) = 0;   // settings close after a minute
      if (id(ui_screen) == 1) {
        if (millis() - id(last_fresh) > 30000) {
          id(ui_screen) = 0;                    // close after 30 s without a touch
        } else {
          static const char *SPEEDN[3] = {"Slow", "Medium", "Fast"};
          int R = 0;
          auto lab = [&](int row, const char *s) {
            it.printf(20, 50 + row * 46 + 21, id(f_row_0), amber, TextAlign::CENTER_LEFT, "%s", s);
          };
          auto val = [&](int row, Color c, const char *s) {
            it.printf(776, 50 + row * 46 + 21, id(f_row_0), c, TextAlign::CENTER_RIGHT, "%s", s);
          };
          auto pm = [&](int row, const char *v) {
            int ry = 50 + row * 46;
            it.rectangle(510, ry, 80, 42, amber);
            it.printf(550, ry + 21, id(f_row_0), amber, TextAlign::CENTER, "-");
            it.rectangle(700, ry, 80, 42, amber);
            it.printf(740, ry + 21, id(f_row_0), amber, TextAlign::CENTER, "+");
            it.printf(645, ry + 21, id(f_row_0), amber, TextAlign::CENTER, "%s", v);
          };
          auto onoff = [&](int row, bool on) { val(row, on ? green : grey, on ? "On" : "Off"); };
          auto cyc = [&](int row, const char *s) {        // a value you tap to change: text plus a small arrow
            int cy = 50 + row * 46 + 21;
            it.printf(752, cy, id(f_row_0), amber, TextAlign::CENTER_RIGHT, "%s", s);
            it.filled_triangle(764, cy - 7, 764, cy + 7, 774, cy, grey);
          };
          auto band = [&](int row) { it.filled_rectangle(10, 50 + row * 46 - 2, 780, 44, band_col); };
          char buf[40];
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          const bool api_ok = api::global_api_server->is_connected();
          static const char *PAGE_NAMES[7] = {"Display", "Trains", "Extras", "Screen", "Style", "Status", "Help"};
          it.printf(20, 25, id(f_row_0), hilite, TextAlign::CENTER_LEFT, "Settings");
          { int hx, hy, hw, hh; it.get_text_bounds(20, 25, "Settings", id(f_row_0), TextAlign::CENTER_LEFT, &hx, &hy, &hw, &hh);
            it.printf(20 + hw + 24, 25, id(f_row_0), amber, TextAlign::CENTER_LEFT, "%s", PAGE_NAMES[id(settings_page)]); }
          if (id(settings_page) == 5) draw_logo(596, 10, 3, 1, 0, amber, amber, 0);
          for (int d = 0; d < 7; d++) {                         // page dots
            int dx = 776 - (7 - 1 - d) * 24;
            if (d == id(settings_page)) it.filled_circle(dx, 25, 7, hilite); else it.circle(dx, 25, 6, grey);
          }
          if (id(settings_page) == 0) {
            R = 0; band(R); lab(R, "Theme"); cyc(R, THEME_NAMES[id(theme_select).active_index().value_or(0)]);
            R = 1; band(R); lab(R, "Layout"); { static const char *LN[3] = {"Classic", "Calm", "Compact"}; cyc(R, LN[id(layout_select).active_index().value_or(0)]); }
            R = 2; band(R); lab(R, "Text size"); cyc(R, id(text_large).state ? "Large" : "Normal");
            R = 3; band(R); lab(R, "Scroll speed"); cyc(R, SPEEDN[id(scroll_speed).active_index().value_or(1)]);
            R = 4; band(R); lab(R, "Scrolling text"); onoff(R, id(scroll_enabled).state);
            R = 5; band(R); lab(R, "Clock seconds"); onoff(R, id(show_seconds).state);
            R = 6; band(R); lab(R, "12 hour clock"); onoff(R, id(clock_12h).state);
          }
          else if (id(settings_page) == 1) {
            R = 0; band(R); lab(R, "Countdown"); onoff(R, id(countdown_mode).state);
            R = 1; band(R); lab(R, "Calling at"); { std::string f = id(dest_filter).state; val(R, f.empty() ? grey : green, f.empty() ? "Off" : f.c_str()); }
            R = 2; band(R); lab(R, "Hide cancelled"); onoff(R, id(hide_cancelled).state);
            R = 3; band(R); lab(R, "Show platform"); onoff(R, id(show_platform).state);
            R = 4; band(R); lab(R, "Paging"); onoff(R, id(paging_on).state);
            R = 5; band(R); lab(R, "Pin next train"); onoff(R, id(pin_next).state);
            R = 6; band(R); lab(R, "Departed grace"); snprintf(buf, sizeof(buf), "%d min", (int) id(departed_grace).state); pm(R, buf);
            R = 7; band(R); lab(R, "Walking time"); if (id(walk_minutes).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(walk_minutes).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
          }
          else if (id(settings_page) == 2) {
            R = 0; band(R); lab(R, "Highlight stop"); { std::string f = id(fav_stop).state; val(R, f.empty() ? grey : green, f.empty() ? "Off" : f.c_str()); }
            R = 1; band(R); lab(R, "Disruption banner"); onoff(R, id(disruption_banner).state);
            R = 2; band(R); lab(R, "Show logo"); onoff(R, id(show_logo).state);
            R = 3; band(R); lab(R, "Focus mode"); onoff(R, id(focus_mode).state);
            R = 4; band(R); lab(R, "Clock screen after"); if (id(clock_after).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(clock_after).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
            R = 5; band(R); lab(R, "Footer colour"); cyc(R, id(footer_colour).active_index().value_or(0) == 1 ? "White" : "Theme");
          }
          else if (id(settings_page) == 3) {
            R = 0; band(R); lab(R, "Brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) (id(backlight).current_values.get_brightness() * 100 + 0.5f)); pm(R, buf);
            R = 1; band(R); lab(R, "Night dimming"); if (!id(night_dimming).state) val(R, grey, "Off"); else cyc(R, id(night_sun).state ? "Sunset" : "Set times");
            R = 2; band(R); lab(R, "Night brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) id(night_level).state); pm(R, buf);
            R = 3; band(R); lab(R, "Night starts"); if (id(night_dimming).state && id(night_sun).state) val(R, grey, "Sunset"); else { snprintf(buf, sizeof(buf), "%02d:%02d", id(night_start).hour, id(night_start).minute); pm(R, buf); }
            R = 4; band(R); lab(R, "Night ends"); if (id(night_dimming).state && id(night_sun).state) val(R, grey, "Sunrise"); else { snprintf(buf, sizeof(buf), "%02d:%02d", id(night_end).hour, id(night_end).minute); pm(R, buf); }
            R = 5; band(R); lab(R, "Night screen off"); onoff(R, id(night_screen_off).state);
            R = 6; band(R); lab(R, "Idle dim after"); if (id(idle_minutes).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(idle_minutes).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
            R = 7; band(R); lab(R, "Idle brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) id(idle_level).state); pm(R, buf);
          }
          else if (id(settings_page) == 4) {
            R = 0; band(R); lab(R, "Fade cancelled"); onoff(R, id(fade_cancelled).state);
            R = 1; band(R); lab(R, "Column headings"); onoff(R, id(col_headings).state);
            R = 2; band(R); lab(R, "Page animation"); onoff(R, id(page_anim).state);
            R = 3; band(R); lab(R, "TfL line colours"); onoff(R, id(tfl_colours).state);
          }
          else if (id(settings_page) == 5) {
            R = 0; band(R); lab(R, "Wi-Fi"); if (wifi_ok) { std::string s = id(wifi_ssid_ts).state; if (s.size() > 14) s.resize(14); snprintf(buf, sizeof(buf), "%s %ddBm", s.c_str(), (int) id(wifi_rssi_s).state); val(R, green, buf); } else val(R, red, "Offline");
            R = 1; band(R); lab(R, "IP address"); val(R, amber, id(wifi_ip_ts).state.c_str());
            R = 2; band(R); lab(R, "Home Assistant"); val(R, api_ok ? green : red, api_ok ? "Connected" : "Offline");
            R = 3; band(R); lab(R, "Data age"); if (dms == 0) val(R, amber, "No data yet"); else { unsigned am = (millis() - dms) / 60000; snprintf(buf, sizeof(buf), "%u min", am); val(R, am >= 5 ? red : green, buf); }
            R = 4; band(R); lab(R, "Uptime"); { uint32_t u = millis() / 1000; snprintf(buf, sizeof(buf), "%ud %uh %um", (unsigned) (u / 86400), (unsigned) (u % 86400 / 3600), (unsigned) (u % 3600 / 60)); val(R, amber, buf); }
            R = 5; band(R); lab(R, "ESPHome"); val(R, amber, id(esphome_ver_ts).state.c_str());
            R = 6; band(R); lab(R, "Firmware");
            if (id(fw_update).state == update::UPDATE_STATE_AVAILABLE) { snprintf(buf, sizeof(buf), "%s, %s ready", ESPHOME_PROJECT_VERSION, id(fw_update).update_info.latest_version.c_str()); val(R, orange, buf); }
            else { snprintf(buf, sizeof(buf), "%s %s", ESPHOME_PROJECT_VERSION, __DATE__); val(R, amber, buf); }
            R = 7; band(R); lab(R, "Free memory"); if (id(heap_free).has_state()) { snprintf(buf, sizeof(buf), "%d KB", (int) (id(heap_free).state / 1024)); val(R, amber, buf); } else val(R, amber, "...");
          }
          else if (id(settings_page) == 6) {
            R = 0; band(R); lab(R, "Tap a train"); val(R, amber, "Its details and stops");
            R = 1; band(R); lab(R, "Swipe, or tap station"); val(R, amber, "Change station or route");
            R = 2; band(R); lab(R, "Tap the clock"); val(R, amber, "These settings");
            R = 3; band(R); lab(R, "Train details"); val(R, amber, "Tap sides: prev / next");
            R = 4; band(R); lab(R, "Screen off at night"); val(R, amber, "Tap once to wake");
            R = 5; band(R); lab(R, "Orange arrow in footer"); val(R, amber, "Update ready: tap it");
            R = 6; band(R); lab(R, "Orange i in footer"); val(R, amber, "Messages, line status");
            R = 7; band(R); lab(R, "Hold a train"); val(R, amber, "Make it a favourite");
          }
          const char *BTN[3] = {"< Back", "Next >", "Close"};
          for (int b = 0; b < 3; b++) {
            int bx = 20 + b * 260;
            it.filled_rectangle(bx, 426, 240, 46, band_col);
            it.rectangle(bx, 426, 240, 46, amber);
            it.printf(bx + 120, 449, id(f_row_0), amber, TextAlign::CENTER, "%s", BTN[b]);
          }
          return;
        }
      }

      // ---------------- update screen (tap the arrow in the footer) ----------------
      if (id(ui_screen) == 4 && !id(upd_installing) &&
          (millis() - id(last_touch_any) > 60000 || id(fw_update).state != update::UPDATE_STATE_AVAILABLE)) id(ui_screen) = 0;
      if (id(ui_screen) == 4) {
        font::Font *mf = id(f_row_0);
        it.filled_rectangle(10, 4, 780, 44, band_col);
        it.circle(34, 26, 16, orange);
        it.circle(34, 26, 15, orange);
        it.filled_triangle(34, 16, 26, 26, 42, 26, orange);
        it.filled_rectangle(31, 26, 7, 10, orange);
        it.printf(66, 26, mf, amber, TextAlign::CENTER_LEFT, "Update ready");
        const char *nv = id(fw_update).update_info.latest_version.c_str();
        if (id(upd_installing)) {
          it.printf(24, 80, mf, amber, "Installing %s...", nv);
          it.printf(24, 124, mf, amber, "The board restarts by itself when it");
          it.printf(24, 168, mf, amber, "has finished. Please don't unplug it.");
        } else {
          it.printf(24, 80, mf, amber, "Version %s is ready.", nv);
          it.printf(24, 124, mf, grey, "You have %s.", ESPHOME_PROJECT_VERSION);
          it.printf(24, 190, mf, amber, "Install it now, or from Home Assistant:");
          it.printf(24, 234, mf, amber, "Settings > Updates, or its device page.");
          const char *BTN[2] = {"Install now", "Close"};
          for (int b = 0; b < 2; b++) {
            const int bx = 120 + b * 300;
            it.filled_rectangle(bx, 426, 260, 46, band_col);
            it.rectangle(bx, 426, 260, 46, b == 0 ? orange : amber);
            it.printf(bx + 130, 449, mf, b == 0 ? orange : amber, TextAlign::CENTER, "%s", BTN[b]);
          }
        }
        return;
      }

      // ---------------- station message screen (tap the "i" in the footer) ----------------
      if (id(ui_screen) == 3 && (id(msg_n) == 0 || millis() - id(last_touch_any) > 60000)) id(ui_screen) = 0;   // closes after a minute
      if (id(ui_screen) == 3) {
        std::vector<std::string> ml;
        {
          std::string cur;
          for (char ch : id(msg_text)) {
            if (ch == '\n') { if (cur.find_first_not_of(' ') != std::string::npos) ml.push_back(cur); cur.clear(); }
            else if (ch != '\r') cur += ch;
          }
          if (cur.find_first_not_of(' ') != std::string::npos) ml.push_back(cur);
        }
        if (!ml.empty()) {
          const int nm = (int) ml.size();
          if (id(msg_idx) < 0 || id(msg_idx) >= nm) id(msg_idx) = 0;
          const int mi = id(msg_idx);
          font::Font *mf = id(f_row_0);
          auto wid = [&](const std::string &s) { int bx, by, bw, bh; it.get_text_bounds(0, 0, s.c_str(), mf, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh); return bw; };
          // heading: the icon, "Station message" and which one this is
          it.filled_rectangle(10, 4, 780, 44, band_col);
          it.circle(34, 26, 16, orange);
          it.circle(34, 26, 15, orange);
          it.printf(34, 26, mf, orange, TextAlign::CENTER, "i");
          char hb[40];
          const char *mt = id(src_tfl) ? "Line status" : "Station message";
          if (nm > 1) snprintf(hb, sizeof(hb), "%s  %d of %d", mt, mi + 1, nm);
          else snprintf(hb, sizeof(hb), "%s", mt);
          it.printf(66, 26, mf, amber, TextAlign::CENTER_LEFT, "%s", hb);
          // the message, wrapped to the width of the screen
          std::vector<std::string> lines;
          std::string cur, word;
          auto add_word = [&]() {
            if (word.empty()) return;
            std::string t = cur.empty() ? word : cur + " " + word;
            if (!cur.empty() && wid(t) > 752) { lines.push_back(cur); cur = word; } else cur = t;
            word.clear();
          };
          for (char ch : ml[mi]) { if (ch == ' ') add_word(); else word += ch; }
          add_word();
          if (!cur.empty()) lines.push_back(cur);
          if (lines.size() > 8) {
            lines.resize(8);
            std::string &l = lines.back();
            while (!l.empty() && wid(l + "...") > 752) l.pop_back();
            l += "...";
          }
          for (size_t i = 0; i < lines.size(); i++) it.printf(24, 62 + (int) i * 44, mf, amber, "%s", lines[i].c_str());
          // buttons, like the settings screen
          const char *BTN[3] = {"< Prev", "Close", "Next >"};
          for (int b = 0; b < 3; b++) {
            const bool on = (b == 1) || (b == 0 && mi > 0) || (b == 2 && mi < nm - 1);
            int bx = 20 + b * 260;
            it.filled_rectangle(bx, 426, 240, 46, band_col);
            it.rectangle(bx, 426, 240, 46, on ? amber : grey);
            it.printf(bx + 120, 449, mf, on ? amber : grey, TextAlign::CENTER, "%s", BTN[b]);
          }
          return;
        }
        id(ui_screen) = 0;
      }

      // ---------------- departures screen ----------------
      const bool L = id(text_large).state;
      int count = 5;                            // 5 trains a page
      if (count < 3) count = 3;
      if (count > 5) count = 5;
      if (L && count > 4) count = 4;            // large text only has room for 4 trains
      const int HDR = id(col_headings).state ? 32 : 0;   // room for column headings
      const int H = (406 - HDR) / count;                // pixel height of one train (two lines)
      const int fi = 0;   // one font
      static std::map<std::string, uint32_t> pchg_seen;   // when each platform change was first shown
      font::Font *F_ROW[] = {id(f_row_0)};
      font::Font *F_SUB[] = {id(f_sub_0)};
      font::Font *F_CLK[] = {id(f_clk_0)};
      font::Font *F_ROWL[] = {id(f_row_l_0)};
      font::Font *F_SUBL[] = {id(f_sub_l_0)};
      font::Font *F_BIG[] = {id(f_big_0)};
      auto fr = L ? F_ROWL[fi] : F_ROW[fi];
      auto fs = L ? F_SUBL[fi] : F_SUB[fi];
      const int TX = 18;
      const int DX = L ? 175 : 130;             // destination / sub-line x
      const int PX = L ? 540 : 610;             // platform column (right edge)
      const int DMAX = L ? 12 : 21;             // destination max characters
      // real extent of the letters, measured from the glyphs: capital tops to descender bottoms,
      // relative to the top of a printed line (font metrics overstate this for some fonts)
      auto ink_of = [](font::Font *f, int &top, int &bot) {
        top = f->get_baseline() * 1 / 4; bot = f->get_baseline();
        bool got = false;
