  # fills the board with a made-up station, every train's time counted from now
  - id: demo_fill
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          const int nowmin = now.hour * 60 + now.minute;
          auto hm = [&](int off) { int m = ((nowmin + off) % 1440 + 1440) % 1440; char b[6]; snprintf(b, sizeof(b), "%02d:%02d", m / 60, m % 60); return std::string(b); };
          auto pub = [&](int n, const std::string &sched, const std::string &expct, const std::string &plat, const std::string &pchg,
                         const std::string &stat, const std::string &dr, const std::string &cr, const std::string &oper, const std::string &dm,
                         const std::string &pprev, const std::string &stops, const std::string &cp) {
            if (n < 1 || n > 10) return;
            departure::Train &t = departure::train(n);
            t.sched = sched; t.exp = expct; t.plat = plat; t.pchg = pchg; t.stat = stat; t.dreason = dr; t.creason = cr;
            t.oper = oper; t.delaym = dm; t.sarr = ""; t.earr = ""; t.pprev = pprev; t.stops = stops; t.calls = cp;
          };
          auto calls = [](std::initializer_list<const char *> l) { std::string c = "["; bool f = true; for (auto *s : l) { if (!f) c += ", "; c += "\"" + std::string(s) + "\""; f = false; } return c + "]"; };
          const bool tfl = id(demo_kind) == 2;
          id(src_tfl) = tfl;
          id(src_ts).publish_state(tfl ? "London TfL" : "National Rail");
          id(route_to) = ""; id(route_ts).publish_state("");
          id(station_ts).publish_state(tfl ? "Green Park" : "York");
          id(stn_status).publish_state(tfl ? "" : "Minor");
          const std::string msg = tfl ? "Jubilee line: Minor delays due to an earlier signal failure. Tickets are being accepted on local buses."
                                      : "Engineering works: buses replace trains between York and Leeds on Sunday. Please check before you travel.";
          if (id(msg_text) != msg) { id(msg_text) = msg; id(msg_n) = 1; id(msg_idx) = 0; id(msg_new_ms) = millis(); id(msg_count_s).publish_state(1); }
          if (!tfl) {
            auto st = [&](std::initializer_list<std::pair<const char *, int>> l) { std::string r; for (auto &p : l) { if (!r.empty()) r += ", "; r += std::string(p.first) + " " + hm(p.second); } return r; };
            pub(1, hm(2), hm(2), "3", "", "on_time", "", "", "Northern", "0", "", st({{"Church Fenton", 14}, {"Leeds", 26}}), calls({"Church Fenton", "Leeds"}));
            pub(2, hm(6), hm(14), "5", "", "delayed", "This train has been delayed by a signalling fault", "", "LNER", "8", "", st({{"Doncaster", 34}, {"Peterborough", 63}, {"London Kings Cross", 120}}), calls({"Doncaster", "Peterborough", "London Kings Cross"}));
            pub(3, hm(11), hm(11), "8", "true", "on_time", "", "", "TransPennine Express", "0", "7", st({{"Malton", 36}, {"Seamer", 55}, {"Scarborough", 61}}), calls({"Malton", "Seamer", "Scarborough"}));
            pub(4, hm(15), hm(15), "9", "", "cancelled", "", "This train has been cancelled because of a shortage of train crew", "Northern", "0", "", st({{"Malton", 25}, {"Seamer", 45}, {"Scarborough", 52}}), calls({"Malton", "Seamer", "Scarborough"}));
            pub(5, hm(19), hm(19), "4", "", "on_time", "", "", "TransPennine Express", "0", "", st({{"Leeds", 43}, {"Huddersfield", 63}, {"Manchester Piccadilly", 99}, {"Manchester Airport", 117}}), calls({"Leeds", "Huddersfield", "Manchester Piccadilly", "Manchester Airport"}));
            pub(6, hm(24), hm(24), "9", "", "on_time", "", "", "LNER", "0", "", st({{"Darlington", 54}, {"Durham", 71}, {"Newcastle", 84}}), calls({"Darlington", "Durham", "Newcastle"}));
            pub(7, hm(31), hm(31), "10", "", "on_time", "", "", "Northern", "0", "", st({{"Leeds", 58}, {"Bradford Interchange", 80}, {"Blackpool North", 170}}), calls({"Leeds", "Bradford Interchange", "Blackpool North"}));
            pub(8, hm(37), hm(41), "3", "", "delayed", "This train has been delayed by a late running train in front of this one", "", "LNER", "4", "", st({{"Newcastle", 101}, {"Berwick-upon-Tweed", 147}, {"Edinburgh", 192}}), calls({"Newcastle", "Berwick-upon-Tweed", "Edinburgh"}));
            pub(9, hm(44), hm(44), "5", "", "on_time", "", "", "Northern", "0", "", st({{"Malton", 71}, {"Scarborough", 96}}), calls({"Malton", "Scarborough"}));
            pub(10, hm(52), hm(52), "11", "", "on_time", "", "", "CrossCountry", "0", "", st({{"Doncaster", 76}, {"Sheffield", 103}, {"Birmingham New Street", 177}}), calls({"Doncaster", "Sheffield", "Birmingham New Street"}));
          } else {
            struct T { int off; const char *dest, *plat, *line, *dir, *loc, *col; };
            const T tt[10] = {
              {0, "Brixton", "4", "Victoria line", "Southbound", "At Platform", "#0098D4"},
              {1, "Stanmore", "6", "Jubilee line", "Northbound", "Left Westminster", "#A0A5A9"},
              {2, "Cockfosters", "2", "Piccadilly line", "Eastbound", "At Hyde Park Corner", "#003688"},
              {3, "Walthamstow Central", "3", "Victoria line", "Northbound", "Between Victoria and Green Park", "#0098D4"},
              {5, "Heathrow T5", "1", "Piccadilly line", "Westbound", "At Piccadilly Circus", "#003688"},
              {6, "Stratford", "5", "Jubilee line", "Southbound", "At Bond Street", "#A0A5A9"},
              {8, "Brixton", "4", "Victoria line", "Southbound", "At Oxford Circus", "#0098D4"},
              {10, "Uxbridge", "1", "Piccadilly line", "Westbound", "At Leicester Square", "#003688"},
              {11, "Stanmore", "6", "Jubilee line", "Northbound", "Between Waterloo and Westminster", "#A0A5A9"},
              {13, "Cockfosters", "2", "Piccadilly line", "Eastbound", "At Knightsbridge", "#003688"}};
            for (int k = 0; k < 10; k++) {
              const T &t = tt[k];
              pub(k + 1, hm(t.off), hm(t.off), t.plat, "", k == 0 ? "arriving" : "on_time", "", "", std::string(t.line) + " - " + t.dir + " - " + t.loc, "", t.col, "", calls({t.dest}));
            }
          }
          id(data_ms_stn) = millis();
