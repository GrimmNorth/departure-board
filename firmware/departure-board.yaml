select:
  - platform: template
    name: "Demo mode"
    id: demo_select
    icon: mdi:presentation-play
    optimistic: true
    options: ["Off", "National Rail", "London Underground"]
    initial_option: "Off"
    entity_category: config
    on_value:
      - lambda: 'id(demo_kind) = (int) i;'
      - if:
          condition:
            lambda: 'return i > 0;'
          then:
            - script.execute: demo_fill
          else:
            # back to real trains: ask Home Assistant to send them straight away
            - lambda: 'id(src_tfl) = false; id(msg_text) = ""; id(msg_n) = 0; id(msg_count_s).publish_state(0);'
            - homeassistant.event:
                event: esphome.departure_board_station
                data:
                  number: !lambda 'return to_string((int) id(stn_num).state);'
  - platform: template
    name: "Update channel"
    id: update_channel
    optimistic: true
    restore_value: true
    initial_option: "Stable"
    options: ["Stable", "Beta"]
    entity_category: config
    on_value:
      - lambda: |-
          id(fw_update).set_source_url(x == "Beta" ? "${update_url_beta}" : "${update_url}");
      - if:
          condition:
            lambda: 'return millis() > 60000;'   # changed by hand, not restored at boot
          then:
            - component.update: fw_update
