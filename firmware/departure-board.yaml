      // ---- train 10 ----
      {
        std::string sched, exp, stat, plat, pchg, calls, dreason, creason, oper, delaym, stops, sarr, earr, pprev;
        switch (si) {
          case 0: sched = id(stn_t10_scheduled_departure).state; exp = id(stn_t10_expected_departure).state; stat = id(stn_t10_status).state; plat = id(stn_t10_platform).state; pchg = id(stn_t10_platform_changed).state; calls = id(stn_t10_calling_points).state; dreason = id(stn_t10_delay_reason).state; creason = id(stn_t10_cancellation_reason).state; oper = id(stn_t10_operator).state; delaym = id(stn_t10_delay_minutes).state; stops = id(stn_t10_stops).state; sarr = id(stn_t10_scheduled_arrival).state; earr = id(stn_t10_estimated_arrival).state; pprev = id(stn_t10_previous_platform).state; break;
        }
        std::string reason = (stat == "cancelled") ? creason : dreason;
        // Tube rows: "Jubilee - N/bound - Left West Hampstead" so where the train is fits
        std::string oper_s = oper;
        if (id(src_tfl)) {
          size_t lp = oper_s.find(" line - ");
          if (lp != std::string::npos) oper_s.erase(lp, 5);
          static const char *const DIRS[4][2] = {{"Northbound", "N/bound"}, {"Southbound", "S/bound"}, {"Eastbound", "E/bound"}, {"Westbound", "W/bound"}};
          for (auto &d : DIRS) { size_t dp = oper_s.find(d[0]); if (dp != std::string::npos) { oper_s.replace(dp, strlen(d[0]), d[1]); break; } }
        }
        bool cancelled = (stat == "cancelled");
        if (departure::valid(sched) && nowmin >= 0) {
          const std::string &tt = exp.size() >= 5 ? exp : sched;
          int dm = ((atoi(tt.substr(0, 2).c_str()) * 60 + atoi(tt.substr(3, 2).c_str()) - nowmin) % 1440 + 1440) % 1440;
          if (dm <= 720 || 1440 - dm <= 10) n_recent++;
        }
        if (departure::valid(sched) && !departure::departed(exp.empty() ? sched : exp, nowmin, grace)
            && departure::calls_at(calls, filt) && !(cancelled && id(hide_cancelled).state)) {
          std::string dest = departure::destination(calls, DMAX);
          bool late = (stat == "delayed");
          const int eidx = elig++;
          if (eidx < 10) id(elig_list)[eidx] = 10;
          const int tnum = 10;
          if (eidx < 10) cmp_tall_now[eidx] = (late || cancelled) && departure::valid(reason);
          {
            int lm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
            if (leave_mins < 0 && !cancelled && lm >= 0 && lm >= walk) leave_mins = lm - walk;
          }
          if (detail) {
            if (id(detail_train) == 10) {
              draw_detail(sched, exp, plat, pchg, calls, reason, oper, delaym, stops, sarr, earr, pprev, cancelled, late); dfound = true;
            }
          } else if (view != 0) {
            focus_add(10, sched, exp, plat, pchg, pprev, calls, oper, delaym, reason, cancelled, late);
          } else if ((lay == 2 ? (slot < 10 && eidx < 10 && cmp_y[eidx < 10 ? eidx : 0] != C_NONE) : slot < count) && on_page(eidx) && !switching) {
          id(slot_train)[slot] = 10;
          id(slot_ybot)[slot] = (lay == 2) ? cmp_bot[eidx] : 6 + HDR + (slot + 1) * H;
          int y = (lay == 2) ? cmp_y[eidx] : 6 + HDR + slot * H + pad;
          // page animation: the text slides up into its row, one row after another (the pinned top train stays)
          int aoff = 0;
          const int arow_top = slot > 0 ? id(slot_ybot)[slot - 1] : 6 + HDR;
          if (anim_active && !(eidx == 0 && (lay == 2 || pin))) {
            const int k = slot - ((lay == 2 || pin) ? 1 : 0);   // order among the rows that move
            int el = (int) (millis() - anim_t0) - 150 * k;      // rows appear one after another
            float p = el <= 0 ? 0.f : (el >= 250 ? 1.f : el / 250.f);
            p = 1.f - (1.f - p) * (1.f - p);
            aoff = (int) ((id(slot_ybot)[slot] - arow_top) * (1.f - p));
          }
          y += aoff;
          if (aoff > 0) it.start_clipping(0, arow_top, 800, id(slot_ybot)[slot]);
          int mins = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
          bool soon = walk > 0 && !cancelled && mins >= 0 && mins < walk;   // too soon to walk there
          Color c0 = soon ? grey : amber;
          Color c0s = soon ? grey : sub_col;
          if (cancelled && id(fade_cancelled).state) { c0 = cxl_col; c0s = cxl_col; }
          it.printf(TX, y, fr, c0, "%s", sched.c_str());
          if (id(src_tfl) && id(tfl_colours).state && pprev.size() == 7 && pprev[0] == '#') {
            // TfL line colour (sent in place of the previous platform), brightened so dark lines show on black
            int cr = strtol(pprev.substr(1, 2).c_str(), nullptr, 16), cg = strtol(pprev.substr(3, 2).c_str(), nullptr, 16), cb = strtol(pprev.substr(5, 2).c_str(), nullptr, 16);
            warm_rgb(cr, cg, cb);
            const int mx = std::max(cr, std::max(cg, cb));
            if (mx == 0) { cr = cg = cb = 200; }
            else if (mx < 150) { cr = cr * 150 / mx; cg = cg * 150 / mx; cb = cb * 150 / mx; }   // only the darkest lines (Piccadilly blue) are lifted
            const int bt = slot > 0 ? id(slot_ybot)[slot - 1] : 6 + HDR;
            const int bh = id(slot_ybot)[slot] - bt - 6;
            if (bh > 0) it.filled_rectangle(10, bt + 3 + aoff, 5, bh, Color(cr, cg, cb));
          }
          if (departure::in_list(favs, sched)) {
            int ux, uy, uw, uh;
            it.get_text_bounds(TX, y, sched.c_str(), fr, TextAlign::TOP_LEFT, &ux, &uy, &uw, &uh);
            it.filled_rectangle(ux, uy + uh + 2, uw, 3, c0);
          }
          it.printf(DX, y, fr, c0, "%s", dest.c_str());
          if (id(show_platform).state && departure::valid(plat) && !cancelled) {
            const bool pbus = plat.find("Bus") != std::string::npos || plat.find("bus") != std::string::npos;
            const std::string pshow = pbus ? std::string("Bus") : plat;
            // a change only when there was a platform before (a first allocation is not a change)
            if (departure::truthy(pchg) && departure::valid(pprev) && !pbus && !id(src_tfl)) {
              // platform changed: flash it for the first minute this train is shown with the new platform
              std::string pk = sched + "|" + dest + "|" + plat;
              auto pit = pchg_seen.find(pk);
              if (pit == pchg_seen.end()) {
                if (pchg_seen.size() > 20) pchg_seen.clear();
                pit = pchg_seen.emplace(pk, millis()).first;
              }
              bool hide = millis() - pit->second < 60000 && (millis() / 500) % 2;
              if (!hide) it.printf(PX, y, fr, orange, TextAlign::TOP_RIGHT, "%s", pshow.c_str());
            } else {
              it.printf(PX, y, fr, c0, TextAlign::TOP_RIGHT, "%s", pshow.c_str());
            }
          }
          char cd[16];
          if (mins <= 1) snprintf(cd, sizeof(cd), "Due"); else snprintf(cd, sizeof(cd), "%d min", mins);
          bool countdown = (id(countdown_mode).state || id(src_tfl)) && mins >= 0 && mins < 60;
          if (cancelled)
            it.printf(784, y, fr, red, TextAlign::TOP_RIGHT, "Cancelled");
          else if (id(src_tfl) && stat == "arriving")            // TfL: approaching or at this station
            it.printf(784, y, fr, soon ? grey : green, TextAlign::TOP_RIGHT, "Arriving");
          else if (late && !(exp.size() >= 5 && isdigit((unsigned char) exp[0])))   // late, no new time yet
            it.printf(784, y, fr, soon ? grey : orange, TextAlign::TOP_RIGHT, "Delayed");
          else if (countdown)
            it.printf(784, y, fr, soon ? grey : (late ? orange : green), TextAlign::TOP_RIGHT, "%s", cd);
          else if (late)
            it.printf(784, y, fr, soon ? grey : orange, TextAlign::TOP_RIGHT, "%s", exp.c_str());
          else
            it.printf(784, y, fr, soon ? grey : green, TextAlign::TOP_RIGHT, "On time");
          std::string arr_s;
          Color arr_c = c0s;                 // dimmed like the rest of the second line
          if (!id(route_to).empty() && !cancelled) {
            auto hm = [](const std::string &s) { return s.size() == 5 && s[2] == ':' && isdigit(s[0]) && isdigit(s[4]); };
            const bool ev = hm(earr), sv = hm(sarr);
            if (ev || sv) {
              arr_s = "Arrives " + (ev ? earr : sarr);
              if (ev && sv && earr != sarr && !soon) arr_c = sub_ora;
            }
          }
          if (!id(src_tfl) && !cancelled && lt_n < 10 && tnum == lt_last && departure::valid(sched) && sched.size() >= 5 && nowmin >= 0) {
            const int sh = atoi(sched.substr(0, 2).c_str());
            const std::string &lt = exp.size() >= 5 && isdigit(exp[0]) ? exp : sched;
            const int ld = ((atoi(lt.substr(0, 2).c_str()) * 60 + atoi(lt.substr(3, 2).c_str()) - nowmin) % 1440 + 1440) % 1440;
            if ((sh >= 21 || sh < 3) && ld <= 60) arr_s = arr_s.empty() ? std::string("Last train") : "Last train  -  " + arr_s;
          }
          if (lay != 0 && eidx != 0) {                       // only the next train scrolls, on every page
            // Calm and Compact: only the first train scrolls. Later rows stay still: the reason in
            // orange/red for a late or cancelled train; otherwise the operator (Calm) or nothing (Compact)
            std::string msg;
            Color mc = grey;
            if ((late || cancelled) && departure::valid(reason)) {
              msg = reason;                                   // the time column already shows the delay
              mc = cancelled ? red : orange;
            } else if (lay == 1) {
              mc = soon ? grey : sub_col;
              msg = departure::valid(oper) ? oper_s : "Calling at " + (departure::valid(stops) ? stops : departure::calling_list(calls, 200));
            }
            int ry = (lay == 2) ? (cmp_ry[eidx] == C_NONE ? C_NONE : cmp_ry[eidx] + aoff) : y + SUBOFF;
            int ax = DX;
            if (!arr_s.empty() && ry != C_NONE) {
              if (!msg.empty()) arr_s += "  -  ";
              int abx, aby, abw, abh;
              it.get_text_bounds(0, 0, arr_s.c_str(), fs, TextAlign::TOP_LEFT, &abx, &aby, &abw, &abh);
              it.printf(DX, ry, fs, arr_c, "%s", arr_s.c_str());
              ax = DX + abw;
            }
            if (!msg.empty() && ry != C_NONE) {
              const int avail = SW - (ax - DX);
              int mbx, mby, mbw, mbh;
              it.get_text_bounds(0, 0, msg.c_str(), fs, TextAlign::TOP_LEFT, &mbx, &mby, &mbw, &mbh);
              if (id(src_tfl) && id(scroll_enabled).state && mbw > avail) {
                // a long Tube location scrolls: pause, glide to the end, pause, back to the start
                const int over = mbw - avail;
                const uint32_t move = (uint32_t) over * 1000 / sp, cyc = 2500 + move + 2500;
                const uint32_t ph = millis() % cyc;
                const int off = ph < 2500 ? 0 : (ph < 2500 + move ? (int) ((ph - 2500) * sp / 1000) : over);
                it.start_clipping(ax, ry - 10, ax + avail, ry + mbh + 20);
                it.printf(ax - off, ry, fs, mc, "%s", msg.c_str());
                it.end_clipping();
              } else {
                fit(msg, fs, avail);
                it.printf(ax, ry, fs, mc, "%s", msg.c_str());
              }
            }
            if (aoff > 0) it.end_clipping();
            slot++;
          } else {
          // scrolling sub-line: reason (orange/red) then "Calling at ..."
          if (delaym.size() > 2 && delaym.compare(delaym.size() - 2, 2, ".0") == 0) delaym.resize(delaym.size() - 2);
          std::string head;
          if (late && departure::valid(delaym) && delaym != "0") head = "Delayed " + delaym + " min";
          else if (cancelled) head = "Cancelled";
          const size_t labn = head.size();       // just this label is coloured
          if (departure::valid(reason)) head += (head.empty() ? "" : " - ") + reason;
          if (!head.empty()) head += "   -   ";
          std::string lst = departure::valid(stops) ? stops : departure::calling_list(calls, 200);
          std::string tail = id(src_tfl) ? oper_s : (departure::valid(oper) ? oper + " - " : "") + "Calling at " + lst;
          int bx, by, bw, bh, tw;
          int aw = 0;
          if (!arr_s.empty()) {
            arr_s += "  -  ";
            it.get_text_bounds(0, 0, arr_s.c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &aw, &bh);
          }
          it.get_text_bounds(0, 0, (head + tail).c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
          bool scroll = bw + aw > SW && id(scroll_enabled).state;
          if (bw + aw > SW && !scroll) {
            size_t keep = (head.size() + tail.size()) * std::max(0, SW - 44 - aw) / bw;
            if (keep <= head.size()) { head.resize(keep); head += "..."; tail = ""; }
            else { tail.resize(keep - head.size()); tail += "..."; }
            it.get_text_bounds(0, 0, (head + tail).c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
          }
          it.get_text_bounds(0, 0, tail.c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &tw, &bh);
          int hw = bw - tw;
          Color rc = cancelled ? red : orange;
          int sy = y + SUBOFF;
          // favourite stop: drawn in white
          int hend = 0;
          int hpos = departure::find_stop(tail, fstop, hend);
          std::string pre, seg, post;
          int wpre = 0, wseg = 0;
          if (hpos >= 0) {
            pre = tail.substr(0, hpos);
            seg = tail.substr(hpos, hend - hpos);
            post = tail.substr(hend);
            int sbx, sby, sbh;
            if (!pre.empty()) { it.get_text_bounds(0, 0, pre.c_str(), fs, TextAlign::TOP_LEFT, &sbx, &sby, &wpre, &sbh); }
            it.get_text_bounds(0, 0, seg.c_str(), fs, TextAlign::TOP_LEFT, &sbx, &sby, &wseg, &sbh);
          }
          auto drawsub = [&](int x) {
            if (aw > 0) { it.printf(x, sy, fs, arr_c, "%s", arr_s.c_str()); x += aw; }
            if (!head.empty()) {
              size_t k = std::min(labn, head.size());
              std::string l1 = head.substr(0, k), l2 = head.substr(k);
              int lw = 0;
              if (!l1.empty()) {
                int a, b, c;
                it.get_text_bounds(0, 0, l1.c_str(), fs, TextAlign::TOP_LEFT, &a, &b, &lw, &c);
                it.printf(x, sy, fs, rc, "%s", l1.c_str());
              }
              if (!l2.empty()) it.printf(x + lw, sy, fs, c0s, "%s", l2.c_str());
            }
            if (tail.empty()) return;
            if (hpos < 0) {
              it.printf(x + hw, sy, fs, c0s, "%s", tail.c_str());
            } else {
              int tx = x + hw;
              if (!pre.empty()) it.printf(tx, sy, fs, c0s, "%s", pre.c_str());
              it.printf(tx + wpre, sy, fs, hilite, "%s", seg.c_str());
              if (!post.empty()) it.printf(tx + wpre + wseg, sy, fs, c0s, "%s", post.c_str());
            }
          };
          it.start_clipping(DX, sy - 2, 784, sy + std::max(SUBH, (int) fs->get_height()) + 2);
          if (!scroll) {
            drawsub(DX);
          } else {
            int cyc = bw + aw + 120;
            int off = (int) (((uint64_t) (millis() - page_t0) * sp / 1000) % cyc);
            drawsub(DX - off);
            drawsub(DX - off + cyc);
          }
          it.end_clipping();
          if (aoff > 0) it.end_clipping();
          slot++;
          }
          }
        }
      }

      // focus mode / clock screen: skip trains too soon to walk to (if a walking time is set), then draw
      if (view != 0 && !detail && !focus.empty()) {
        size_t pick = 0;
        for (size_t k = 0; k < focus.size(); k++) {
          const FocusTrain &f = focus[k];
          if (!(walk > 0 && !f.cancelled && f.mins >= 0 && f.mins < walk)) { pick = k; break; }
        }
        const FocusTrain *t2 = (pick + 1 < focus.size()) ? &focus[pick + 1] : nullptr;
        const FocusTrain *t3 = (pick + 2 < focus.size()) ? &focus[pick + 2] : nullptr;
        draw_next(view, focus[pick], t2, t3);
        id(slot_train)[0] = focus[pick].n;
        slot = 1;
      }

      {
        // publish "minutes until you must leave" to HA (only when it changes)
        int lv = (walk > 0 && leave_mins >= 0) ? leave_mins : -1;
        if (!detail && view == 0 && (!id(leave_in_s).has_state() || (int) id(leave_in_s).state != lv)) id(leave_in_s).publish_state(lv);
      }

      elig_prev = elig;
      id(elig_count) = elig;
      cmp_tall = cmp_tall_now;
      if (detail && !dfound) id(ui_screen) = 0;      // the train has gone: back to the list

      if (switching && !detail) {
        it.printf(400, 175, F_ROWL[fi], amber, TextAlign::CENTER, "Switching station or route");
        if (id(stn_count) > 1) {
          char sb[24];
          snprintf(sb, sizeof(sb), "%d of %d", (int) id(stn_num).state, (int) id(stn_count));
          it.printf(400, 235, F_SUB[fi], sub_col, TextAlign::CENTER, "%s", sb);
        }
      }
      if (id(fav_toast_until) != 0) {
        if ((int32_t) (id(fav_toast_until) - millis()) > 0) {
          it.filled_rectangle(100, 180, 600, 64, band_col);
          it.rectangle(100, 180, 600, 64, hilite);
          it.rectangle(101, 181, 598, 62, hilite);
          it.printf(400, 212, id(f_row_0), amber, TextAlign::CENTER, "%s", id(fav_toast).c_str());
        } else id(fav_toast_until) = 0;
      }
      if (id(flash_slot) >= 0 && view == 0 && !detail) {
        if (millis() < id(flash_until)) {
          const int sl = id(flash_slot);
          const int top = sl > 0 ? id(slot_ybot)[sl - 1] : 6 + HDR;
          const int bot = id(slot_ybot)[sl];
          if (bot > top) { it.rectangle(10, top, 780, bot - top, hilite); it.rectangle(11, top + 1, 778, bot - top - 2, hilite); }
        } else {
          id(flash_slot) = -1;
          if (id(pending_detail) > 0) { id(detail_train) = id(pending_detail); id(ui_screen) = 2; id(last_fresh) = millis(); }
          id(pending_detail) = 0;
        }
      }
      // nothing to show: say why
      if (slot == 0 && !detail && elig == 0) {
        std::string l1, l2;
        bool big = false;
        std::string h1, h2;          // help lines in the smaller, softer text
        bool waiting = false;        // show moving dots
        const bool setup_scr = !wifi_ok || !api_ok || dms == 0;
        if (!wifi_ok) {
          l1 = "Connecting to Wi-Fi"; h1 = "This usually takes a few seconds"; waiting = true;
        } else if (!api_ok) {
          l1 = "Waiting for Home Assistant";
          h1 = "Add the board in Settings > Devices & services";
          const std::string ip = id(wifi_ip_ts).state;
          if (!ip.empty()) h2 = "Board address: " + ip;
          waiting = true;
        } else if (dms == 0 && millis() < 120000) {
          l1 = "Connected to Home Assistant"; h1 = "Waiting for train data from the automation"; waiting = true;
        } else if (dms == 0) {
          l1 = "No train data received";
          h1 = "Check the UK Departure Board automation";
          h2 = "is set up and switched on in Home Assistant";
        } else if (millis() - dms > 30UL * 60000UL) {
          l1 = "Train data is out of date";
          char ab[40];
          snprintf(ab, sizeof(ab), "Last update %u min ago", (unsigned) ((millis() - dms) / 60000));
          h1 = ab;
          h2 = "Check Home Assistant and My Rail Commute";
        } else if (!filt.empty()) {
          l1 = "No trains calling at"; l2 = filt;
        } else if (n_recent > 0) {
          l1 = "Waiting for new train times";
          h1 = "The trains listed have all just left";
          h2 = "At a busy station, a route works better";
          waiting = true;
        } else {
          l1 = "No more trains"; l2 = "tonight"; big = true;
        }
        if (big) {
          // nothing more today: big clock with the message underneath
          draw_bigclock();
          it.printf(400, 300, F_ROWL[fi], amber, TextAlign::CENTER, "No more trains tonight");
        } else {
          if (setup_scr) draw_logo(400, 30, 6, 2, 2, amber, band_col, 0);
          int yy = (h1.empty() && l2.empty()) ? 190 : 140;
          it.printf(400, yy, F_ROWL[fi], amber, TextAlign::CENTER, "%s", l1.c_str());
          if (!l2.empty()) { yy += 65; it.printf(400, yy, F_ROWL[fi], amber, TextAlign::CENTER, "%s", l2.c_str()); }
          if (!h1.empty()) { yy += 60; fit(h1, F_SUB[fi], 760); it.printf(400, yy, F_SUB[fi], sub_col, TextAlign::CENTER, "%s", h1.c_str()); }
          if (!h2.empty()) { yy += 40; fit(h2, F_SUB[fi], 760); it.printf(400, yy, F_SUB[fi], sub_col, TextAlign::CENTER, "%s", h2.c_str()); }
          if (waiting) {
            // five dots, one lit, moving along so you can see the board is working
            const int lit = (int) ((millis() / 300) % 5);
            for (int d = 0; d < 5; d++) it.filled_circle(400 - 2 * 24 + d * 24, yy + 55, d == lit ? 6 : 4, d == lit ? amber : grey);
          }
        }
      }

      // footer: station left, status/info in the middle, clock right
      const int fy = 418;
      std::string info;
      Color infoc = amber;
      uint32_t age_min = dms ? (millis() - dms) / 60000 : 0;
      if (detail) { info = "< Prev  Close  Next >"; infoc = amber; }
      else if (!wifi_ok) { info = "No Wi-Fi"; infoc = red; }
      else if (!api_ok) { info = "No Home Assistant"; infoc = red; }
      else if (dms != 0 && age_min >= 5) {
        char ab[32];
        snprintf(ab, sizeof(ab), "Data %d min old", (int) age_min);
        info = ab;
        infoc = red;
      }
      else if (id(disruption_banner).state && departure::valid(disr) && disr != "Normal" && disr != "No service") {
        info = disr;
        infoc = (disr.find("ajor") != std::string::npos || disr.find("ritical") != std::string::npos || disr.find("evere") != std::string::npos) ? red : orange;
      }
      else if (walk > 0 && leave_mins >= 0) {
        char lb[32];
        if (leave_mins <= 0) snprintf(lb, sizeof(lb), "Leave now");
        else snprintf(lb, sizeof(lb), "Leave in %d min", leave_mins);
        info = lb;
        infoc = green;
      }
      else if (!id(help_seen) && view == 0) {
        info = "Tap the clock for help";
        infoc = sub_col;
      }
      else if (pages > 1) {
        char pb[24];
        snprintf(pb, sizeof(pb), "Page %d of %d", page + 1, pages);
        info = pb;
        infoc = amber;
      }
      const Color footc = (id(footer_colour).active_index().value_or(0) == 1) ? (id(bg_col).r > 200 ? Color(26, 26, 26) : Color(255, 255, 255)) : amber;   // logo and station name (dark on Daylight)
      std::string foot = STATION_NAMES[si];
      if (info.empty() && (HDR == 0 || view != 0)) {
        if (!filt.empty()) foot += " > " + filt;
        else if (!id(route_to).empty()) foot += " > " + id(route_to);
      }
      int fx = 20;
      if (id(show_logo).state && (id(src_tfl) ? id(logo_tfl_ok) : id(logo_ok))) {
        // custom logo from Home Assistant, centred in the 56x35 logo space
        auto *lg = id(src_tfl) ? id(custom_logo_tfl) : id(custom_logo);
        if (id(src_tfl)) {
          // TfL logo in the footer colour: its coloured parts (a roundel's ring and bar) in the footer colour and
          // its white parts (the lettering) left in the background colour; an all-white logo is drawn whole
          const int ox = 20 + (56 - lg->get_width()) / 2, oy = fy + 7 + (35 - lg->get_height()) / 2;
          for (int py = 0; py < lg->get_height(); py++)
            for (int px = 0; px < lg->get_width(); px++) {
              const Color c = lg->get_pixel(px, py);
              if (c.w < 128) continue;                                   // transparent
              const bool light = (c.r * 30 + c.g * 59 + c.b * 11) / 100 > 190;
              it.draw_pixel_at(ox + px, oy + py, (light && !id(logo_tfl_light)) ? bg_col : footc);
            }
        } else it.image(20 + (56 - lg->get_width()) / 2, fy + 7 + (35 - lg->get_height()) / 2, lg, footc, bg_col);
        fx = 20 + 56 + 14;
      } else if (id(show_logo).state) {
        int lx = 20, ly = fy + 7;
        if (id(src_tfl)) {
          // tunnel, 56x35: an arch with the track running into the distance
          for (int py = 0; py <= 24; py++)
            for (int px = 4; px <= 52; px++) {
              const int ddx = px - 28, ddy = py - 24, d2 = ddx * ddx + ddy * ddy;
              if (d2 >= 20 * 20 && d2 < 24 * 24) it.draw_pixel_at(lx + px, ly + py, footc);
            }
          it.filled_rectangle(lx + 4, ly + 24, 4, 11, footc);                // the arch's sides
          it.filled_rectangle(lx + 49, ly + 24, 4, 11, footc);
          const int sly[3] = {20, 25, 30}, shw[3] = {6, 9, 12}, sh[3] = {2, 2, 3};
          for (int k = 0; k < 3; k++) it.filled_rectangle(lx + 28 - shw[k], ly + sly[k], 2 * shw[k] + 1, sh[k], footc);   // sleepers
          it.line(lx + 27, ly + 14, lx + 15, ly + 34, footc);                // rails
          it.line(lx + 28, ly + 14, lx + 16, ly + 34, footc);
          it.line(lx + 28, ly + 14, lx + 40, ly + 34, footc);
          it.line(lx + 29, ly + 14, lx + 41, ly + 34, footc);
        } else {
          // railway track, 56x35
          for (int sx = 3; sx < 56; sx += 11) it.filled_rectangle(lx + sx, ly + 7, 4, 22, footc);   // sleepers
          it.filled_rectangle(lx, ly + 11, 56, 3, footc);                    // rails
          it.filled_rectangle(lx, ly + 22, 56, 3, footc);
        }
        fx = 20 + 56 + 14;
      }
      // station, message and clock share one baseline; the clock is placed first, then the rest fits around it
      const int fb = fy + 34;
      int clk_left = 784;
      if (tv) {
        char cb[24];
        int hh = now.hour;
        const char *ap = "";
        if (id(clock_12h).state) { ap = hh >= 12 ? "pm" : "am"; hh = hh % 12; if (hh == 0) hh = 12; }
        if (id(show_seconds).state) snprintf(cb, sizeof(cb), "%02d:%02d:%02d%s", hh, now.minute, now.second, ap);
        else snprintf(cb, sizeof(cb), "%02d:%02d%s", hh, now.minute, ap);
        int kbx, kby, kbw, kbh;
        it.get_text_bounds(784, fb, cb, F_CLK[fi], TextAlign::BASELINE_RIGHT, &kbx, &kby, &kbw, &kbh);
        clk_left = kbx;
        it.printf(784, fb, F_CLK[fi], amber, TextAlign::BASELINE_RIGHT, "%s", cb);
      }
      id(msg_icon_x) = -1;
      if (id(msg_n) > 0 && !detail && !switching) {
        const int icx = clk_left - 34, icy = fb - 11;
        const bool flash = millis() - id(msg_new_ms) < 6000 && (millis() / 400) % 2;   // flashes when a message arrives
        const Color ic = flash ? hilite : orange;
        it.circle(icx, icy, 16, ic);
        it.circle(icx, icy, 15, ic);
        it.printf(icx, icy, F_SUB[fi], ic, TextAlign::CENTER, "i");
        if (id(msg_n) > 1) {
          char nb[4];
          snprintf(nb, sizeof(nb), "%d", std::min(id(msg_n), 9));
          it.filled_circle(icx + 15, icy - 11, 10, ic);
          it.printf(icx + 15, icy - 11, id(f_hdr_0), bg_col, TextAlign::CENTER, "%s", nb);
        }
        id(msg_icon_x) = icx - 30;
        clk_left = icx - 20;
      }
      id(upd_icon_x) = -1;
      if (id(fw_update).state == update::UPDATE_STATE_AVAILABLE && !detail && !switching) {
        // update ready: an up arrow in a circle, left of the clock (and of the message icon)
        const int ucx = clk_left - 34, ucy = fb - 11;
        it.circle(ucx, ucy, 16, orange);
        it.circle(ucx, ucy, 15, orange);
        it.filled_triangle(ucx, ucy - 10, ucx - 8, ucy, ucx + 8, ucy, orange);
        it.filled_rectangle(ucx - 3, ucy, 7, 10, orange);
        id(upd_icon_x) = ucx - 30;
        clk_left = ucx - 20;
      }
      int info_left = clk_left;
      if (!info.empty()) {
        fit(info, F_SUB[fi], clk_left - 24 - (fx + 160));
        int ibx, iby, ibw, ibh;
        it.get_text_bounds(0, 0, info.c_str(), F_SUB[fi], TextAlign::TOP_LEFT, &ibx, &iby, &ibw, &ibh);
        info_left = clk_left - 24 - ibw;
        it.printf(clk_left - 24, fb, F_SUB[fi], infoc, TextAlign::BASELINE_RIGHT, "%s", info.c_str());
      }
      fit(foot, F_SUB[fi], info_left - 20 - fx);
      it.printf(fx, fb, F_SUB[fi], footc, TextAlign::BASELINE_LEFT, "%s", foot.c_str());

image:
  # Custom logo: light pixels are drawn in the theme colour, dark/transparent ones are left out.
  - platform: online_image
    id: custom_logo
    url: "http://homeassistant.local:8123/local/departure-board-logo.png"   # replaced by the logo image setting
    format: PNG
    type: BINARY
    transparency: chroma_key
    resize: 56x35
    buffer_size: 16384
    on_download_finished:
      - lambda: 'id(logo_ok) = true;'
    on_error:
      - lambda: 'id(logo_ok) = false;'
  # Custom logo for TfL (Tube / DLR) stations, set in the "TfL board logo image" setting
  - platform: online_image
    id: custom_logo_tfl
    url: "http://homeassistant.local:8123/local/departure-board-tfl-logo.png"   # replaced by the TfL logo image setting
    format: PNG
    type: RGB565          # read in colour, drawn in the footer colour (see the logo drawing)
    transparency: chroma_key
    resize: 56x35
    buffer_size: 16384
    on_download_finished:
      - lambda: |-
          // an all-light logo (white on transparent) is drawn whole; a coloured one has its light parts cut out
          auto *lg = id(custom_logo_tfl);
          int dark = 0, light = 0;
          for (int py = 0; py < lg->get_height(); py++)
            for (int px = 0; px < lg->get_width(); px++) {
              const Color c = lg->get_pixel(px, py);
              if (c.w < 128) continue;
              if ((c.r * 30 + c.g * 59 + c.b * 11) / 100 > 190) light++; else dark++;
            }
          id(logo_tfl_light) = dark * 10 < light;      // almost no dark pixels
          id(logo_tfl_ok) = true;
    on_error:
      - lambda: 'id(logo_tfl_ok) = false;'
