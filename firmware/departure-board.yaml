      int rT, rB, sT, sB;
      ink_of(fr, rT, rB);
      ink_of(fs, sT, sB);
      // sub line sits just below the main line's letters: 2 px band padding each side + 3 px gap
      const int SUBOFF = rB + 7 - sT;
      const int ink_top = rT;
      const int ink_bot = SUBOFF + sB;
      const int SUBH = L ? 38 : 32;
      const int SW = 784 - DX;                  // sub-line width
      int pad = (H - (ink_bot - ink_top)) / 2 - ink_top;
      if (pad < -ink_top) pad = -ink_top;
      const int speeds[3] = {20, 30, 50};       // scroll px per second
      const int sp = speeds[id(scroll_speed).active_index().value_or(1)];
      const std::string filt = id(dest_filter).state;
      int lt_n = 0, lt_last = 0;        // trains sent, and the number of the last one (for "Last train")
      {
        const std::string *S[10] = {&id(stn_t1_scheduled_departure).state, &id(stn_t2_scheduled_departure).state, &id(stn_t3_scheduled_departure).state, &id(stn_t4_scheduled_departure).state, &id(stn_t5_scheduled_departure).state, &id(stn_t6_scheduled_departure).state, &id(stn_t7_scheduled_departure).state, &id(stn_t8_scheduled_departure).state, &id(stn_t9_scheduled_departure).state, &id(stn_t10_scheduled_departure).state};
        for (int i = 0; i < 10; i++) if (departure::valid(*S[i])) { lt_n++; lt_last = i + 1; }
      }
      const std::string favs = id(fav_times).state;
      const std::string fstop = id(fav_stop).state;       // favourite stop to highlight
      const int walk = (int) id(walk_minutes).state;
      const int grace = (int) id(departed_grace).state;
      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      const bool api_ok = api::global_api_server->is_connected();
      int leave_mins = -1;
      int n_recent = 0;                 // trains Home Assistant sent that leave from 10 min ago onwards
      int slot = 0;
      if (id(ui_screen) == 2 && millis() - id(last_fresh) > 30000) id(ui_screen) = 0;   // detail view times out
      const bool detail = (id(ui_screen) == 2);
      // view: 0 = list, 1 = focus on the next train, 2 = clock screen (after idle time)
      const bool clock_idle = id(clock_after).state > 0 && (millis() - id(last_touch_any)) > (uint32_t) (id(clock_after).state * 60000.0f);
      const int view = detail ? 0 : (clock_idle ? 2 : (id(focus_mode).state ? 1 : 0));
      bool dfound = false;
      // just switched station: hide the old station's trains until the new ones arrive
      const bool switching = id(stn_switch_ms) != 0 && id(data_ms_stn) < id(stn_switch_ms) && millis() - id(stn_switch_ms) < 15000;
      // paging: the trains that can be shown are split into pages of `count` rows
      static int elig_prev = 0;
