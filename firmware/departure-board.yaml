        }
        pages = id(paging_on).state ? last + 1 : 1;
      }
      const uint32_t page_ms = (uint32_t) (id(page_secs).state * 1000.0f);
      const int page = pages > 1 ? (int) ((millis() / page_ms) % pages) : 0;
      const uint32_t page_t0 = pages > 1 ? (millis() / page_ms) * page_ms : 0;   // scrolling restarts each page
      if (lay == 2 && view == 0 && !detail) {
        cmp_y[0] = C_Y0;
