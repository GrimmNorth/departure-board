  # Press and hold a train: its departure time is added to (or removed from) Favourite trains
  - id: fav_hold
    parameters:
      hy: int
    then:
      - lambda: |-
          if (id(ui_screen) != 0 || hy >= 406) return;
          int sl = -1;
          if (id(focus_mode).state) sl = 0;
          else for (int i = 0; i < 10; i++) { if (id(slot_train)[i] == 0) break; if (hy < id(slot_ybot)[i]) { sl = i; break; } }
          const int tn = sl >= 0 ? id(slot_train)[sl] : 0;
          if (tn <= 0) return;
          std::string t;
          switch (tn) { case 1: t = id(stn_t1_scheduled_departure).state; break; case 2: t = id(stn_t2_scheduled_departure).state; break; case 3: t = id(stn_t3_scheduled_departure).state; break; case 4: t = id(stn_t4_scheduled_departure).state; break; case 5: t = id(stn_t5_scheduled_departure).state; break; case 6: t = id(stn_t6_scheduled_departure).state; break; case 7: t = id(stn_t7_scheduled_departure).state; break; case 8: t = id(stn_t8_scheduled_departure).state; break; case 9: t = id(stn_t9_scheduled_departure).state; break; case 10: t = id(stn_t10_scheduled_departure).state; break; default: break; }
          if (!departure::valid(t) || t.size() < 5) return;
          t = t.substr(0, 5);
          std::vector<std::string> v;
          std::string cur;
          for (char ch : id(fav_times).state + ",") { if (ch == ',' || ch == ' ') { if (!cur.empty()) v.push_back(cur); cur.clear(); } else cur += ch; }
          bool had = false;
          std::string out;
          for (auto &s : v) {
            if (s == t) { had = true; continue; }
            if (!out.empty()) out += ", ";
            out += s;
          }
          if (!had) {
            if (out.size() + 7 > 80) { id(fav_toast) = "Favourites are full"; id(fav_toast_until) = millis() + 2500; id(main_display).update(); return; }
            if (!out.empty()) out += ", ";
            out += t;
          }
          auto c = id(fav_times).make_call();
          c.set_value(out);
          c.perform();
          id(fav_toast) = had ? t + " removed from favourites" : t + " is now a favourite";
          id(fav_toast_until) = millis() + 2500;
          if (!id(focus_mode).state) { id(flash_slot) = sl; id(flash_until) = millis() + 400; id(pending_detail) = 0; }
          id(main_display).update();
  - id: apply_theme
    mode: single
    then:
      - lambda: |-
          static const uint8_t P[6][8][3] = {
              {{0, 0, 0}, {255, 176, 0}, {255, 77, 0}, {255, 0, 0}, {51, 255, 51}, {115, 115, 115}, {255, 255, 255}, {30, 26, 16}},
              {{0, 0, 0}, {242, 242, 242}, {255, 176, 0}, {255, 59, 59}, {125, 255, 125}, {110, 110, 110}, {255, 200, 0}, {30, 30, 30}},
              {{11, 31, 74}, {255, 255, 255}, {255, 212, 0}, {255, 90, 90}, {123, 228, 149}, {120, 135, 170}, {255, 212, 0}, {24, 50, 104}},
              {{2, 10, 2}, {60, 255, 90}, {200, 255, 60}, {255, 80, 80}, {60, 255, 90}, {30, 110, 40}, {220, 255, 220}, {8, 28, 10}},
              {{0, 0, 0}, {255, 230, 0}, {255, 140, 0}, {255, 64, 64}, {80, 255, 80}, {150, 150, 150}, {0, 255, 255}, {24, 24, 24}},
              {{244, 241, 232}, {26, 26, 26}, {179, 92, 0}, {196, 30, 30}, {30, 122, 46}, {150, 150, 150}, {0, 70, 180}, {226, 221, 206}}
          };
          static int applied = -1, applied_w = -1;
          int t = id(theme_select).active_index().value_or(0);
          if (t == 5 && (id(dim_state) == 1 || id(dim_state) == 2)) t = 0;   // no bright screen at night
          const int w = id(pc_warm).has_state() ? (int) id(pc_warm).state : 0;
          if (t == applied && w == applied_w) return;
          applied = t; applied_w = w;
          // panel warmth: a gamma curve that darkens mid-tones (amber's green) and leaves full and zero alone
          const float g = 1.0f + 0.1f * w;
          auto gm = [&](uint8_t c) -> uint8_t { return w == 0 ? c : (uint8_t) lroundf(255.0f * powf(c / 255.0f, g)); };
          Color *dst[8] = {&id(bg_col), &id(amber), &id(orange), &id(red), &id(green), &id(grey), &id(hilite), &id(band_col)};
          // only the bright text colours: the background, bands, dots and grey stay as they are
          for (int k = 0; k < 8; k++) {
            const bool warm = (k == 1 || k == 2 || k == 3 || k == 4 || k == 6);
            *dst[k] = warm ? Color(gm(P[t][k][0]), gm(P[t][k][1]), gm(P[t][k][2])) : Color(P[t][k][0], P[t][k][1], P[t][k][2]);
          }
  - id: update_dim
    mode: single
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          uint32_t ms = millis();
          bool inwin = false;
          if (t.is_valid()) {
            int nowm = t.hour * 60 + t.minute;
            int s = id(night_start).hour * 60 + id(night_start).minute;
            int e = id(night_end).hour * 60 + id(night_end).minute;
            inwin = (s <= e) ? (nowm >= s && nowm < e) : (nowm >= s || nowm < e);
          }
          if (id(night_sun).state && (id(ha_sun).state == "below_horizon" || id(ha_sun).state == "above_horizon"))
            inwin = id(ha_sun).state == "below_horizon";
          bool night_active = id(night_dimming).state && inwin;
          bool idle_active = id(idle_minutes).state > 0 &&
                             (ms - id(last_touch_any)) > (uint32_t) (id(idle_minutes).state * 60000.0f);
          if (id(wake_until) != 0 && ms >= id(wake_until)) id(wake_until) = 0;
          bool waking = id(wake_until) != 0;
          int target = 0;
          if (night_active) target = (id(night_screen_off).state && !waking) ? 2 : 1;
          else if (idle_active) target = 3;
          int prev = id(dim_state);
          if (target == prev) return;
          id(dim_state) = target;
          if (prev == 0) {
            id(was_on) = id(backlight).current_values.is_on();
            if (id(was_on)) id(day_brightness) = id(backlight).current_values.get_brightness();
          }
          if (!id(was_on)) return;          // the screen was switched off by hand: leave it alone
          if (target == 2) {
            auto c = id(backlight).turn_off();
            c.set_transition_length(0);
            c.perform();
            return;
          }
          float b = id(day_brightness);
          if (target == 1) b = id(night_level).state / 100.0f;
          if (target == 3) b = id(idle_level).state / 100.0f;
          auto c = id(backlight).turn_on();
          c.set_brightness(b);
          c.set_transition_length(0);
          c.perform();

interval:
  # start the board's small web server once on Wi-Fi, for screenshots (the setup hotspot uses it too)
  - interval: 10s
    then:
      - lambda: |-
          static bool started = false;
          if (!wifi::global_wifi_component->is_connected()) return;
          if (!started) {
            started = true;
            struct ShotBuf : public mipi_rgb::MipiRgb {
              static uint16_t *get(mipi_rgb::MipiRgb *d) { return d->*(&ShotBuf::buffer_); }
            };
            struct Shot : public AsyncWebHandler {
              bool canHandle(AsyncWebServerRequest *request) const override {
                char ub[AsyncWebServerRequest::URL_BUF_SIZE];
                const auto u = request->url_to(ub);
                return u == "/screenshot.bmp" || u == "/screenshot.png";
              }
              void handleRequest(AsyncWebServerRequest *request) override {
                httpd_req_t *r = *request;
                const int W = id(main_display).get_width(), H = id(main_display).get_height();
                // a finished frame: the display copies it at the start of its next redraw
                id(shot_ready) = false;
                id(shot_req) = true;
                for (int w = 0; w < 100 && !id(shot_ready); w++) vTaskDelay(pdMS_TO_TICKS(20));
                uint16_t *fb = id(shot_ready) ? id(shot_buf) : nullptr;
                if (fb == nullptr || W <= 0 || H <= 0) { id(shot_req) = false; httpd_resp_send_err(r, HTTPD_500_INTERNAL_SERVER_ERROR, "Screen not ready"); return; }
                char ub2[AsyncWebServerRequest::URL_BUF_SIZE];
                if (request->url_to(ub2) == "/screenshot.png") {
                  // PNG (what Home Assistant cameras and GitHub show), stored without compression: one IDAT chunk per row
                  static uint32_t crct[256];
                  static bool crcinit = false;
                  if (!crcinit) { for (uint32_t n = 0; n < 256; n++) { uint32_t c = n; for (int k = 0; k < 8; k++) c = (c & 1) ? 0xEDB88320u ^ (c >> 1) : c >> 1; crct[n] = c; } crcinit = true; }
                  auto crc = [&](uint32_t c, const uint8_t *d, size_t n) { for (size_t i = 0; i < n; i++) c = crct[(c ^ d[i]) & 0xFF] ^ (c >> 8); return c; };
                  auto be32 = [](uint8_t *o, uint32_t v) { o[0] = v >> 24; o[1] = v >> 16; o[2] = v >> 8; o[3] = v; };
                  std::vector<uint8_t> ck;
                  auto chunk = [&](const char *type, const uint8_t *data, size_t n) -> bool {
                    ck.resize(12 + n);
                    be32(ck.data(), n);
                    memcpy(ck.data() + 4, type, 4);
                    if (n) memcpy(ck.data() + 8, data, n);
                    be32(ck.data() + 8 + n, crc(0xFFFFFFFFu, ck.data() + 4, 4 + n) ^ 0xFFFFFFFFu);
                    return httpd_resp_send_chunk(r, (const char *) ck.data(), ck.size()) == ESP_OK;
                  };
                  httpd_resp_set_type(r, "image/png");
                  httpd_resp_set_hdr(r, "Cache-Control", "no-store");
                  static const uint8_t sig[8] = {0x89, 'P', 'N', 'G', 0x0D, 0x0A, 0x1A, 0x0A};
                  if (httpd_resp_send_chunk(r, (const char *) sig, 8) != ESP_OK) return;
                  uint8_t ihdr[13];
                  be32(ihdr, W); be32(ihdr + 4, H); ihdr[8] = 8; ihdr[9] = 2; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
                  if (!chunk("IHDR", ihdr, 13)) return;
                  const size_t rl = 1 + W * 3;                       // filter byte + RGB
                  std::vector<uint8_t> d(2 + 5 + rl + 4);
                  uint32_t a1 = 1, a2 = 0;                           // Adler-32 of the image data
                  uint8_t INV[256];
                  { const int w = id(pc_warm).has_state() ? (int) id(pc_warm).state : 0; const float ig = 1.0f / (1.0f + 0.1f * w);
                    for (int k = 0; k < 256; k++) INV[k] = w == 0 ? k : (uint8_t) lroundf(255.0f * powf(k / 255.0f, ig)); }
                  for (int y = 0; y < H; y++) {
                    size_t o = 0;
                    if (y == 0) { d[o++] = 0x78; d[o++] = 0x01; }     // zlib header
                    const bool last = (y == H - 1);
                    d[o++] = last ? 1 : 0;                           // a stored deflate block
                    d[o++] = rl & 0xFF; d[o++] = rl >> 8; d[o++] = ~rl & 0xFF; d[o++] = (~rl >> 8) & 0xFF;
                    uint8_t *row = d.data() + o;
                    row[0] = 0;
                    const uint16_t *p = fb + y * W;
                    for (int x = 0; x < W; x++) {
                      const uint16_t v = __builtin_bswap16(p[x]);
                      const uint8_t R = (v >> 11) & 31, G = (v >> 5) & 63, B = v & 31;
                      const uint8_t r8 = (R << 3) | (R >> 2), g8 = (G << 2) | (G >> 4), b8 = (B << 3) | (B >> 2);
                      const bool txt = r8 >= 128 || g8 >= 128 || b8 >= 128;   // only text colours were warmed
                      row[1 + x * 3] = txt ? INV[r8] : r8; row[2 + x * 3] = txt ? INV[g8] : g8; row[3 + x * 3] = txt ? INV[b8] : b8;
                    }
                    for (size_t i = 0; i < rl; i++) { a1 = (a1 + row[i]) % 65521; a2 = (a2 + a1) % 65521; }
                    o += rl;
                    if (last) { be32(d.data() + o, (a2 << 16) | a1); o += 4; }
                    if (!chunk("IDAT", d.data(), o)) return;
                  }
                  chunk("IEND", nullptr, 0);
                  httpd_resp_send_chunk(r, nullptr, 0);
                  return;
                }
                const uint32_t row = W * 3, size = 54 + row * H;
                uint8_t h[54] = {0};
                auto put32 = [&](int at, uint32_t v) { h[at] = v; h[at + 1] = v >> 8; h[at + 2] = v >> 16; h[at + 3] = v >> 24; };
                h[0] = 'B'; h[1] = 'M'; put32(2, size); put32(10, 54); put32(14, 40); put32(18, W); put32(22, H);
                h[26] = 1; h[28] = 24; put32(34, row * H);
                httpd_resp_set_type(r, "image/bmp");
                httpd_resp_set_hdr(r, "Cache-Control", "no-store");
                if (httpd_resp_send_chunk(r, (const char *) h, sizeof(h)) != ESP_OK) return;
                std::vector<uint8_t> line(row);
                for (int y = H - 1; y >= 0; y--) {               // a BMP stores the bottom row first
                  const uint16_t *p = fb + y * W;
                  for (int x = 0; x < W; x++) {
                    const uint16_t v = __builtin_bswap16(p[x]);    // the display keeps each pixel big-endian
                    const uint8_t R = (v >> 11) & 31, G = (v >> 5) & 63, B = v & 31;
                    line[x * 3] = (B << 3) | (B >> 2); line[x * 3 + 1] = (G << 2) | (G >> 4); line[x * 3 + 2] = (R << 3) | (R >> 2);
                  }
                  if (httpd_resp_send_chunk(r, (const char *) line.data(), row) != ESP_OK) return;
                }
                httpd_resp_send_chunk(r, nullptr, 0);
              }
            };
            web_server_base::global_web_server_base->add_handler(new Shot());
            web_server_base::global_web_server_base->init();
          }
          const std::string ip = id(wifi_ip_ts).state;
          const std::string url = ip.empty() ? std::string("") : "http://" + ip + "/screenshot.png";
          if (!id(shot_ts).has_state() || id(shot_ts).state != url) id(shot_ts).publish_state(url);
  # demo boards: keep the made-up times moving with the clock
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(demo_kind) != 0;'
          then:
            - script.execute: demo_fill
  - interval: 40ms           # smooth page animation: redraw fast only while it runs
    then:
      - lambda: |-
          if (id(anim_until) != 0 && millis() < id(anim_until)) {
            uint32_t t = millis();
            id(main_display).update();
            uint32_t d = millis() - t;
            if (d > id(frame_ms)) id(frame_ms) = d;
          }
  - interval: 60s            # one timed redraw a minute, for the frame time sensor
    then:
      - lambda: |-
          uint32_t t = millis();
          id(main_display).update();
          uint32_t d = millis() - t;
          id(frame_ms) = id(frame_ms) > d ? (id(frame_ms) + d) / 2 : d;
  - interval: 2s
    then:
      - script.execute: update_dim
  # Memory watchdog: restart cleanly before low memory can freeze the board.
  - interval: 60s
    then:
      - lambda: |-
          static uint8_t low_count = 0;
          size_t fr = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t blk = heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL);
          if (fr < 16384 || blk < 8192) low_count++; else low_count = 0;
          if (low_count >= 3) {
            ESP_LOGW("watchdog", "Memory critically low (%u free, %u block) - restarting", (unsigned) fr, (unsigned) blk);
            App.safe_reboot();
          }
          // memory slowly running down: restart quietly at 03:30 instead
          auto t = id(ha_time).now();
          if (t.is_valid() && t.hour == 3 && t.minute == 30 && millis() > 3600000UL && fr < 40960) {
            ESP_LOGW("watchdog", "Memory low (%u free) - overnight restart", (unsigned) fr);
            App.safe_reboot();
          }
      - script.execute: apply_theme
  - interval: 60s
    then:
      - lambda: |-
          if (!id(logo_ok) && !id(logo_url).state.empty() && wifi::global_wifi_component->is_connected()) {
            id(custom_logo)->set_url(id(logo_url).state);
            id(custom_logo)->update();
          }
          if (!id(logo_tfl_ok) && !id(logo_tfl_url).state.empty() && wifi::global_wifi_component->is_connected()) {
            id(custom_logo_tfl)->set_url(id(logo_tfl_url).state);
            id(custom_logo_tfl)->update();
          }
i2c:
  - id: touch_i2c
    sda: GPIO19
    scl: GPIO20
    frequency: 400kHz
    scan: false              # scanning can upset the GT911

touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: touch_i2c
    address: 0x5D            # try 0x14 if touch is dead
    update_interval: 50ms
    on_touch:
      - lambda: |-
          uint32_t now = millis();
          uint32_t prev_touch = id(last_touch_any);
          id(last_touch_any) = now;
          bool fresh = !id(touch_down) || (now - id(last_event) > 400);
          id(last_event) = now;
          id(touch_down) = true;
          if (!fresh) return;
          // screen off or dimmed: the first tap only wakes it
          if (id(dim_state) == 2 || id(dim_state) == 3 || id(wake_until) != 0) {
            bool wasoff = (id(dim_state) == 2) || (id(wake_until) != 0);
            if (wasoff) id(wake_until) = now + 60000;
            id(update_dim).execute();
            if (id(dim_state) == 2 || id(dim_state) == 3) return;
          }
          // clock screen: the first tap just brings the list back
          if (id(ui_screen) == 0 && id(clock_after).state > 0 &&
              (now - prev_touch) > (uint32_t) (id(clock_after).state * 60000.0f)) {
            id(main_display).update();
            return;
          }
          int x = touch.x, y = touch.y;
          id(last_fresh) = now;
          if (id(ui_screen) == 0 || id(ui_screen) == 2 || id(ui_screen) == 3 || id(ui_screen) == 4) {
            // main screen, train details and station messages: decided when the finger lifts, so a sideways swipe can be told from a tap
            id(tap_x0) = x; id(tap_y0) = y; id(tap_xl) = x; id(tap_yl) = y;
            id(tap_pending) = true;
            id(tap_t0) = now;
          } else {
            if (y >= 424) {
              if (x < 270) id(settings_page) = (id(settings_page) + 7 - 1) % 7;   // BACK
              else if (x < 530) id(settings_page) = (id(settings_page) + 1) % 7;    // NEXT
              else id(ui_screen) = 0;                                                  // CLOSE
            } else if (y >= 50 && y < 418) {
              int row = (y - 50) / 46;
              bool plus = x > 640;
              bool minus = !plus && x >= 500;
              int si = id(station_select).active_index().value_or(0);
              switch (id(settings_page)) {
                case 0:
                  switch (row) {
                    case 0: id(theme_select).make_call().select_next(true).perform(); break;
                    case 1: id(layout_select).make_call().select_next(true).perform(); break;
                    case 2: id(text_large).toggle(); break;
                    case 3: id(scroll_speed).make_call().select_next(true).perform(); break;
                    case 4: id(scroll_enabled).toggle(); break;
                    case 5: id(show_seconds).toggle(); break;
                    case 6: id(clock_12h).toggle(); break;
                  }
                  break;
                case 1:
                  switch (row) {
                    case 0: id(countdown_mode).toggle(); break;
                    case 1: {
                    std::vector<std::string> opts;
                    opts.push_back("");
                    auto add = [&](const std::string &d) {
                      if (d.empty()) return;
                      for (auto &o : opts) if (o == d) return;
                      opts.push_back(d);
                    };
                    switch (si) {
                      case 0: add(departure::destination(id(stn_t1_calling_points).state, 40)); add(departure::destination(id(stn_t2_calling_points).state, 40)); add(departure::destination(id(stn_t3_calling_points).state, 40)); add(departure::destination(id(stn_t4_calling_points).state, 40)); add(departure::destination(id(stn_t5_calling_points).state, 40)); add(departure::destination(id(stn_t6_calling_points).state, 40)); add(departure::destination(id(stn_t7_calling_points).state, 40)); add(departure::destination(id(stn_t8_calling_points).state, 40)); add(departure::destination(id(stn_t9_calling_points).state, 40)); add(departure::destination(id(stn_t10_calling_points).state, 40)); break;
                    }
                    std::string cur = id(dest_filter).state;
                    size_t idx = 0;
                    for (size_t i = 0; i < opts.size(); i++) if (opts[i] == cur) idx = i;
                    idx = (idx + 1) % opts.size();
                    auto c = id(dest_filter).make_call();
                    c.set_value(opts[idx]);
                    c.perform();
                  } break;
                    case 2: id(hide_cancelled).toggle(); break;
                    case 3: id(show_platform).toggle(); break;
                    case 4: id(paging_on).toggle(); break;
                    case 5: id(pin_next).toggle(); break;
                    case 6: if (plus || minus) { float v = id(departed_grace).state + (plus ? 1 : -1); if (v < 1) v = 1; if (v > 5) v = 5; auto c = id(departed_grace).make_call(); c.set_value(v); c.perform(); } break;
                    case 7: if (plus || minus) { float v = id(walk_minutes).state + (plus ? 1 : -1); if (v < 0) v = 0; if (v > 30) v = 30; auto c = id(walk_minutes).make_call(); c.set_value(v); c.perform(); } break;
                  }
                  break;
                case 2:
                  switch (row) {
                    case 0: {
                    std::vector<std::string> opts;
                    opts.push_back("");
                    auto add = [&](const std::string &d) {
                      if (d.empty()) return;
                      for (auto &o : opts) if (o == d) return;
                      opts.push_back(d);
                    };
                    switch (si) {
                      case 0: for (auto &p : departure::points(id(stn_t1_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t2_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t3_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t4_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t5_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t6_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t7_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t8_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t9_calling_points).state)) add(p); for (auto &p : departure::points(id(stn_t10_calling_points).state)) add(p); break;
                    }
                    std::string cur = id(fav_stop).state;
                    size_t idx = 0;
                    for (size_t i = 0; i < opts.size(); i++) if (opts[i] == cur) idx = i;
                    idx = (idx + 1) % opts.size();
                    auto c = id(fav_stop).make_call();
                    c.set_value(opts[idx]);
                    c.perform();
                  } break;
                    case 1: id(disruption_banner).toggle(); break;
                    case 2: id(show_logo).toggle(); break;
                    case 3: id(focus_mode).toggle(); break;
                    case 4: if (plus || minus) { float v = id(clock_after).state + (plus ? 5 : -5); if (v < 0) v = 0; if (v > 60) v = 60; auto c = id(clock_after).make_call(); c.set_value(v); c.perform(); } break;
                    case 5: id(footer_colour).make_call().select_next(true).perform(); break;
                  }
                  break;
                case 3:
                  switch (row) {
                    case 0: if (plus || minus) { float b = id(backlight).current_values.get_brightness() + (plus ? 0.1f : -0.1f); if (b < 0.1f) b = 0.1f; if (b > 1.0f) b = 1.0f; auto c = id(backlight).turn_on(); c.set_brightness(b); c.set_transition_length(0); c.perform(); } break;
                    case 1: if (!id(night_dimming).state) { id(night_sun).turn_off(); id(night_dimming).turn_on(); }   // Off -> Set times -> Sunset -> Off
                            else if (!id(night_sun).state) id(night_sun).turn_on();
                            else { id(night_sun).turn_off(); id(night_dimming).turn_off(); } break;
                    case 2: if (plus || minus) { float v = id(night_level).state + (plus ? 5 : -5); if (v < 1) v = 1; if (v > 100) v = 100; auto c = id(night_level).make_call(); c.set_value(v); c.perform(); } break;
                    case 3: if (id(night_dimming).state && id(night_sun).state) break; if (plus || minus) { int h = (id(night_start).hour + (plus ? 1 : 23)) % 24; auto c = id(night_start).make_call(); c.set_time(h, id(night_start).minute, 0); c.perform(); } break;
                    case 4: if (id(night_dimming).state && id(night_sun).state) break; if (plus || minus) { int h = (id(night_end).hour + (plus ? 1 : 23)) % 24; auto c = id(night_end).make_call(); c.set_time(h, id(night_end).minute, 0); c.perform(); } break;
                    case 5: id(night_screen_off).toggle(); break;
                    case 6: if (plus || minus) { float v = id(idle_minutes).state + (plus ? 5 : -5); if (v < 0) v = 0; if (v > 60) v = 60; auto c = id(idle_minutes).make_call(); c.set_value(v); c.perform(); } break;
                    case 7: if (plus || minus) { float v = id(idle_level).state + (plus ? 5 : -5); if (v < 5) v = 5; if (v > 100) v = 100; auto c = id(idle_level).make_call(); c.set_value(v); c.perform(); } break;
                  }
                  break;
                case 4:
                  switch (row) {
                    case 0: id(fade_cancelled).toggle(); break;
                    case 1: id(col_headings).toggle(); break;
                    case 2: id(page_anim).toggle(); break;
                    case 3: id(tfl_colours).toggle(); break;
                  }
                  break;
                case 5:
                  break;
                case 6:
                  break;
              }
            }
          }
          id(main_display).update();
    on_update:
      - lambda: |-
          if (id(tap_pending) && !touches.empty()) { id(tap_xl) = touches[0].x; id(tap_yl) = touches[0].y; }
          if (id(tap_pending) && id(ui_screen) == 0 && millis() - id(tap_t0) >= 700 &&
              std::abs(id(tap_xl) - id(tap_x0)) < 30 && std::abs(id(tap_yl) - id(tap_y0)) < 30 && id(tap_y0) < 406) {
            id(tap_pending) = false;
            id(fav_hold).execute(id(tap_y0));
          }
    on_release:
      - lambda: |-
          id(touch_down) = false;
          if (!id(tap_pending)) return;
          id(tap_pending) = false;
          const int x = id(tap_x0), y = id(tap_y0);
          const int dx = id(tap_xl) - x, dy = id(tap_yl) - y;
          const bool swipe = std::abs(dx) > 100 && std::abs(dy) < 80;
          id(last_fresh) = millis();
          // step to the next (+1) or previous (-1) train on the details page
          auto step_train = [](int d) {
            int n = id(elig_count), cur = -1;
            for (int i = 0; i < n && i < 10; i++) if (id(elig_list)[i] == id(detail_train)) cur = i;
            if (cur >= 0 && cur + d >= 0 && cur + d < n) id(detail_train) = id(elig_list)[cur + d];
          };
          if (id(ui_screen) == 4) {
            // update screen: "Install now" (left button) or close
            if (!id(upd_installing) && y >= 420 && x >= 120 && x < 380 && id(fw_update).state == update::UPDATE_STATE_AVAILABLE) {
              id(upd_installing) = true;
              id(fw_install).execute();
            } else if (!id(upd_installing)) id(ui_screen) = 0;
            id(main_display).update();
            return;
          }
          if (id(ui_screen) == 3) {
            // station messages: swipe or tap the sides for the previous / next one, the middle closes
            auto step_msg = [](int d) { int k = id(msg_idx) + d; if (k >= 0 && k < id(msg_n)) id(msg_idx) = k; };
            if (swipe) step_msg(dx < 0 ? 1 : -1);
            else if (x < 267) step_msg(-1);
            else if (x > 533) step_msg(1);
            else id(ui_screen) = 0;
            id(main_display).update();
            return;
          }
          if (id(ui_screen) == 2) {
            if (swipe) step_train(dx < 0 ? 1 : -1);
            else if (x < 267) step_train(-1);
            else if (x > 533) step_train(1);
            else id(ui_screen) = 0;
            id(main_display).update();
            return;
          }
          if (swipe) {
            // swipe left = next station or route, right = previous
            if (id(stn_count) > 1) {
              int nx = (int) id(stn_num).state + (dx < 0 ? 1 : -1);
              if (nx > id(stn_count)) nx = 1;
              if (nx < 1) nx = id(stn_count);
              auto c = id(stn_num).make_call();
              c.set_value(nx);
              c.perform();
            }
            return;
          }
            if (millis() - id(tap_t0) >= 700 && std::abs(dx) < 30 && std::abs(dy) < 30 && y < 406) {
              id(fav_hold).execute(y);
              return;
            }
            // departures screen: tap the clock (bottom right) for settings, anywhere else = next station
            if (y >= 410 && id(upd_icon_x) >= 0 && x >= id(upd_icon_x) && x < id(upd_icon_x) + 54) { id(ui_screen) = 4; }
            else if (y >= 410 && id(msg_icon_x) >= 0 && x >= id(msg_icon_x) && x < id(msg_icon_x) + 64) { id(ui_screen) = 3; id(msg_idx) = 0; }
            else if (y >= 410 && x >= 540) { id(ui_screen) = 1; id(settings_page) = id(help_seen) ? 0 : 6; id(help_seen) = true; }
            else if (y < 406) {
              // tap a train for its details
              int sl = -1;
              if (id(focus_mode).state) sl = 0;
              else for (int i = 0; i < 10; i++) { if (id(slot_train)[i] == 0) break; if (y < id(slot_ybot)[i]) { sl = i; break; } }
              int tn = sl >= 0 ? id(slot_train)[sl] : 0;
              if (tn > 0) {
                if (id(focus_mode).state) { id(detail_train) = tn; id(ui_screen) = 2; }
                else { id(flash_slot) = sl; id(flash_until) = millis() + 250; id(pending_detail) = tn; id(main_display).update(); }
              }
            }
            else if (id(stn_count) > 1) {   // tap the footer = next station
              int nx = (int) id(stn_num).state + 1;
              if (nx > id(stn_count)) nx = 1;
              auto c = id(stn_num).make_call();
              c.set_value(nx);
              c.perform();
            }
          id(main_display).update();

output:
  - platform: ledc
