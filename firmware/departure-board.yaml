display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    dimensions:
      width: 800
      height: 480
    invert_colors: true      # both this and pclk_inverted are required
    color_order: RGB
    auto_clear_enabled: false
    update_interval: 250ms
    de_pin: GPIO41
    hsync_pin: GPIO39
    vsync_pin: GPIO40
    pclk_pin: GPIO0
    pclk_frequency: 14MHz    # a little slower than 15: more headroom for the picture feed while sound plays
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red: [GPIO14, GPIO21, GPIO47, GPIO48, GPIO45]
      green: [GPIO9, GPIO46, GPIO3, GPIO8, GPIO16, GPIO1]
      blue: [GPIO15, GPIO7, GPIO6, GPIO5, GPIO4]
    lambda: |-
      [&]() {
      if (id(shot_req)) {
        // a screenshot: the buffer still holds the last finished frame, so copy it before drawing the next
        struct ShotSrc : public mipi_rgb::MipiRgb {
          static uint16_t *get(mipi_rgb::MipiRgb *d) { return d->*(&ShotSrc::buffer_); }
        };
        uint16_t *src = ShotSrc::get(id(main_display));
        const size_t n = (size_t) it.get_width() * it.get_height();
        if (id(shot_buf) == nullptr) id(shot_buf) = (uint16_t *) heap_caps_malloc(n * 2, MALLOC_CAP_SPIRAM);
        if (src != nullptr && id(shot_buf) != nullptr) { memcpy(id(shot_buf), src, n * 2); id(shot_ready) = true; }
        id(shot_req) = false;
      }
      it.fill(bg_col);
      // ---- fast background: write the row bands and the LED grid straight into the display's frame copy ----
      // (ESPHome otherwise draws them one pixel at a time, about half a second per frame); falls back if unavailable
      struct FastBuf : public mipi_rgb::MipiRgb {
        static uint16_t *get(mipi_rgb::MipiRgb *d) { return d->*(&FastBuf::buffer_); }
      };
      uint16_t *fbuf = (it.get_rotation() == display::DISPLAY_ROTATION_0_DEGREES) ? FastBuf::get(id(main_display)) : nullptr;
      const int FBW = it.get_width(), FBH = it.get_height();
      uint16_t v_band = 0, v_bg = 0;
      if (fbuf != nullptr) {
        // learn how the display stores each colour by drawing one corner pixel and reading it back
        it.draw_pixel_at(0, 0, band_col); v_band = fbuf[0];
        it.draw_pixel_at(0, 0, bg_col); v_bg = fbuf[0];
      }
      auto frect = [&](int x, int y, int w, int h) {            // one band, in the band colour
        if (fbuf == nullptr) { it.filled_rectangle(x, y, w, h, band_col); return; }
        const int x0 = std::max(0, x), x1 = std::min(FBW, x + w), y0 = std::max(0, y), y1 = std::min(FBH, y + h);
        for (int yy = y0; yy < y1; yy++) if (x1 > x0) std::fill_n(fbuf + yy * FBW + x0, x1 - x0, v_band);
      };
      auto fgrid = [&]() {                                       // the dark gaps between LEDs
        if (fbuf == nullptr) {
          for (int x = 12; x < 790; x += 4) it.vertical_line(x, 0, 476, bg_col);
          for (int y = 1; y < 476; y += 4) it.horizontal_line(10, y, 780, bg_col);
          return;
        }
        for (int yy = 0; yy < 476 && yy < FBH; yy++) {
          uint16_t *row = fbuf + yy * FBW;
          if (yy % 4 == 1) std::fill_n(row + 10, 780, v_bg);
          else for (int xx = 12; xx < 790; xx += 4) row[xx] = v_bg;
        }
      };
      // a band that follows the Background setting: nothing on Plain, a band on Rows, a band with LED gaps on Dot matrix
      const int bgs0 = id(bg_style).active_index().value_or(1);
      auto lband = [&](int x, int y, int w, int h) {
        if (bgs0 == 0) return;
        frect(x, y, w, h);
        if (bgs0 != 2) return;
        const int x0 = std::max(10, x), x1 = std::min(790, x + w), y0 = std::max(0, y), y1 = std::min(476, y + h);
        if (fbuf == nullptr) {
          for (int xx = 12; xx < x1; xx += 4) if (xx >= x0) it.vertical_line(xx, y0, y1 - y0, bg_col);
          for (int yy = y0; yy < y1; yy++) if (yy % 4 == 1) it.horizontal_line(x0, yy, x1 - x0, bg_col);
          return;
        }
        for (int yy = y0; yy < y1 && yy < FBH; yy++) {
          uint16_t *row = fbuf + yy * FBW;
          if (yy % 4 == 1) { if (x1 > x0) std::fill_n(row + x0, x1 - x0, v_bg); }
          else for (int xx = 12 + ((std::max(x0, 12) - 12 + 3) / 4) * 4; xx < x1; xx += 4) row[xx] = v_bg;
        }
      };

      // panel warmth for colours that are not from the theme (Tube line colours)
      const int pw = id(pc_warm).has_state() ? (int) id(pc_warm).state : 0;
      auto warm_rgb = [&](int &r, int &g, int &b) {
        if (pw <= 0) return;
        const float gg = 1.0f + 0.1f * pw;
        auto f = [&](int c) { c = std::max(0, std::min(255, c)); return (int) lroundf(255.0f * powf(c / 255.0f, gg)); };
        r = f(r); g = f(g); b = f(b);
      };
      // weather from Home Assistant: shown when it's switched on and has arrived in the last 3 hours
      auto wx_ok = [&]() { return id(show_weather).state && !id(wx_temp).empty() && id(wx_ms) != 0 && millis() - id(wx_ms) < 10800000UL; };
      // a weather icon about s pixels tall, centred on cx, cy, in colour col
      auto draw_wx = [&](int cx, int cy, int s, const std::string &c, Color col) {
        auto cloud = [&](int ox, int oy, int k, Color cc) {          // k = width of the cloud
          it.filled_circle(ox - k * 25 / 100, oy + k * 5 / 100, k * 22 / 100, cc);
          it.filled_circle(ox + k * 2 / 100, oy - k * 8 / 100, k * 28 / 100, cc);
          it.filled_circle(ox + k * 28 / 100, oy + k * 7 / 100, k * 19 / 100, cc);
          it.filled_rectangle(ox - k * 25 / 100, oy + k * 5 / 100, k * 53 / 100, k * 21 / 100, cc);
        };
        auto sun = [&](int ox, int oy, int r) {
          it.filled_circle(ox, oy, r, col);
          static const int DX[8] = {100, 71, 0, -71, -100, -71, 0, 71}, DY[8] = {0, 71, 100, 71, 0, -71, -100, -71};
          for (int k = 0; k < 8; k++) {
            const int x1 = ox + DX[k] * (r + 3) / 100, y1 = oy + DY[k] * (r + 3) / 100;
            const int x2 = ox + DX[k] * (r + 3 + r * 7 / 10) / 100, y2 = oy + DY[k] * (r + 3 + r * 7 / 10) / 100;
            it.line(x1, y1, x2, y2, col); it.line(x1 + 1, y1, x2 + 1, y2, col);
          }
        };
        const bool rain = c == "rainy" || c == "pouring" || c == "lightning-rainy" || c == "snowy-rainy";
        const bool snow = c == "snowy" || c == "snowy-rainy" || c == "hail";
        const bool storm = c == "lightning" || c == "lightning-rainy";
        if (c == "sunny") { sun(cx, cy, s * 22 / 100); return; }
        if (c == "clear-night") {
          const int r = s * 38 / 100;
          it.filled_circle(cx, cy, r, col);
          it.filled_circle(cx + r * 55 / 100, cy - r * 30 / 100, r * 85 / 100, bg_col);
          return;
        }
        if (c == "fog") {
          for (int k = 0; k < 3; k++) it.filled_rectangle(cx - s * 45 / 100 + (k % 2) * s / 10, cy - s / 4 + k * s / 4, s * 80 / 100, 3, col);
          return;
        }
        if (c == "windy" || c == "windy-variant") {
          for (int k = 0; k < 3; k++) it.filled_rectangle(cx - s * 45 / 100, cy - s / 4 + k * s / 4, s * (90 - k * 25) / 100, 3, col);
          return;
        }
        if (c == "partlycloudy") {
          sun(cx - s * 20 / 100, cy - s * 15 / 100, s * 16 / 100);
          const int ox = cx + s * 12 / 100, oy = cy + s * 12 / 100, k = s * 85 / 100;
          // a ring in the background colour keeps the cloud apart from the sun
          it.filled_circle(ox - k * 25 / 100, oy + k * 5 / 100, k * 22 / 100 + 3, bg_col);
          it.filled_circle(ox + k * 2 / 100, oy - k * 8 / 100, k * 28 / 100 + 3, bg_col);
          it.filled_circle(ox + k * 28 / 100, oy + k * 7 / 100, k * 19 / 100 + 3, bg_col);
          cloud(ox, oy, k, col);
          return;
        }
        if (!(rain || snow || storm)) { cloud(cx, cy + s * 5 / 100, s, col); return; }   // cloudy and anything else
        cloud(cx, cy - s * 18 / 100, s * 90 / 100, col);
        const int y0 = cy + s * 18 / 100;
        for (int k = 0; k < 3; k++) {
          const int x = cx - s * 25 / 100 + k * s * 25 / 100;
          if (storm && (k == 1 || !rain)) continue;
          if (snow && !(rain && k == 0)) it.filled_circle(x, y0 + s / 8, 2 + s / 20, col);
          else { it.line(x + 3, y0, x - 2, y0 + s * 28 / 100, col); it.line(x + 4, y0, x - 1, y0 + s * 28 / 100, col); }
        }
        if (storm) {
          it.filled_triangle(cx + 2, y0 - 2, cx - 6, y0 + s * 18 / 100, cx + 1, y0 + s * 18 / 100, col);
          it.filled_triangle(cx - 1, y0 + s * 14 / 100, cx + 6, y0 + s * 14 / 100, cx - 4, y0 + s * 38 / 100, col);
        }
      };
      // the project logo, a dot-matrix train. sh > 0 slides it in from the left, a column at a time
      auto draw_logo = [&](int cx, int top, int pitch, int rl, int ru, Color on, Color off, int sh) {
        static const char *const LOGO[11] = {"...........", "...........", "#######....", "#.#.#.##...", "#.#.#.###..",
                                             "##########.", "###########", "...........", ".#..#..#..#", "###########", "..........."};
        const int x0 = cx - 5 * pitch;
        for (int j = 0; j < 11; j++)
          for (int i = 0; i < 11; i++) {
            const int si = i + sh;
            const bool lit = si >= 0 && si < 11 && LOGO[j][si] == '#';
            if (lit) it.filled_circle(x0 + i * pitch, top + j * pitch, rl, on);
            else if (ru > 0) it.filled_circle(x0 + i * pitch, top + j * pitch, ru, off);
          }
      };
      // start-up: the logo drives in and the title wipes in like an LED board, then the details appear
      static uint32_t boot_t0 = 0;
      if (boot_t0 == 0) boot_t0 = millis();
      const uint32_t bt = millis() - boot_t0;
      if (bt < 5000) {
        draw_logo(400, 28, 10, 4, 3, amber, band_col, std::max<int>(0, 11 - (int) (bt * 11 / 1300)));
        it.filled_rectangle(60, 164, 680, 64, band_col);
        const int wipe = std::min<int>(800, (int) (bt * 800 / 1600));
        it.start_clipping(0, 0, wipe, 480);
        it.printf(400, 196, id(f_row_0), amber, TextAlign::CENTER, "UK Departure Board");
        it.end_clipping();
        if (wipe > 60 && wipe < 740) it.filled_rectangle(wipe, 164, 4, 64, hilite);   // the bright "cursor"
        if (bt > 1800) it.printf(400, 258, id(f_sub_0), amber, TextAlign::CENTER, "Version %s", ESPHOME_PROJECT_VERSION);
        if (bt > 2200) it.printf(400, 294, id(f_sub_0), amber, TextAlign::CENTER, "ESPHome %s", id(esphome_ver_ts).state.c_str());
        if (bt > 2600) {
          if (wifi::global_wifi_component->is_connected())
            it.printf(400, 330, id(f_sub_0), green, TextAlign::CENTER, "Wi-Fi connected");
          else
            it.printf(400, 330, id(f_sub_0), orange, TextAlign::CENTER, "Connecting to Wi-Fi...");
        }
        for (int d = 0; d < 24; d++)                     // a row of dots fills up while it starts
          it.filled_circle(400 - 230 + d * 20, 410, 4, bt > (uint32_t) d * 200 ? amber : band_col);
        return;
      }

      auto now = id(ha_time).now();
      bool tv = now.is_valid();
      int nowmin = tv ? now.hour * 60 + now.minute : -1;
      const char *THEME_NAMES[] = {"Classic", "White LED", "Modern LCD", "Retro green", "High contrast", "Split-flap", "Airport", "Night red"};
      const char *FONT_NAMES[] = {"DotGothic"};
      std::string stn_name = id(station_ts).state.empty() ? std::string("Departures") : id(station_ts).state;
      const char *STATION_NAMES[] = {stn_name.c_str()};
      int si = id(station_select).active_index().value_or(0);
      uint32_t dms = 0;
      std::string disr;
      switch (si) {
        case 0: dms = id(data_ms_stn); disr = id(stn_status).state; break;
      }

      // ---------------- station picker (Calling at / Highlight stop) ----------------
      if (id(ui_screen) == 5 && (millis() - id(last_fresh) > 30000 || millis() - id(last_touch_any) > 60000)) id(ui_screen) = 0;
      if (id(ui_screen) == 5) {
        const auto &o = id(pick_opts);
        const int n = o.size(), pages = std::max(1, (n + 15) / 16);
        if (id(pick_page) >= pages) id(pick_page) = 0;
        const int page = id(pick_page);
        const bool dest = id(pick_kind) == 0, platk = id(pick_kind) == 2;
        const std::string cur = dest ? id(dest_filter).state : (platk ? id(plat_filter).state : id(fav_stop).state);
        const Color hc = bg_col.r > 200 ? Color(26, 26, 26) : Color(255, 255, 255);
        it.printf(20, 6, id(f_hdr_0), hc, "%s", dest ? "Settings: Trains > Calling at" : (platk ? "Settings: Extras > Platform" : "Settings: Extras > Highlight stop"));
        if (pages > 1) it.printf(780, 6, id(f_hdr_0), hc, TextAlign::TOP_RIGHT, "%d/%d", page + 1, pages);
        for (int i = 0; i < 16; i++) {
          const int k = page * 16 + i;
          if (k >= n) break;
          const int x0 = 10 + (i / 8) * 395, y0 = 32 + (i % 8) * 44;
          lband(x0, y0, 385, 42);
          const bool sel = o[k] == cur;
          std::string s = o[k].empty() ? std::string(platk ? "All platforms" : "Off") : (platk ? "Platform " + o[k] : o[k]);
          int bx, by, bw, bh;
          it.get_text_bounds(0, 0, s.c_str(), id(f_row_0), TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
          if (bw > 330) {                              // too long: shorten with ".."
            std::string t = s;
            while (t.size() > 2) {
              t.pop_back();
              std::string u = t + "..";
              it.get_text_bounds(0, 0, u.c_str(), id(f_row_0), TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
              if (bw <= 330) { s = u; break; }
            }
          }
          if (sel) it.filled_circle(x0 + 365, y0 + 21, 7, green);
          it.print(x0 + 10, y0 + 21, id(f_row_0), sel ? green : amber, TextAlign::CENTER_LEFT, s.c_str());
        }
        const char *h = n <= 1 ? (platk ? "No platforms yet: try again when trains are showing" : "No stops yet: try again when trains are showing")
                               : (dest ? "Only show trains that call at the stop you tap"
                                       : (platk ? "Show only trains from the platform you tap" : "The stop you tap is shown in white in the calling points"));
        it.printf(400, 404, id(f_hdr_0), amber, TextAlign::CENTER, "%s", h);
        const char *PB[3] = {"< Settings", "More >", "Close"};
        for (int b = 0; b < 3; b++) {
          const int bx = 20 + b * 260;
          const bool live = b != 1 || pages > 1;
          if (live) lband(bx, 426, 240, 46);
          it.rectangle(bx, 426, 240, 46, live ? amber : grey);
          if (live) it.printf(bx + 120, 449, id(f_row_0), amber, TextAlign::CENTER, "%s", PB[b]);
        }
        return;
      }

      // ---------------- settings screen (tap the clock to open) ----------------
      if (id(ui_screen) == 1 && millis() - id(last_touch_any) > 60000) id(ui_screen) = 0;   // settings close after a minute
      if (id(ui_screen) == 1) {
        if (millis() - id(last_fresh) > 30000) {
          id(ui_screen) = 0;                    // close after 30 s without a touch
        } else {
          static const char *SPEEDN[3] = {"Slow", "Medium", "Fast"};
          const int RY0 = 32, RP = 44;                    // eight rows: top and pitch
          const int pg = id(settings_page);
          const Color hc = bg_col.r > 200 ? Color(26, 26, 26) : Color(255, 255, 255);   // white (dark on a light background)
          int R = 0;
          bool dimr = false;                              // this row doesn't apply right now: drawn in grey
          auto why_off = [&](int p, int r) -> const char * {
            if (p == 1 && r == 5 && !id(paging_on).state) return "Turn on Paging to use this";
            if (p == 2 && r >= 3 && r <= 5 && !id(night_dimming).state) return "Turn on Night dimming to use this";
            if (p == 2 && (r == 4 || r == 5) && id(night_sun).state) return "Follows sunset and sunrise";
            if (p == 2 && r == 7 && id(idle_minutes).state <= 0) return "Set Idle dim after to use this";
            if (p == 4 && r >= 1 && !id(sounds_sw).state) return "Turn on Sounds to use this (needs a speaker)";
            if (p == 4 && r >= 4 && r <= 6 && id(ann_mode).active_index().value_or(0) == 0) return "Turn on Announcements to use this";
            return nullptr;
          };
          auto ry = [&](int row) { return RY0 + row * RP; };
          auto lab = [&](int row, const char *s) {
            it.printf(20, ry(row) + 21, id(f_row_0), dimr ? grey : amber, TextAlign::CENTER_LEFT, "%s", s);
          };
          auto val = [&](int row, Color c, const char *s) {
            it.printf(776, ry(row) + 21, id(f_row_0), c, TextAlign::CENTER_RIGHT, "%s", s);
          };
          auto pm = [&](int row, const char *v) {
            int y0 = ry(row) + 1;
            const Color pc = dimr ? grey : amber;
            it.rectangle(510, y0, 80, 40, pc);
            it.printf(550, y0 + 20, id(f_row_0), pc, TextAlign::CENTER, "-");
            it.rectangle(700, y0, 80, 40, pc);
            it.printf(740, y0 + 20, id(f_row_0), pc, TextAlign::CENTER, "+");
            it.printf(645, y0 + 20, id(f_row_0), pc, TextAlign::CENTER, "%s", v);
          };
          auto onoff = [&](int row, bool on) {            // an LED beside the word: lit green when on, hollow when off
            int cy = ry(row) + 21;
            const Color oc = dimr ? grey : green;
            if (on) it.filled_circle(712, cy, 7, oc); else { it.circle(712, cy, 7, grey); it.circle(712, cy, 6, grey); }
            val(row, on ? oc : grey, on ? "On" : "Off");
          };
          auto cyc = [&](int row, const char *s) {        // a value you tap to change: text plus a small arrow
            int cy = ry(row) + 21;
            it.printf(752, cy, id(f_row_0), dimr ? grey : amber, TextAlign::CENTER_RIGHT, "%s", s);
            it.filled_triangle(764, cy - 7, 764, cy + 7, 774, cy, grey);
          };
          auto band = [&](int row) {                      // follows the Background setting; flashes when tapped
            dimr = why_off(pg, row) != nullptr;
            lband(10, ry(row), 780, 42);
            if (row == id(set_row) && millis() - id(set_tap_t) < 300) {
              it.rectangle(10, ry(row), 780, 42, hilite); it.rectangle(11, ry(row) + 1, 778, 40, hilite);
            }
          };
          char buf[40];
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          const bool api_ok = api::global_api_server->is_connected();

          // heading: small and white, like the board's column headings
          static const char *PAGE_NAMES[6] = {"Display", "Trains", "Screen", "Extras", "Sound (experimental)", "About"};
          it.printf(20, 6, id(f_hdr_0), hc, "Settings: %s", PAGE_NAMES[pg]);
          for (int d = 0; d < 6; d++) {                         // page dots
            int dx = 776 - (6 - 1 - d) * 18;
            if (d == pg) it.filled_circle(dx, 14, 5, hc); else it.circle(dx, 14, 4, grey);
          }

          static const char *HINTS[5][8] = {
            {"Colours for the whole board", "Classic, Calm, Compact, or Platform (the next train in full)",
             "Slide between pages of trains", "What sits behind the text: Dot matrix, Rows or Plain",
             "Large text shows fewer trains", "Small headings above the trains",
             "How fast the calling points scroll, or Off", "Tube boards: each line in its own colour"},
            {"Minutes to go instead of times", "Only trains that call at a stop: tap to pick one",
             "Cancelled trains: shown, faded or hidden", "The platform column",
             "Turn pages when there are more trains than fit", "Keep the next train on the top row while pages turn",
             "How long a departed train stays on the board", "The footer shows when to leave, with a walking figure"},
            {"Daytime brightness", "Turn up if the amber looks yellow (screen only, not screenshots)",
             "Dim at set times, or from sunset to sunrise", "Go below the lowest step to turn the screen off",
             "When night dimming starts", "When night dimming ends",
             "Dim when nobody has touched the board", "Brightness while idle"},
            {"A stop shown in white in the calling points: tap to pick one", "Minor or Major Delays in the footer, only when disrupted",
             "The logo in the footer", "Hidden, Icon only, or scroll along the footer every 2, 5 or 10 min",
             "Switch to the big clock after this long", "12 or 24 hour, with or without seconds",
             "Footer text in the theme colour or white", "Temperature in the footer (pick a weather entity in the blueprint)"},
            {"Turn on with a speaker on the board, or one in Home Assistant", "Silence announcements for now; a grey speaker shows in the footer",
             "How loud announcements and the chime are", "All trains, only delays, or only your favourite trains (hold a train)",
             "How long before each train's booked time", "A chime before each announcement",
             "Silent between Night starts and Night ends", "Play the chime on the board's own speaker"}};
          static const char *ABOUT_HINTS[8] = {"The Wi-Fi network and its signal", "The board's address on your network",
             "The link to Home Assistant", "Time since the last trains arrived",
             "Updates install themselves at about 03:00", "Time since the board last restarted",
             "The Home Assistant blueprint that sends the trains", "Memory left on the board"};

          if (pg == 0) {
            R = 0; band(R); lab(R, "Theme"); cyc(R, THEME_NAMES[id(theme_select).active_index().value_or(0)]);
            R = 1; band(R); lab(R, "Layout"); { static const char *LN[4] = {"Classic", "Calm", "Compact", "Platform"}; cyc(R, LN[id(layout_select).active_index().value_or(0)]); }
            R = 2; band(R); if (id(layout_select).active_index().value_or(0) == 3) { lab(R, "Platform"); std::string pf = id(plat_filter).state; cyc(R, pf.empty() ? "All" : pf.c_str()); }
                            else { lab(R, "Page animation"); onoff(R, id(page_anim).state); }
            R = 3; band(R); lab(R, "Background"); { static const char *BN[3] = {"Plain", "Rows", "Dot matrix"}; cyc(R, BN[id(bg_style).active_index().value_or(1)]); }
            R = 4; band(R); lab(R, "Text size"); cyc(R, id(text_large).state ? "Large" : "Normal");
            R = 5; band(R); lab(R, "Column headings"); onoff(R, id(col_headings).state);
            R = 6; band(R); lab(R, "Scrolling text"); cyc(R, id(scroll_enabled).state ? SPEEDN[id(scroll_speed).active_index().value_or(1)] : "Off");
            R = 7; band(R); if (id(src_tfl)) { lab(R, "TfL line colours"); onoff(R, id(tfl_colours).state); } else { lab(R, "Train numbers"); onoff(R, id(ord_labels).state); }
          }
          else if (pg == 1) {
            R = 0; band(R); lab(R, "Countdown"); onoff(R, id(countdown_mode).state);
            R = 1; band(R); lab(R, "Calling at"); { std::string f = id(dest_filter).state; cyc(R, f.empty() ? "Off" : f.c_str()); }
            R = 2; band(R); lab(R, "Cancelled trains"); cyc(R, id(hide_cancelled).state ? "Hidden" : (id(fade_cancelled).state ? "Faded" : "Shown"));
            R = 3; band(R); lab(R, "Show platform"); onoff(R, id(show_platform).state);
            R = 4; band(R); lab(R, "Paging"); onoff(R, id(paging_on).state);
            R = 5; band(R); lab(R, "Pin next train"); onoff(R, id(pin_next).state);
            R = 6; band(R); lab(R, "Departed grace"); snprintf(buf, sizeof(buf), "%d min", (int) id(departed_grace).state); pm(R, buf);
            R = 7; band(R); lab(R, "Walking time"); if (id(walk_minutes).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(walk_minutes).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
          }
          else if (pg == 2) {
            R = 0; band(R); lab(R, "Brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) (id(brightness_num).has_state() ? id(brightness_num).state : 100)); pm(R, buf);
            R = 1; band(R); lab(R, "Panel warmth"); snprintf(buf, sizeof(buf), "%d", id(pc_warm).has_state() ? (int) id(pc_warm).state : 0); pm(R, buf);
            R = 2; band(R); lab(R, "Night dimming"); if (!id(night_dimming).state) onoff(R, false); else cyc(R, id(night_sun).state ? "Sunset" : "Set times");
            R = 3; band(R); lab(R, "Night brightness"); if (id(night_screen_off).state) snprintf(buf, sizeof(buf), "Off"); else snprintf(buf, sizeof(buf), "%d%%", (int) id(night_level).state); pm(R, buf);
            R = 4; band(R); lab(R, "Night starts"); if (id(night_dimming).state && id(night_sun).state) val(R, grey, "Sunset"); else { snprintf(buf, sizeof(buf), "%02d:%02d", id(night_start).hour, id(night_start).minute); pm(R, buf); }
            R = 5; band(R); lab(R, "Night ends"); if (id(night_dimming).state && id(night_sun).state) val(R, grey, "Sunrise"); else { snprintf(buf, sizeof(buf), "%02d:%02d", id(night_end).hour, id(night_end).minute); pm(R, buf); }
            R = 6; band(R); lab(R, "Idle dim after"); if (id(idle_minutes).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(idle_minutes).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
            R = 7; band(R); lab(R, "Idle brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) id(idle_level).state); pm(R, buf);
          }
          else if (pg == 3) {
            R = 0; band(R); lab(R, "Highlight stop"); { std::string f = id(fav_stop).state; cyc(R, f.empty() ? "Off" : f.c_str()); }
            R = 1; band(R); lab(R, "Disruption alert"); onoff(R, id(disruption_banner).state);
            R = 2; band(R); lab(R, "Show logo"); onoff(R, id(show_logo).state);
            R = 3; band(R); lab(R, "Station messages"); { static const char *MN[5] = {"Hidden", "Icon only", "Every 2 min", "Every 5 min", "Every 10 min"}; cyc(R, MN[std::min(4, (int) id(msg_scroll).active_index().value_or(3))]); }
            R = 4; band(R); lab(R, "Clock screen after"); if (id(clock_after).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(clock_after).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
            R = 5; band(R); lab(R, "Clock"); { static const char *CN[4] = {"24 hour", "24h + secs", "12 hour", "12h + secs"}; cyc(R, CN[(id(clock_12h).state ? 2 : 0) + (id(show_seconds).state ? 1 : 0)]); }
            R = 6; band(R); lab(R, "Footer colour"); cyc(R, id(footer_colour).active_index().value_or(0) == 1 ? "White" : "Theme");
            R = 7; band(R); lab(R, "Weather"); if (id(wx_temp).empty() && id(show_weather).state) val(R, grey, "Not set up"); else onoff(R, id(show_weather).state);
          }
          else if (pg == 4) {
            R = 0; band(R); lab(R, "Sounds"); onoff(R, id(sounds_sw).state);
            R = 1; band(R); lab(R, "Mute"); onoff(R, id(board_media).is_muted());
            R = 2; band(R); lab(R, "Volume"); snprintf(buf, sizeof(buf), "%d%%", (int) (id(board_media).volume * 100.0f + 0.5f)); pm(R, buf);
            R = 3; band(R); lab(R, "Announcements"); { static const char *AN[4] = {"Off", "All trains", "Delays only", "Favourites only"}; cyc(R, AN[std::min(3, (int) id(ann_mode).active_index().value_or(0))]); }
            R = 4; band(R); lab(R, "Announce before"); snprintf(buf, sizeof(buf), "%d min", (int) id(ann_before).state); pm(R, buf);
            R = 5; band(R); lab(R, "Chime first"); onoff(R, id(ann_chime).state);
            R = 6; band(R); lab(R, "Quiet at night"); onoff(R, id(ann_quiet).state);
            R = 7; band(R); lab(R, "Test sound"); cyc(R, "Play");
          }
          else {
            R = 0; band(R); lab(R, "Wi-Fi"); if (wifi_ok) { std::string s = id(wifi_ssid_ts).state; if (s.size() > 14) s.resize(14); snprintf(buf, sizeof(buf), "%s %ddBm", s.c_str(), (int) id(wifi_rssi_s).state); val(R, green, buf); } else val(R, red, "Offline");
            R = 1; band(R); lab(R, "IP address"); val(R, amber, id(wifi_ip_ts).state.c_str());
            R = 2; band(R); lab(R, "Home Assistant"); val(R, api_ok ? green : red, api_ok ? "Connected" : "Offline");
            R = 3; band(R); lab(R, "Data age"); if (dms == 0) val(R, amber, "No data yet"); else { unsigned am = (millis() - dms) / 60000; snprintf(buf, sizeof(buf), "%u min", am); val(R, am >= 5 ? red : green, buf); }
            R = 4; band(R); lab(R, "Firmware");
            if (id(fw_update).state == update::UPDATE_STATE_AVAILABLE) { snprintf(buf, sizeof(buf), "%s, %s ready", ESPHOME_PROJECT_VERSION, id(fw_update).update_info.latest_version.c_str()); val(R, orange, buf); }
            else { snprintf(buf, sizeof(buf), "%s %s", ESPHOME_PROJECT_VERSION, __DATE__); val(R, amber, buf); }
            R = 5; band(R); lab(R, "Uptime"); { uint32_t u = millis() / 1000; snprintf(buf, sizeof(buf), "%ud %uh %um", (unsigned) (u / 86400), (unsigned) (u % 86400 / 3600), (unsigned) (u % 3600 / 60)); val(R, amber, buf); }
            R = 6; band(R); lab(R, "Blueprint"); if (dms == 0) val(R, grey, "Not sending yet"); else if (id(bp_ver) >= 3) val(R, green, "Up to date"); else val(R, orange, "Update available");
            R = 7; band(R); lab(R, "Free memory"); if (id(heap_free).has_state()) { snprintf(buf, sizeof(buf), "%d KB", (int) (id(heap_free).state / 1024)); val(R, amber, buf); } else val(R, amber, "...");
          }

          // hint line: what the last tapped setting does; on About, rotating tips
          {
            const int hy = RY0 + 8 * RP + 20;
            const char *h = nullptr; Color c = grey;
            const int sr = id(set_row);
            const bool bp_old = dms != 0 && id(bp_ver) < 3;
            if (pg == 5 && id(grace_warn)) { h = "Tip: set Departed grace to 1 min (Trains page)"; c = orange; }
            else if (pg == 5 && bp_old && (sr < 0 || sr == 6)) { h = "In Home Assistant: Blueprints > UK Departure Board > Re-import"; c = orange; }
            else if (sr >= 0 && sr < 8 && why_off(pg, sr) != nullptr) { h = why_off(pg, sr); c = amber; }
            else if (pg == 0 && sr == 7 && !id(src_tfl)) { h = "1st, 2nd, 3rd dimmed under each time"; c = amber; }
            else if (pg == 4 && sr == 3 && id(sounds_sw).state && id(ann_mode).active_index().value_or(0) != 0) { h = "Voice: Home Assistant > Automations > UK Departure Board"; c = amber; }
            else if (pg == 2 && sr == 0 && id(dim_state) != 0) { h = "Daytime brightness (the screen is dimmed just now)"; c = amber; }
            else if (pg == 0 && sr == 1 && id(layout_select).active_index().value_or(0) == 3) { h = "Platform: choose a platform in the row below, or leave All"; c = amber; }
            else if (pg == 0 && sr == 2 && id(layout_select).active_index().value_or(0) == 3) { h = "Show only one platform's trains: tap to pick, or All"; c = amber; }
            else if (sr >= 0 && sr < 8) { h = pg < 5 ? HINTS[pg][sr] : ABOUT_HINTS[sr]; c = amber; }
            else if (pg == 5) h = nullptr;
            else h = "Tap a setting to change it";
            if (h != nullptr) it.printf(400, hy, id(f_hdr_0), c, TextAlign::CENTER, "%s", h);
          }
          const char *BTN[3] = {"< Back", "Next >", "Close"};
          for (int b = 0; b < 3; b++) {
            int bx = 20 + b * 260;
            lband(bx, 426, 240, 46);
            it.rectangle(bx, 426, 240, 46, amber);
            it.printf(bx + 120, 449, id(f_row_0), amber, TextAlign::CENTER, "%s", BTN[b]);
          }
          return;
        }
      }

      // ---------------- update screen (tap the arrow in the footer) ----------------
      if (id(ui_screen) == 4 && !id(upd_installing) &&
          (millis() - id(last_touch_any) > 60000 || id(fw_update).state != update::UPDATE_STATE_AVAILABLE)) id(ui_screen) = 0;
      if (id(ui_screen) == 4) {
        font::Font *mf = id(f_row_0);
        lband(10, 4, 780, 44);
        it.circle(34, 26, 16, orange);
        it.circle(34, 26, 15, orange);
        it.filled_triangle(34, 16, 26, 26, 42, 26, orange);
        it.filled_rectangle(31, 26, 7, 10, orange);
        it.printf(66, 26, mf, amber, TextAlign::CENTER_LEFT, "Update ready");
        const char *nv = id(fw_update).update_info.latest_version.c_str();
        if (id(upd_installing)) {
          it.printf(24, 80, mf, amber, "Installing %s...", nv);
          it.printf(24, 124, mf, amber, "The board restarts by itself when it");
          it.printf(24, 168, mf, amber, "has finished. Please don't unplug it.");
        } else {
          it.printf(24, 80, mf, amber, "Version %s is ready.", nv);
          it.printf(24, 124, mf, grey, "You have %s.", ESPHOME_PROJECT_VERSION);
          it.printf(24, 190, mf, amber, "Install it now, or from Home Assistant:");
          it.printf(24, 234, mf, amber, "Settings > Updates, or its device page.");
          const char *BTN[2] = {"Install now", "Close"};
          for (int b = 0; b < 2; b++) {
            const int bx = 120 + b * 300;
            lband(bx, 426, 260, 46);
            it.rectangle(bx, 426, 260, 46, b == 0 ? orange : amber);
            it.printf(bx + 130, 449, mf, b == 0 ? orange : amber, TextAlign::CENTER, "%s", BTN[b]);
          }
        }
        return;
      }

      // ---------------- station message screen (tap the "i" in the footer) ----------------
      if (id(ui_screen) == 3 && (id(msg_n) == 0 || millis() - id(last_touch_any) > 60000)) id(ui_screen) = 0;   // closes after a minute
      if (id(ui_screen) == 3) {
        std::vector<std::string> ml;
        {
          std::string cur;
          for (char ch : id(msg_text)) {
            if (ch == '\n') { if (cur.find_first_not_of(' ') != std::string::npos) ml.push_back(cur); cur.clear(); }
            else if (ch != '\r') cur += ch;
          }
          if (cur.find_first_not_of(' ') != std::string::npos) ml.push_back(cur);
        }
        if (!ml.empty()) {
          const int nm = (int) ml.size();
          if (id(msg_idx) < 0 || id(msg_idx) >= nm) id(msg_idx) = 0;
          const int mi = id(msg_idx);
          font::Font *mf = id(f_row_0);
          auto wid = [&](const std::string &s) { int bx, by, bw, bh; it.get_text_bounds(0, 0, s.c_str(), mf, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh); return bw; };
          // heading: the icon, "Station message" and which one this is
          lband(10, 4, 780, 44);
          it.circle(34, 26, 16, orange);
          it.circle(34, 26, 15, orange);
          it.printf(34, 26, mf, orange, TextAlign::CENTER, "i");
          char hb[40];
          const char *mt = id(src_tfl) ? "Line status" : "Station message";
          if (nm > 1) snprintf(hb, sizeof(hb), "%s  %d of %d", mt, mi + 1, nm);
          else snprintf(hb, sizeof(hb), "%s", mt);
          it.printf(66, 26, mf, amber, TextAlign::CENTER_LEFT, "%s", hb);
          // the message, wrapped to the width of the screen
          std::vector<std::string> lines;
          std::string cur, word;
          auto add_word = [&]() {
            if (word.empty()) return;
            std::string t = cur.empty() ? word : cur + " " + word;
            if (!cur.empty() && wid(t) > 752) { lines.push_back(cur); cur = word; } else cur = t;
            word.clear();
          };
          for (char ch : ml[mi]) { if (ch == ' ') add_word(); else word += ch; }
          add_word();
          if (!cur.empty()) lines.push_back(cur);
          if (lines.size() > 8) {
            lines.resize(8);
            std::string &l = lines.back();
            while (!l.empty() && wid(l + "...") > 752) l.pop_back();
            l += "...";
          }
          for (size_t i = 0; i < lines.size(); i++) it.print(24, 62 + (int) i * 44, mf, amber, lines[i].c_str());
          // buttons, like the settings screen
          const char *BTN[3] = {"< Prev", "Close", "Next >"};
          for (int b = 0; b < 3; b++) {
            const bool on = (b == 1) || (b == 0 && mi > 0) || (b == 2 && mi < nm - 1);
            int bx = 20 + b * 260;
            lband(bx, 426, 240, 46);
            it.rectangle(bx, 426, 240, 46, on ? amber : grey);
            it.printf(bx + 120, 449, mf, on ? amber : grey, TextAlign::CENTER, "%s", BTN[b]);
          }
          return;
        }
        id(ui_screen) = 0;
      }

      // ---------------- departures screen ----------------
      const bool L = id(text_large).state;
      int count = 5;                            // 5 trains a page
      if (count < 3) count = 3;
      if (count > 5) count = 5;
      if (L && count > 4) count = 4;            // large text only has room for 4 trains
      const int HDR = id(col_headings).state ? 32 : 0;   // room for column headings
      const int H = (406 - HDR) / count;                // pixel height of one train (two lines)
      const int fi = 0;   // one font
      static std::map<std::string, uint32_t> pchg_seen;   // when each platform change was first shown
      font::Font *F_ROW[] = {id(f_row_0)};
      font::Font *F_SUB[] = {id(f_sub_0)};
      font::Font *F_CLK[] = {id(f_clk_0)};
      font::Font *F_ROWL[] = {id(f_row_l_0)};
      font::Font *F_SUBL[] = {id(f_sub_l_0)};
      font::Font *F_BIG[] = {id(f_big_0)};
      auto fr = L ? F_ROWL[fi] : F_ROW[fi];
      auto fs = L ? F_SUBL[fi] : F_SUB[fi];
      const int TX = 18;
      const int DX = L ? 175 : 130;             // destination / sub-line x
      const int PX = L ? 540 : 610;             // platform column (right edge)
      const int DMAX = L ? 12 : 21;             // destination max characters
      // real extent of the letters, measured from the glyphs: capital tops to descender bottoms,
      // relative to the top of a printed line (font metrics overstate this for some fonts)
      auto ink_of = [](font::Font *f, int &top, int &bot) {
        top = f->get_baseline() * 1 / 4; bot = f->get_baseline();
        bool got = false;
        for (char c : std::string("HXE")) {
          const font::Glyph *g = f->find_glyph((uint32_t) c);
          if (g && g->height > 0) { top = got ? std::min(top, g->offset_y) : g->offset_y; got = true; }
        }
        for (char c : std::string("gjpqy,")) {
          const font::Glyph *g = f->find_glyph((uint32_t) c);
          if (g && g->height > 0) bot = std::max(bot, g->offset_y + g->height);
        }
      };
      int rT, rB, sT, sB;
      ink_of(fr, rT, rB);
      ink_of(fs, sT, sB);
      // sub line sits just below the main line's letters: 2 px band padding each side + 3 px gap
      const int SUBOFF = rB + 7 - sT;
      const int ink_top = rT;
      const int ink_bot = SUBOFF + sB;
      const int SUBH = L ? 38 : 32;
      const int SW = 784 - DX;                  // sub-line width
      int pad = (H - (ink_bot - ink_top)) / 2 - ink_top;
      if (pad < -ink_top) pad = -ink_top;
      const int speeds[3] = {20, 30, 50};       // scroll px per second
      const int sp = speeds[id(scroll_speed).active_index().value_or(1)];
      const std::string filt = id(dest_filter).state;
      const std::string favs = id(fav_times).state;
      const std::string fstop = id(fav_stop).state;       // favourite stop to highlight
      const int walk = (int) id(walk_minutes).state;
      const int grace = (int) id(departed_grace).state;
      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      const bool api_ok = api::global_api_server->is_connected();
      int leave_mins = -1;
      int n_recent = 0;                 // trains Home Assistant sent that leave from 10 min ago onwards
      int slot = 0;
      if (id(ui_screen) == 2 && millis() - id(last_fresh) > 30000) id(ui_screen) = 0;   // detail view times out
      const bool detail = (id(ui_screen) == 2);
      // view: 0 = list, 1 = the next train in full (Platform layout), 2 = clock screen (after idle time)
      const bool clock_idle = id(clock_after).state > 0 && (millis() - id(last_touch_any)) > (uint32_t) (id(clock_after).state * 60000.0f);
      const int view = detail ? 0 : (clock_idle ? 2 : (id(layout_select).active_index().value_or(0) == 3 ? 1 : 0));   // 1 = Platform layout
      bool dfound = false;
      // just switched station: hide the old station's trains until the new ones arrive
      const bool switching = id(stn_switch_ms) != 0 && id(data_ms_stn) < id(stn_switch_ms) && millis() - id(stn_switch_ms) < 15000;
      // paging: the trains that can be shown are split into pages of `count` rows
      static int elig_prev = 0;
      int elig = 0;
      const bool pin = id(pin_next).state;
      const int per = pin ? std::max(1, count - 1) : count;
      int pages = 1;
      if (id(paging_on).state && view == 0 && !detail && elig_prev > count)
        pages = pin ? (elig_prev - 1 + per - 1) / per : (elig_prev + per - 1) / per;
      // ---- layout: 0 Classic, 1 Calm (only the first train scrolls), 2 Compact (one line per train) ----
      const int lay = id(layout_select).active_index().value_or(0);
      // softer version of the main colour for second lines (70% text, 30% band); High contrast keeps full strength
      const bool hi_con = id(theme_select).active_index().value_or(0) == 4;
      const Color cxl_col = Color((amber.r * 45 + band_col.r * 55) / 100, (amber.g * 45 + band_col.g * 55) / 100, (amber.b * 45 + band_col.b * 55) / 100);
      const Color sub_col = hi_con ? amber : Color((amber.r * 6 + band_col.r * 4) / 10, (amber.g * 6 + band_col.g * 4) / 10, (amber.b * 6 + band_col.b * 4) / 10);
      const Color sub_ora = hi_con ? orange : Color((orange.r * 6 + band_col.r * 4) / 10, (orange.g * 6 + band_col.g * 4) / 10, (orange.b * 6 + band_col.b * 4) / 10);
      const Color sub_red = hi_con ? red : Color((red.r * 6 + band_col.r * 4) / 10, (red.g * 6 + band_col.g * 4) / 10, (red.b * 6 + band_col.b * 4) / 10);
      static std::vector<uint8_t> cmp_tall(10, 0);           // last frame: train needs a reason line
      std::vector<uint8_t> cmp_tall_now(10, 0);
      int cmp_page[10], cmp_y[10], cmp_ry[10], cmp_bot[10];
      const int C_NONE = -10000;                             // "no row" (real text tops can be slightly negative)
      for (int i = 0; i < 10; i++) { cmp_page[i] = -1; cmp_y[i] = C_NONE; cmp_ry[i] = C_NONE; cmp_bot[i] = 0; }
      const int C_ROWB = (rB - rT) + 4;                      // band of a one-line row (letters + 2 px each side)
      const int C_SUBB = (sB - sT) + 4;                      // band of a reason line
      const int C_Y0 = 6 + HDR + 4 - rT;                     // first train: top of its main line
      const int C_TOP = C_Y0 + SUBOFF + sB + 2 + 8;          // first one-line row, below the first train's band
      const int C_BOT = 412;                                 // the footer band starts at 419
      if (lay == 2 && view == 0 && !detail) {
        // the next train stays at the top; the others fill pages underneath it
        int p = 0, used = 0, last = 0;
        for (int i = 1; i < 10; i++) {
          int h = C_ROWB + (cmp_tall[i] ? C_SUBB + 1 : 0);
          if (used > 0 && used + h > C_BOT - C_TOP) { p++; used = 0; }
          cmp_page[i] = p;
          used += h + 6;
          if (i < elig_prev) last = p;
        }
        pages = id(paging_on).state ? last + 1 : 1;
      }
      const uint32_t page_ms = (uint32_t) (id(page_secs).state * 1000.0f);
      const int page = pages > 1 ? (int) ((millis() / page_ms) % pages) : 0;
      const uint32_t page_t0 = pages > 1 ? (millis() / page_ms) * page_ms : 0;   // scrolling restarts each page
      if (lay == 2 && view == 0 && !detail) {
        cmp_y[0] = C_Y0;
        cmp_bot[0] = C_TOP - 4;
        int n = 0, sum = 0;
        for (int i = 1; i < 10 && i < elig_prev; i++) if (cmp_page[i] == page) { n++; sum += C_ROWB + (cmp_tall[i] ? C_SUBB + 1 : 0); }
        int gap = n > 0 ? (C_BOT - C_TOP - sum) / n : 0;   // spread the rows down the screen
        gap = std::max(6, std::min(gap, 14));
        int cy = C_TOP;
        for (int i = 1; i < 10; i++) {
          if (cmp_page[i] != page) continue;
          int h = C_ROWB + (cmp_tall[i] ? C_SUBB + 1 : 0);
          if (cy + h > C_BOT) break;                          // no room left on this page
          cmp_y[i] = cy + 2 - rT;
          cy += C_ROWB;
          if (cmp_tall[i]) { cmp_ry[i] = cy + 1 + 2 - sT; cy += 1 + C_SUBB; }
          cmp_bot[i] = cy + gap / 2;
          cy += gap;
        }
      }
      static int anim_page = -1;
      static uint32_t anim_t0 = 0;
      static bool anim_all = false;      // true: a train has left, so every row slides (the top one too)
      if (view == 0 && !detail && pages > 1 && page != anim_page) {
        if (anim_page >= 0 && id(page_anim).state) { anim_t0 = millis(); id(anim_until) = anim_t0 + 250 + 150 * 9; anim_all = false; }
        anim_page = page;
      }
      if (pages <= 1) anim_page = -1;
      const bool anim_active = view == 0 && !detail && anim_t0 != 0 && millis() - anim_t0 < 250 + 150 * 9;
      auto cmp_bands = [&]() {
        // first train: main and sub line bands, as in Classic
        int mt = C_Y0 + rT - 2, mb = C_Y0 + rB + 2, st = C_Y0 + SUBOFF + sT - 2, sb = C_Y0 + SUBOFF + sB + 2;
        if (mb > st - 3) { int mid = (mb + st) / 2; mb = mid - 1; st = mid + 2; }
        frect(10, mt, 780, mb - mt);
        frect(10, st, 780, sb - st);
        for (int i = 1; i < 10; i++) {
          if (cmp_y[i] == C_NONE || i >= elig_prev) continue;
          frect(10, cmp_y[i] + rT - 2, 780, C_ROWB);
          if (cmp_ry[i] != C_NONE) frect(10, cmp_ry[i] + sT - 2, 780, C_SUBB);
        }
      };
      auto on_page = [&](int i) {
        if (lay == 2) return i == 0 || (i < 10 && cmp_page[i] == page);
        if (pages <= 1) return true;
        if (pin && i == 0) return true;                 // the next train stays on every page
        int k = pin ? i - 1 : i;
        return k / per == page;
      };
      if (!detail) for (int i = 0; i < 10; i++) id(slot_train)[i] = 0;
      // unlit LED rows behind the text, like a real dot-matrix board
      const int bgs = id(bg_style).active_index().value_or(1);
      if (bgs > 0 && view == 0 && !detail) {
        // each band covers the letters themselves: capital height down to the descenders, plus padding
        auto ink = [&](font::Font *f, int top, int &a, int &b) {
          int t0, b0;
          ink_of(f, t0, b0);
          a = top + t0 - 2;
          b = top + b0 + 2;
        };
        if (lay == 2) cmp_bands();
        else for (int s = 0; s < count; s++) {
          int y = 6 + HDR + s * H + pad;
          int mt, mb, st, sb;
          ink(fr, y, mt, mb);
          ink(fs, y + SUBOFF, st, sb);
          if (mb > st - 3) { int mid = (mb + st) / 2; mb = mid - 1; st = mid + 2; }   // thin gap between the two lines
          // the bands fill the train's slot, leaving a 3 px gap to the next train
          int top = 6 + HDR + s * H + 1, bottom = std::min(6 + HDR + (s + 1) * H - 2, 411);
          mt = std::min(mt, top);
          sb = std::max(sb, bottom);
          frect(10, mt, 780, mb - mt);
          frect(10, st, 780, sb - st);
        }
        {
          const int fb = 418 + 34;                       // footer baseline
          int ft = fb - std::max(F_SUB[fi]->get_capheight(), F_CLK[fi]->get_capheight()) - 7;
          int fbm = fb + std::abs(F_SUB[fi]->get_descender()) + 5;
          ft = std::min(ft, 418 + 1);                     // room for the logo (418+4 .. 418+39)
          fbm = std::min(std::max(fbm, 418 + 42), 478);
          frect(10, ft, 780, fbm - ft);
        }
        if (bgs == 2) {                                   // fine grid: the gaps between LEDs
          fgrid();
        }
      } else if (bgs > 0) {
        // train details, the Platform layout and the clock screen: the footer band too
        const int fb = 418 + 34;
        int ft = fb - std::max(F_SUB[fi]->get_capheight(), F_CLK[fi]->get_capheight()) - 7;
        int fbm = fb + std::abs(F_SUB[fi]->get_descender()) + 5;
        ft = std::min(ft, 418 + 1);
        fbm = std::min(std::max(fbm, 418 + 42), 478);
        lband(10, ft, 780, fbm - ft);
      }

      // shorten s with "..." until it fits in maxw pixels
      auto heart = [&](int cx, int cy, int s, Color c) {
        static const char *HB[6] = {".XX.XX.", "XXXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."};
        const int x0 = cx - 7 * s / 2, y0 = cy - 3 * s;
        for (int r = 0; r < 6; r++)
          for (int k = 0; k < 7; k++)
            if (HB[r][k] == 'X') it.filled_rectangle(x0 + k * s, y0 + r * s, s, s, c);
      };
      const std::string fav_stn = id(station_ts).state;
      auto fit = [&](std::string &s, font::Font *f, int maxw) {
        if (maxw < 20) { s.clear(); return; }
        int fbx, fby, fbw, fbh;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &fbx, &fby, &fbw, &fbh);
        if (fbw <= maxw) return;
        while (!s.empty()) {
          s.pop_back();
          while (!s.empty() && s.back() == ' ') s.pop_back();
          std::string t = s + "...";
          it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &fbx, &fby, &fbw, &fbh);
          if (fbw <= maxw) { s = t; return; }
        }
      };
      auto draw_bigclock = [&]() {
        if (!tv) return;
        int hh = now.hour;
        const char *ap = "";
        if (id(clock_12h).state) { ap = hh >= 12 ? "pm" : "am"; hh = hh % 12; if (hh == 0) hh = 12; }
        char cb[16];
        snprintf(cb, sizeof(cb), "%02d:%02d%s", hh, now.minute, ap);
        it.printf(400, 105, F_BIG[fi], amber, TextAlign::CENTER, "%s", cb);
        std::string ds = now.strftime("%A %d %B");
        if (!wx_ok()) { it.print(400, 215, F_ROWL[fi], amber, TextAlign::CENTER, ds.c_str()); return; }
        int dbx, dby, dw, dh, tw;
        it.get_text_bounds(0, 0, ds.c_str(), F_ROWL[fi], TextAlign::TOP_LEFT, &dbx, &dby, &dw, &dh);
        it.get_text_bounds(0, 0, id(wx_temp).c_str(), F_ROWL[fi], TextAlign::TOP_LEFT, &dbx, &dby, &tw, &dh);
        const int total = dw + 40 + 44 + 12 + tw + 12;
        int x = 400 - total / 2;
        it.print(x, 215, F_ROWL[fi], amber, TextAlign::CENTER_LEFT, ds.c_str());
        x += dw + 40;
        draw_wx(x + 22, 215, 44, id(wx_cond), amber);
        x += 44 + 12;
        it.print(x, 215, F_ROWL[fi], amber, TextAlign::CENTER_LEFT, id(wx_temp).c_str());
        it.circle(x + tw + 7, 215 - 14, 4, amber); it.circle(x + tw + 7, 215 - 14, 3, amber);   // degree sign
      };
      // Platform layout / clock screen: the trains are collected first, then the first one you can still catch is shown
      struct NextTrain {
        int n;
        std::string sched, exp, plat, pchg, pprev, calls, oper, delaym, reason, stops;
        bool cancelled, late;
        int mins;
      };
      static std::vector<NextTrain> nexts;
      nexts.clear();
      auto next_add = [&](int n, const std::string &sched, const std::string &exp, const std::string &plat,
                           const std::string &pchg, const std::string &pprev, const std::string &calls,
                           const std::string &oper, const std::string &delaym, const std::string &reason,
                           const std::string &stops, bool cancelled, bool late) {
        if (nexts.size() >= 10) return;
        const std::string pf = id(plat_filter).state;
        if (id(layout_select).active_index().value_or(0) == 3 && !pf.empty() && plat != pf) return;   // Platform layout: just the chosen platform
        int m = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
        nexts.push_back(NextTrain{n, sched, exp, plat, pchg, pprev, calls, oper, delaym, reason, stops, cancelled, late, m});
      };
      auto fband = [&](int y0, int h) { lband(10, y0, 780, h); };     // band behind a line of the next train, following the Background setting
      auto draw_next = [&](int vw, const NextTrain &t, const NextTrain *t2, const NextTrain *t3) {
        std::string sched = t.sched, exp = t.exp, plat = t.plat, delaym = t.delaym;
        const bool cancelled = t.cancelled, late = t.late;
        const int mins = t.mins;
        std::string dest = departure::destination(t.calls, 24);
        Color sc = cancelled ? red : (late ? orange : green);
        if (delaym.size() > 2 && delaym.compare(delaym.size() - 2, 2, ".0") == 0) delaym.resize(delaym.size() - 2);
        const bool bus = plat.find("Bus") != std::string::npos || plat.find("bus") != std::string::npos;
        if (vw == 2) {
          std::string st = cancelled ? "Cancelled" : (late ? "Delayed" : "On time");
          if (late && departure::valid(delaym) && delaym != "0") st += " " + delaym + " min";
          std::string pl = (departure::valid(plat) && !cancelled) ? "Platform " + plat : "";
          draw_bigclock();
          it.printf(400, 290, F_ROWL[fi], amber, TextAlign::CENTER, "%s  %s", sched.c_str(), dest.c_str());
          std::string l2 = pl.empty() ? st : pl + "   " + st;
          it.print(400, 350, F_SUB[fi], sc, TextAlign::CENTER, l2.c_str());
          return;
        }
        auto width = [&](const std::string &s, font::Font *f) {
          if (s.empty()) return 0;
          int x0, y0, w0, h0;
          it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x0, &y0, &w0, &h0);
          return w0;
        };
        font::Font *fL = F_ROWL[fi], *fS = F_SUB[fi];
        int lT, lB, sT2, sB2;
        ink_of(fL, lT, lB);
        ink_of(fS, sT2, sB2);
        const int hl = lB - lT, hs = sB2 - sT2;
        // Tube: line and direction kept apart from where the train is
        std::string ftline = t.oper;
        if (id(src_tfl)) {
          const size_t p1 = t.oper.find(" - ");
          const size_t p2 = p1 == std::string::npos ? std::string::npos : t.oper.find(" - ", p1 + 3);
          if (p2 != std::string::npos) ftline = t.oper.substr(0, p2);
        }
        // status on the right: Cancelled / Delayed / Exp 22:09 / On time, or a countdown (Tube, or Countdown on)
        auto status = [&](const NextTrain &f, Color &c) {
          std::string s;
          c = f.cancelled ? red : (f.late ? orange : green);
          if (f.cancelled) s = "Cancelled";
          else if (id(src_tfl) || id(countdown_mode).state) {
            if (f.mins < 0) s = "--"; else if (f.mins <= 1) s = "Due"; else s = to_string(f.mins) + " min";
          }
          else if (f.late && departure::valid(f.exp) && f.exp.find(':') != std::string::npos) s = "Exp " + f.exp.substr(0, 5);
          else if (f.late) s = "Delayed";
          else s = "On time";
          return s;
        };
        // one train on one line: "1st 21:39 Leeds ...... On time"
        auto train_line = [&](const NextTrain &f, const char *ord, int ytop, font::Font *fL) {
          Color c;
          const std::string st = status(f, c);
          const int wst = width(st, fL);
          int x = 22;
          it.printf(x, ytop, fL, sub_col, TextAlign::TOP_LEFT, "%s", ord);
          x += width(std::string(ord) + " ", fL);
          const Color tc = f.cancelled && id(fade_cancelled).state ? cxl_col : amber;
          it.print(x, ytop, fL, tc, TextAlign::TOP_LEFT, f.sched.c_str());
          x += width(f.sched + "  ", fL);
          std::string d = departure::destination(f.calls, 80);
          for (size_t ai = 0; width(d, fL) > 784 - wst - 24 - x && ai < departure::ABBR_N; ai++) departure::abbrev_word(d, ai);
          fit(d, fL, 784 - wst - 24 - x);
          it.print(x, ytop, fL, tc, TextAlign::TOP_LEFT, d.c_str());
          it.print(784, ytop, fL, c, TextAlign::TOP_RIGHT, st.c_str());
        };

        // ---- the next train, in full ----
        const int TOP_BOT = 304;                                  // bottom of the top band
        lband(10, 6, 780, TOP_BOT - 6);
        int ink = 20;                                             // ink top of the next line
        train_line(t, "1st", ink - lT, fL);
        ink += hl + 22;
        // platform (orange when it has changed) and the train company
        {
          std::string pl;
          if (!t.cancelled && bus) pl = "Replacement bus";
          else if (!t.cancelled && departure::valid(plat)) {
            pl = "Platform " + plat;
            if (departure::truthy(t.pchg) && departure::valid(t.pprev) && t.pprev != plat && !id(src_tfl)) pl += " (was " + t.pprev + ")";
          }
          const bool changed = pl.find("(was") != std::string::npos;
          std::string op = departure::valid(t.oper) ? (id(src_tfl) ? ftline : t.oper) : std::string("");
          fit(op, fS, 760 - width(pl, fS) - 30);
          if (!pl.empty()) it.print(22, ink - sT2, fS, changed ? sub_ora : sub_col, TextAlign::TOP_LEFT, pl.c_str());
          if (!op.empty()) it.print(784, ink - sT2, fS, sub_col, TextAlign::TOP_RIGHT, op.c_str());
          ink += hs + 18;
        }
        // why it's late or cancelled
        if (departure::valid(t.reason) && (late || cancelled)) {
          std::string rs = t.reason;
          fit(rs, fS, 760);
          it.print(22, ink - sT2, fS, cancelled ? sub_red : sub_ora, TextAlign::TOP_LEFT, rs.c_str());
          ink += hs + 14;
        }
        // calling points: "Church Fenton (21:45), Garforth (21:51) and Leeds (21:58)", wrapped; pages when long
        if (!cancelled) {
          std::vector<std::string> items;
          if (departure::valid(t.stops)) {
            std::vector<std::string> sl;                     // stops come as "Church Fenton 21:45, Garforth 21:51"
            size_t s0 = 0;
            while (s0 < t.stops.size()) {
              size_t s1 = t.stops.find(", ", s0);
              if (s1 == std::string::npos) s1 = t.stops.size();
              std::string one = t.stops.substr(s0, s1 - s0);
              while (!one.empty() && one[0] == ' ') one.erase(0, 1);
              if (!one.empty()) sl.push_back(one);
              s0 = s1 + 2;
            }
            for (auto &p : sl) {
              const size_t ls = p.rfind(' ');
              if (ls != std::string::npos && departure::is_hhmm(p.substr(ls + 1))) items.push_back(p.substr(0, ls) + " (" + p.substr(ls + 1) + ")");
              else items.push_back(p);
            }
          }
          if (items.empty()) for (auto &p : departure::points(t.calls)) items.push_back(p);
          if (!items.empty()) {
            it.printf(22, ink - sT2, fS, sub_col, TextAlign::TOP_LEFT, "Calling at:");
            ink += hs + 10;
            std::vector<std::string> words;
            for (size_t i = 0; i < items.size(); i++) {
              std::string w = items[i];
              if (i + 2 < items.size()) w += ",";
              else if (i + 2 == items.size()) w += " and";
              else if (items.size() == 1) w += " only";
              std::string cur;
              for (char ch : w) { if (ch == ' ') { if (!cur.empty()) words.push_back(cur); cur.clear(); } else cur += ch; }
              if (!cur.empty()) words.push_back(cur);
            }
            std::vector<std::string> lines;
            std::string line;
            for (auto &w : words) {
              const std::string tryl = line.empty() ? w : line + " " + w;
              if (width(tryl, fS) > 760 && !line.empty()) { lines.push_back(line); line = w; } else line = tryl;
            }
            if (!line.empty()) lines.push_back(line);
            const int per = std::max(1, (TOP_BOT - 10 - ink) / (hs + 10));    // lines that fit in the band
            const int pages_c = ((int) lines.size() + per - 1) / per;
            const int pg0 = pages_c > 1 ? (int) ((millis() / 5000) % pages_c) * per : 0;
            for (int i = pg0; i < (int) lines.size() && i < pg0 + per; i++) {
              it.print(22, ink - sT2, fS, amber, TextAlign::TOP_LEFT, lines[i].c_str());
              ink += hs + 10;
            }
          }
        }

        // ---- the 2nd and 3rd trains, taking turns ----
        if (t2 != nullptr) {
          const int MB_TOP = TOP_BOT + 10, MB_BOT = 410;
          lband(10, MB_TOP, 780, MB_BOT - MB_TOP);
          const bool two = t3 != nullptr;
          const bool show3 = two && (millis() / 4000) % 2;
          font::Font *f2 = F_ROW[fi];
          int t2T, t2B;
          ink_of(f2, t2T, t2B);
          const int ytop = (MB_TOP + MB_BOT) / 2 - (t2T + t2B) / 2;
          train_line(show3 ? *t3 : *t2, show3 ? "3rd" : "2nd", ytop, f2);
        }
      };
      auto draw_detail = [&](std::string sched, std::string exp, std::string plat, std::string pchg, std::string calls,
                             std::string reason, std::string oper, std::string delaym, std::string stops,
                             std::string sarr, std::string earr, std::string pprev, bool cancelled, bool late) {

        // ---------- detail page: laid out like a departure row, on the board's bands ----------
        font::Font *fh = F_ROW[fi], *fd = F_SUB[fi];
        int hT, hB, dT, dB;
        ink_of(fh, hT, hB);
        ink_of(fd, dT, dB);
        const int LHB = dB - dT + 8;                         // one band
        auto bandline = [&](int y, font::Font *f) {
          int t, b;
          ink_of(f, t, b);
          lband(10, y + t - 4, 780, b - t + 8);                    // follows the Background setting
        };
        int bx, by, bw, bh;
        const bool bus = plat.find("Bus") != std::string::npos || plat.find("bus") != std::string::npos;

        // line 1: time, destination, platform, status - the same columns as the list
        int y = 6 + HDR - hT + 6;                    // below the column headings, when they are on
        bandline(y, fh);
        Color sc = cancelled ? red : (late ? orange : green);
        std::string st = cancelled ? std::string("Cancelled") : ((late && departure::valid(exp)) ? exp : (late ? std::string("Delayed") : std::string("On time")));
        // Tube: the line and direction, and where the train is now ("At Platform", "Between X and Y")
        std::string tline = oper, tloc;
        if (id(src_tfl)) {
          const size_t a = oper.find(" - ");
          const size_t b = a == std::string::npos ? std::string::npos : oper.find(" - ", a + 3);
          if (b != std::string::npos) { tline = oper.substr(0, b); tloc = oper.substr(b + 3); }
          if (!cancelled) {
            const std::string sn = id(station_ts).state;
            const bool arr = tloc == "At Platform" || (!sn.empty() && (tloc.rfind("At " + sn, 0) == 0 || tloc.rfind("Approaching " + sn, 0) == 0));
            const int tm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
            st = arr ? std::string("Arriving") : (tm <= 1 ? std::string("Due") : to_string(tm) + " min");
            sc = green;
          }
        }
        std::string pl = cancelled ? std::string("") : (bus ? std::string("Bus") : (departure::valid(plat) ? plat : std::string("")));
        int plw = 0;
        if (!pl.empty()) it.get_text_bounds(0, 0, pl.c_str(), fh, TextAlign::TOP_LEFT, &bx, &by, &plw, &bh);
        std::string dd = departure::destination(calls, 60);
        fit(dd, fh, (pl.empty() ? 784 - 140 : 610 - plw - 16) - 130);
        it.print(18, y, fh, amber, sched.c_str());
        it.print(130, y, fh, amber, dd.c_str());
        if (!pl.empty()) it.print(610, y, fh, departure::truthy(pchg) ? orange : amber, TextAlign::TOP_RIGHT, pl.c_str());
        it.print(784, y, fh, sc, TextAlign::TOP_RIGHT, st.c_str());
        if (id(src_tfl) && id(tfl_colours).state && pprev.size() == 7 && pprev[0] == '#') {
          int cr = strtol(pprev.substr(1, 2).c_str(), nullptr, 16), cg = strtol(pprev.substr(3, 2).c_str(), nullptr, 16), cb2 = strtol(pprev.substr(5, 2).c_str(), nullptr, 16);
          warm_rgb(cr, cg, cb2);
          const int mx = std::max(cr, std::max(cg, cb2));
          if (mx == 0) { cr = cg = cb2 = 200; } else if (mx < 150) { cr = cr * 150 / mx; cg = cg * 150 / mx; cb2 = cb2 * 150 / mx; }
          it.filled_rectangle(10, y + hT - 4, 5, (hB - hT + 8) * 2 + 3, Color(cr, cg, cb2));
        }
        y += (hB - hT + 8) + 3;
        if (id(src_tfl)) {
          auto wrap2 = [&](const std::string &txt, int x, int &yy, Color c) {      // up to two lines
            std::string rem = txt;
            for (int ln = 0; ln < 2 && !rem.empty(); ln++) {
              std::string line;
              size_t p = 0, next = std::string::npos;
              while (true) {
                size_t e = rem.find(' ', p);
                if (e == std::string::npos) e = rem.size();
                std::string cand = rem.substr(0, e);
                it.get_text_bounds(0, 0, cand.c_str(), fd, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
                if (bw > 784 - x && !line.empty()) break;
                line = cand; next = e + 1;
                if (e >= rem.size()) break;
                p = e + 1;
              }
              rem = (next < rem.size()) ? rem.substr(next) : "";
              if (ln == 1 && !rem.empty()) line += " ...";
              fit(line, fd, 784 - x);
              it.print(x, yy, fd, c, line.c_str());
              yy += LHB;
            }
          };
          // line 2: the line and direction
          bandline(y, fd);
          std::string tl = tline;
          fit(tl, fd, 784 - 130);
          it.print(130, y, fd, sub_col, tl.c_str());
          y += LHB + 14;
          // where the train is now
          if (!tloc.empty() && !cancelled) {
            it.printf(18, y, fd, grey, "Now");
            wrap2(tloc, 130, y, amber);
            y += 10;
          }
          // the next trains from the same platform
          if (departure::valid(plat)) {
            int shown = 0;
            bool past_this = false;
            for (int i = 0; i < 10 && shown < 2; i++) {
              const departure::Train &tr = departure::trains()[i];
              if (!departure::valid(tr.sched) || tr.plat != plat) continue;
              if (!past_this) { if (tr.sched == sched && tr.calls == calls) past_this = true; continue; }
              if (departure::departed(tr.exp.empty() ? tr.sched : tr.exp, nowmin, grace)) continue;
              if (shown == 0) { it.printf(18, y, fd, grey, "Then from platform %s", plat.c_str()); y += LHB; }
              const int tm = departure::minutes_until(tr.exp.empty() ? tr.sched : tr.exp, nowmin);
              char cd[16];
              if (tm <= 1) snprintf(cd, sizeof(cd), "Due"); else snprintf(cd, sizeof(cd), "%d min", tm);
              int cdw;
              it.get_text_bounds(0, 0, cd, fd, TextAlign::TOP_LEFT, &bx, &by, &cdw, &bh);
              std::string dn = departure::destination(tr.calls, 60);
              fit(dn, fd, 784 - cdw - 24 - 130);
              it.printf(18, y, fd, amber, "%s", tr.sched.c_str());
              it.print(130, y, fd, amber, dn.c_str());
              it.printf(784, y, fd, green, TextAlign::TOP_RIGHT, "%s", cd);
              y += LHB;
              shown++;
            }
            if (shown) y += 10;
          }
          // the line's status (from the London Underground integration, sent as messages)
          std::string lname = tline.substr(0, tline.find(" - "));
          std::string key = lname.substr(0, lname.find(' '));
          std::string found;
          {
            std::string cur;
            for (char ch : id(msg_text) + "\n") {
              if (ch == '\n') { if (!key.empty() && cur.find(key) != std::string::npos) { found = cur; break; } cur.clear(); }
              else cur += ch;
            }
          }
          if (y < 400 && !lname.empty()) {
            if (!found.empty()) wrap2(found, 18, y, orange);
            else it.printf(18, y, fd, green, "%s: Good service", lname.c_str());
          }
          return;
        }

        // line 2: operator, countdown on the right
        char cb[24] = "";
        if (!cancelled) {
          int dm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
          if (dm >= 0) {
            if (dm <= 1) snprintf(cb, sizeof(cb), "Due");
            else if (dm < 60) snprintf(cb, sizeof(cb), "in %d min", dm);
            else snprintf(cb, sizeof(cb), "in %dh %02dm", dm / 60, dm % 60);
          }
        }
        int cw = 0;
        if (cb[0]) it.get_text_bounds(0, 0, cb, fd, TextAlign::TOP_LEFT, &bx, &by, &cw, &bh);
        bandline(y, fd);
        std::string op = departure::valid(oper) ? oper : std::string("");
        if (departure::truthy(pchg) && departure::valid(pprev) && !bus) op += (op.empty() ? "" : "  -  ") + std::string("was platform ") + pprev;
        fit(op, fd, 784 - (cw ? cw + 24 : 0) - 130);
        it.print(130, y, fd, amber, op.c_str());
        if (cb[0]) it.printf(784, y, fd, late ? orange : green, TextAlign::TOP_RIGHT, "%s", cb);
        y += LHB + 3;

        // line 3: replacement bus / delay / arrival
        if (delaym.size() > 2 && delaym.compare(delaym.size() - 2, 2, ".0") == 0) delaym.resize(delaym.size() - 2);
        std::string l3;
        Color l3c = amber;
        if (bus) l3 = "Replacement bus";
        if (cancelled) { l3 += (l3.empty() ? "" : "  -  ") + std::string("Cancelled"); l3c = red; }
        else {
          if (late && departure::valid(delaym) && delaym != "0") l3 += (l3.empty() ? "" : "  -  ") + delaym + " min late";
          if (departure::valid(sarr)) {
            bool latearr = departure::valid(earr) && earr != sarr;
            l3 += (l3.empty() ? "" : "  -  ") + std::string("Arrives ") + (latearr ? earr : sarr);
          }
        }
        if (!l3.empty()) {
          bandline(y, fd);
          fit(l3, fd, 784 - 130);
          it.print(130, y, fd, l3c, l3.c_str());
          y += LHB + 3;
        }
        // delay or cancellation reason, wrapped onto up to two lines
        if (departure::valid(reason)) {
          std::string rem = reason;
          for (int ln = 0; ln < 2 && !rem.empty(); ln++) {
            std::string line;
            size_t p = 0, next = std::string::npos;
            while (p <= rem.size()) {
              size_t e = rem.find(' ', p);
              if (e == std::string::npos) e = rem.size();
              std::string cand = rem.substr(0, e);
              it.get_text_bounds(0, 0, cand.c_str(), fd, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
              if (bw > 784 - 130 && !line.empty()) break;
              line = cand;
              next = e + 1;
              if (e >= rem.size()) break;
              p = e + 1;
            }
            rem = (next != std::string::npos && next < rem.size()) ? rem.substr(next) : "";
            if (ln == 1 && !rem.empty()) line += " ...";
            fit(line, fd, 784 - 130);
            bandline(y, fd);
            it.print(130, y, fd, amber, line.c_str());
            y += LHB + 3;
          }
        }

        // calling points: heading, then a route line in two columns, paged when long
        std::vector<std::pair<std::string, std::string>> stp;
        if (departure::valid(stops)) {
          size_t pos = 0;
          while (pos < stops.size()) {
            size_t e = stops.find(", ", pos);
            std::string item = stops.substr(pos, e == std::string::npos ? std::string::npos : e - pos);
            pos = (e == std::string::npos) ? stops.size() : e + 2;
            if (item.size() > 6 && item[item.size() - 6] == ' ') stp.push_back({item.substr(0, item.size() - 6), item.substr(item.size() - 5)});
            else stp.push_back({item, ""});
          }
        } else {
          for (auto &p : departure::points(calls)) stp.push_back({p, ""});
        }
        if (stp.empty()) return;
        y += 5;
        int rows = (414 - (y + LHB + dT - 4)) / (LHB + 3);
        if (rows < 1) rows = 1;
        const int per = rows * 2;
        const int npages = ((int) stp.size() + per - 1) / per;
        const int pg = npages > 1 ? (int) ((millis() / 8000) % npages) : 0;
        it.printf(18, y, fd, grey, id(src_tfl) ? "Going to" : "Calling at");
        {
          char pgb[12] = "";
          int pgw = 0;
          if (npages > 1) {
            snprintf(pgb, sizeof(pgb), "%d/%d", pg + 1, npages);
            it.get_text_bounds(0, 0, pgb, fd, TextAlign::TOP_LEFT, &bx, &by, &pgw, &bh);
            it.printf(784, y, fd, grey, TextAlign::TOP_RIGHT, "%s", pgb);
          }
          if (!id(src_tfl) && id(hist_pct) >= 0) {
            char hb[64];
            if (id(hist_avg) >= 1) snprintf(hb, sizeof(hb), "Station: %d%% on time, avg %d min late", id(hist_pct), id(hist_avg));
            else snprintf(hb, sizeof(hb), "Station: %d%% on time", id(hist_pct));
            std::string ht = hb;
            const Color hc = id(hist_pct) >= 80 ? green : (id(hist_pct) >= 60 ? amber : orange);
            int lw;
            it.get_text_bounds(0, 0, "Calling at", fd, TextAlign::TOP_LEFT, &bx, &by, &lw, &bh);
            const int right = 784 - (pgw ? pgw + 20 : 0);
            fit(ht, fd, right - (18 + lw + 30));
            it.print(right, y, fd, hc, TextAlign::TOP_RIGHT, ht.c_str());
          }
        }
        y += LHB;
        int tmw;
        it.get_text_bounds(0, 0, "00:00", fd, TextAlign::TOP_LEFT, &bx, &by, &tmw, &bh);
        const int first = pg * per;
        const int last_i = std::min((int) stp.size(), first + per);
        for (int r = 0; r < rows && first + r < last_i; r++) bandline(y + r * (LHB + 3), fd);
        for (int i = first; i < last_i; i++) {
          int k = i - first, col = k / rows, row = k % rows;
          int x0 = 18 + col * 392;
          int yy = y + row * (LHB + 3);
          int lx = x0 + tmw + 16;
          int my = yy + (dT + dB) / 2;
          bool is_last = (i == (int) stp.size() - 1);
          bool fav = !fstop.empty() && departure::ieq(stp[i].first, fstop);
          Color tc = fav ? hilite : amber;
          // the route line joins the stops; it carries on past the edge of a page when the route does
          if (row > 0 || i > 0) it.filled_rectangle(lx - 1, yy + dT - 4, 2, my - (yy + dT - 4), amber);
          if (!is_last) it.filled_rectangle(lx - 1, my, 2, (yy + dB + 4 + (row < rows - 1 ? 3 : 0)) - my, amber);
          it.filled_circle(lx, my, is_last ? 6 : 4, amber);
          if (!stp[i].second.empty())
            it.print(x0 + tmw, yy, fd, fav ? hilite : (late ? orange : amber), TextAlign::TOP_RIGHT, stp[i].second.c_str());
          std::string nm = stp[i].first;
          fit(nm, fd, (last_i - first <= rows ? 784 : x0 + 383) - (lx + 18));
          it.print(lx + 18, yy, fd, tc, nm.c_str());
        }
      };

      if (HDR > 0 && view == 0) {
        font::Font *fh = id(f_hdr_0);
        const Color hc = bg_col.r > 200 ? Color(26, 26, 26) : Color(255, 255, 255);   // white (dark on a light background)
        const int hy = 5;                                                            // letters well clear of the line
        it.printf(TX, hy, fh, hc, "Time");
        // "Destination (all call at Leeds)" on a route or with the board's own "calling at" filter
        std::string dh = "Destination";
        if (!filt.empty()) dh += " (all call at " + filt + ")";
        else if (!id(route_to).empty()) dh += " (all call at " + id(route_to) + ")";
        fit(dh, fh, (id(show_platform).state ? PX - 60 : 784 - 70) - DX);
        it.print(DX, hy, fh, hc, dh.c_str());
        if (id(show_platform).state) it.printf(PX, hy, fh, hc, TextAlign::TOP_RIGHT, "Plat");
        it.printf(784, hy, fh, hc, TextAlign::TOP_RIGHT, "Expected");
      }
      std::string top_key_now, second_key_now;     // to spot the top train leaving
      id(plats_now).clear();
      // ---- the trains, in order (each read in place from the train table) ----
      for (int tn = 1; tn <= 10; tn++) {
        const departure::Train &tr = departure::train(tn);
        const std::string &sched = tr.sched, &exp = tr.exp, &stat = tr.stat, &plat = tr.plat, &pchg = tr.pchg, &calls = tr.calls;
        const std::string &dreason = tr.dreason, &creason = tr.creason, &oper = tr.oper, &stops = tr.stops;
        const std::string &sarr = tr.sarr, &earr = tr.earr, &pprev = tr.pprev;
        std::string delaym = tr.delaym;                  // trimmed of ".0" further down
        std::string reason = (stat == "cancelled") ? creason : dreason;
        // Tube rows: "Jubilee - N/bound - Left West Hampstead" so where the train is fits
        std::string oper_s = oper;
        if (id(src_tfl)) {
          size_t lp = oper_s.find(" line - ");
          if (lp != std::string::npos) oper_s.erase(lp, 5);
          static const char *const DIRS[4][2] = {{"Northbound", "N/bound"}, {"Southbound", "S/bound"}, {"Eastbound", "E/bound"}, {"Westbound", "W/bound"}};
          for (auto &d : DIRS) { size_t dp = oper_s.find(d[0]); if (dp != std::string::npos) { oper_s.replace(dp, strlen(d[0]), d[1]); break; } }
        }
        bool cancelled = (stat == "cancelled");
        if (departure::valid(plat) && plat.find("us") == std::string::npos && id(plats_now).size() < 20 &&
            std::find(id(plats_now).begin(), id(plats_now).end(), plat) == id(plats_now).end()) id(plats_now).push_back(plat);
        if (departure::valid(sched) && nowmin >= 0) {
          const std::string &tt = exp.size() >= 5 ? exp : sched;
          int dm = ((atoi(tt.substr(0, 2).c_str()) * 60 + atoi(tt.substr(3, 2).c_str()) - nowmin) % 1440 + 1440) % 1440;
          if (dm <= 720 || 1440 - dm <= 10) n_recent++;
        }
        if (departure::valid(sched) && !departure::departed(exp.empty() ? sched : exp, nowmin, grace)
            && departure::calls_at(calls, filt) && !(cancelled && id(hide_cancelled).state)) {
          std::string dest = departure::destination(calls, 80);
          bool late = (stat == "delayed");
          const int eidx = elig++;
          if (eidx == 0) top_key_now = sched + "|" + dest; else if (eidx == 1) second_key_now = sched + "|" + dest;
          if (eidx < 10) id(elig_list)[eidx] = tn;
          const int tnum = tn;
          if (eidx < 10) cmp_tall_now[eidx] = (late || cancelled) && departure::valid(reason);
          {
            int lm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
            if (leave_mins < 0 && !cancelled && lm >= 0 && lm >= walk) leave_mins = lm - walk;
          }
          if (detail) {
            if (id(detail_train) == tn) {
              draw_detail(sched, exp, plat, pchg, calls, reason, oper, delaym, stops, sarr, earr, pprev, cancelled, late); dfound = true;
            }
          } else if (view != 0) {
            next_add(tn, sched, exp, plat, pchg, pprev, calls, oper, delaym, reason, stops, cancelled, late);
          } else if ((lay == 2 ? (slot < 10 && eidx < 10 && cmp_y[eidx < 10 ? eidx : 0] != C_NONE) : slot < count) && on_page(eidx) && !switching) {
          id(slot_train)[slot] = tn;
          id(slot_ybot)[slot] = (lay == 2) ? cmp_bot[eidx] : 6 + HDR + (slot + 1) * H;
          int y = (lay == 2) ? cmp_y[eidx] : 6 + HDR + slot * H + pad;
          // page animation: the text slides up into its row, one row after another (the pinned top train stays)
          int aoff = 0;
          const int arow_top = slot > 0 ? id(slot_ybot)[slot - 1] : 6 + HDR;
          if (anim_active && (anim_all || !(eidx == 0 && (lay == 2 || pin)))) {
            const int k = slot - ((lay == 2 || pin) && !anim_all ? 1 : 0);   // order among the rows that move
            int el = (int) (millis() - anim_t0) - 150 * k;      // rows appear one after another
            float p = el <= 0 ? 0.f : (el >= 250 ? 1.f : el / 250.f);
            p = 1.f - (1.f - p) * (1.f - p);
            aoff = (int) ((id(slot_ybot)[slot] - arow_top) * (1.f - p));
          }
          y += aoff;
          if (aoff > 0) it.start_clipping(0, arow_top, 800, id(slot_ybot)[slot]);
          int mins = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
          bool soon = walk > 0 && !cancelled && mins >= 0 && mins < walk;   // too soon to walk there
          Color c0 = soon ? grey : amber;
          Color c0s = soon ? grey : sub_col;
          if (cancelled && id(fade_cancelled).state) { c0 = cxl_col; c0s = cxl_col; }
          it.print(TX, y, fr, c0, sched.c_str());
          if (id(src_tfl) && id(tfl_colours).state && pprev.size() == 7 && pprev[0] == '#') {
            // TfL line colour (sent in place of the previous platform), brightened so dark lines show on black
            int cr = strtol(pprev.substr(1, 2).c_str(), nullptr, 16), cg = strtol(pprev.substr(3, 2).c_str(), nullptr, 16), cb = strtol(pprev.substr(5, 2).c_str(), nullptr, 16);
            warm_rgb(cr, cg, cb);
            const int mx = std::max(cr, std::max(cg, cb));
            if (mx == 0) { cr = cg = cb = 200; }
            else if (mx < 150) { cr = cr * 150 / mx; cg = cg * 150 / mx; cb = cb * 150 / mx; }   // only the darkest lines (Piccadilly blue) are lifted
            const int bt = slot > 0 ? id(slot_ybot)[slot - 1] : 6 + HDR;
            const int bh = id(slot_ybot)[slot] - bt - 6;
            if (bh > 0) it.filled_rectangle(10, bt + 3 + aoff, 5, bh, Color(cr, cg, cb));
          }
          {
            const bool has_sub = lay != 2 || eidx == 0 || (eidx < 10 && cmp_ry[eidx] != C_NONE);
            const int hy0 = (lay == 2 && eidx != 0 && eidx < 10) ? cmp_ry[eidx] + aoff : y + SUBOFF;
            if (departure::fav_match(favs, sched, fav_stn)) {
              int ux, uy, uw, uh;
              it.get_text_bounds(TX, y, sched.c_str(), fr, TextAlign::TOP_LEFT, &ux, &uy, &uw, &uh);
              if (has_sub) heart(ux + uw / 2, hy0 + (sT + sB) / 2, L ? 5 : 4, c0);
              else it.filled_rectangle(ux, uy + uh + 2, uw, 3, c0);
            } else if (id(ord_labels).state && has_sub) {            // train number, dimmed under the time
              const int n = eidx + 1;
              const char *sfx = (n % 100 >= 11 && n % 100 <= 13) ? "th" : (n % 10 == 1 ? "st" : n % 10 == 2 ? "nd" : n % 10 == 3 ? "rd" : "th");
              it.printf(TX, hy0, fs, c0s, "%d%s", n, sfx);
            }
          }
          {
            // too long for the column: try the short forms real boards use, then slide (or "..." with scrolling off)
            const int davail = (id(show_platform).state ? PX - (L ? 90 : 70) : 784 - (L ? 230 : 160)) - DX;
            std::string dshow = dest;
            int dbx, dby, dw, dbh;
            it.get_text_bounds(0, 0, dshow.c_str(), fr, TextAlign::TOP_LEFT, &dbx, &dby, &dw, &dbh);
            for (size_t ai = 0; dw > davail && ai < departure::ABBR_N; ai++)
              if (departure::abbrev_word(dshow, ai)) it.get_text_bounds(0, 0, dshow.c_str(), fr, TextAlign::TOP_LEFT, &dbx, &dby, &dw, &dbh);
            if (dw > davail && id(scroll_enabled).state && davail > 40) {
              const int over = dw - davail;                         // pixels hidden at the end
              const int run = over * 1000 / sp;                     // time to slide across
              const int cyc = 3000 + run + 1500;                    // still, slide, pause at the end
              const int t = (int) ((millis() + (uint32_t) eidx * 1300) % (uint32_t) cyc);   // rows out of step
              const int off = t < 3000 ? 0 : (t < 3000 + run ? (t - 3000) * sp / 1000 : over);
              it.start_clipping(DX, y + rT - 3, DX + davail, y + rB + 3);
              it.print(DX - off, y, fr, c0, dshow.c_str());
              it.end_clipping();
            } else {
              if (dw > davail) fit(dshow, fr, davail);
              it.print(DX, y, fr, c0, dshow.c_str());
            }
          }
          if (id(show_platform).state && departure::valid(plat) && !cancelled) {
            const bool pbus = plat.find("Bus") != std::string::npos || plat.find("bus") != std::string::npos;
            const std::string pshow = pbus ? std::string("Bus") : plat;
            // a change only when there was a platform before (a first allocation is not a change)
            if (departure::truthy(pchg) && departure::valid(pprev) && !pbus && !id(src_tfl)) {
              // platform changed: flash it for the first minute this train is shown with the new platform
              std::string pk = sched + "|" + dest + "|" + plat;
              auto pit = pchg_seen.find(pk);
              if (pit == pchg_seen.end()) {
                if (pchg_seen.size() > 20) pchg_seen.clear();
                pit = pchg_seen.emplace(pk, millis()).first;
              }
              bool hide = millis() - pit->second < 60000 && (millis() / 500) % 2;
              if (!hide) it.print(PX, y, fr, orange, TextAlign::TOP_RIGHT, pshow.c_str());
            } else {
              it.print(PX, y, fr, c0, TextAlign::TOP_RIGHT, pshow.c_str());
            }
          }
          char cd[16];
          if (mins <= 1) snprintf(cd, sizeof(cd), "Due"); else snprintf(cd, sizeof(cd), "%d min", mins);
          bool countdown = (id(countdown_mode).state || id(src_tfl)) && mins >= 0 && mins < 60;
          if (cancelled)
            it.printf(784, y, fr, red, TextAlign::TOP_RIGHT, "Cancelled");
          else if (id(src_tfl) && stat == "arriving")            // TfL: approaching or at this station
            it.printf(784, y, fr, soon ? grey : green, TextAlign::TOP_RIGHT, "Arriving");
          else if (late && !(exp.size() >= 5 && isdigit((unsigned char) exp[0])))   // late, no new time yet
            it.printf(784, y, fr, soon ? grey : orange, TextAlign::TOP_RIGHT, "Delayed");
          else if (countdown)
            it.printf(784, y, fr, soon ? grey : (late ? orange : green), TextAlign::TOP_RIGHT, "%s", cd);
          else if (late)
            it.print(784, y, fr, soon ? grey : orange, TextAlign::TOP_RIGHT, exp.c_str());
          else
            it.printf(784, y, fr, soon ? grey : green, TextAlign::TOP_RIGHT, "On time");
          std::string arr_s;
          Color arr_c = c0s;                 // dimmed like the rest of the second line
          if (!id(route_to).empty() && !cancelled) {
            auto hm = [](const std::string &s) { return s.size() == 5 && s[2] == ':' && isdigit(s[0]) && isdigit(s[4]); };
            const bool ev = hm(earr), sv = hm(sarr);
            if (ev || sv) {
              arr_s = "Arrives " + (ev ? earr : sarr);
              if (ev && sv && earr != sarr && !soon) arr_c = sub_ora;
            }
          }
          if (lay != 0 && eidx != 0) {                       // only the next train scrolls, on every page
            // Calm and Compact: only the first train scrolls. Later rows stay still: the reason in
            // orange/red for a late or cancelled train; otherwise the operator (Calm) or nothing (Compact)
            std::string msg;
            Color mc = grey;
            if ((late || cancelled) && departure::valid(reason)) {
              msg = reason;                                   // the time column already shows the delay
              mc = cancelled ? sub_red : sub_ora;
            } else if (lay == 1) {
              mc = soon ? grey : sub_col;
              msg = departure::valid(oper) ? oper_s : "Calling at " + (departure::valid(stops) ? stops : departure::calling_list(calls, 200));
            }
            int ry = (lay == 2) ? (cmp_ry[eidx] == C_NONE ? C_NONE : cmp_ry[eidx] + aoff) : y + SUBOFF;
            int ax = DX;
            if (!arr_s.empty() && ry != C_NONE) {
              if (!msg.empty()) arr_s += "  -  ";
              int abx, aby, abw, abh;
              it.get_text_bounds(0, 0, arr_s.c_str(), fs, TextAlign::TOP_LEFT, &abx, &aby, &abw, &abh);
              it.print(DX, ry, fs, arr_c, arr_s.c_str());
              ax = DX + abw;
            }
            if (!msg.empty() && ry != C_NONE) {
              const int avail = SW - (ax - DX);
              int mbx, mby, mbw, mbh;
              it.get_text_bounds(0, 0, msg.c_str(), fs, TextAlign::TOP_LEFT, &mbx, &mby, &mbw, &mbh);
              if (id(src_tfl) && id(scroll_enabled).state && mbw > avail) {
                // a long Tube location scrolls: pause, glide to the end, pause, back to the start
                const int over = mbw - avail;
                const uint32_t move = (uint32_t) over * 1000 / sp, cyc = 2500 + move + 2500;
                const uint32_t ph = millis() % cyc;
                const int off = ph < 2500 ? 0 : (ph < 2500 + move ? (int) ((ph - 2500) * sp / 1000) : over);
                it.start_clipping(ax, ry - 10, ax + avail, ry + mbh + 20);
                it.print(ax - off, ry, fs, mc, msg.c_str());
                it.end_clipping();
              } else {
                fit(msg, fs, avail);
                it.print(ax, ry, fs, mc, msg.c_str());
              }
            }
            if (aoff > 0) it.end_clipping();
            slot++;
          } else {
          // scrolling sub-line: reason (orange/red) then "Calling at ..."
          if (delaym.size() > 2 && delaym.compare(delaym.size() - 2, 2, ".0") == 0) delaym.resize(delaym.size() - 2);
          std::string head;
          if (late && departure::valid(delaym) && delaym != "0") head = "Delayed " + delaym + " min";
          else if (cancelled) head = "Cancelled";
          if (departure::valid(reason)) head += (head.empty() ? "" : " - ") + reason;
          const size_t labn = (late || cancelled) ? head.size() : 0;   // the label and its reason are coloured
          if (!head.empty()) head += "   -   ";
          std::string lst = departure::valid(stops) ? stops : departure::calling_list(calls, 200);
          std::string tail = id(src_tfl) ? oper_s : (departure::valid(oper) ? oper + " - " : "") + "Calling at " + lst;
          int bx, by, bw, bh, tw;
          int aw = 0;
          if (!arr_s.empty()) {
            arr_s += "  -  ";
            it.get_text_bounds(0, 0, arr_s.c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &aw, &bh);
          }
          it.get_text_bounds(0, 0, (head + tail).c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
          bool scroll = bw + aw > SW && id(scroll_enabled).state;
          if (bw + aw > SW && !scroll) {
            size_t keep = (head.size() + tail.size()) * std::max(0, SW - 44 - aw) / bw;
            if (keep <= head.size()) { head.resize(keep); head += "..."; tail = ""; }
            else { tail.resize(keep - head.size()); tail += "..."; }
            it.get_text_bounds(0, 0, (head + tail).c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
          }
          it.get_text_bounds(0, 0, tail.c_str(), fs, TextAlign::TOP_LEFT, &bx, &by, &tw, &bh);
          int hw = bw - tw;
          Color rc = cancelled ? sub_red : sub_ora;   // dimmed like the rest of the second line
          int sy = y + SUBOFF;
          // favourite stop: drawn in white
          int hend = 0;
          int hpos = departure::find_stop(tail, fstop, hend);
          std::string pre, seg, post;
          int wpre = 0, wseg = 0;
          if (hpos >= 0) {
            pre = tail.substr(0, hpos);
            seg = tail.substr(hpos, hend - hpos);
            post = tail.substr(hend);
            int sbx, sby, sbh;
            if (!pre.empty()) { it.get_text_bounds(0, 0, pre.c_str(), fs, TextAlign::TOP_LEFT, &sbx, &sby, &wpre, &sbh); }
            it.get_text_bounds(0, 0, seg.c_str(), fs, TextAlign::TOP_LEFT, &sbx, &sby, &wseg, &sbh);
          }
          auto drawsub = [&](int x) {
            if (aw > 0) { it.print(x, sy, fs, arr_c, arr_s.c_str()); x += aw; }
            if (!head.empty()) {
              size_t k = std::min(labn, head.size());
              std::string l1 = head.substr(0, k), l2 = head.substr(k);
              int lw = 0;
              if (!l1.empty()) {
                int a, b, c;
                it.get_text_bounds(0, 0, l1.c_str(), fs, TextAlign::TOP_LEFT, &a, &b, &lw, &c);
                it.print(x, sy, fs, rc, l1.c_str());
              }
              if (!l2.empty()) it.print(x + lw, sy, fs, c0s, l2.c_str());
            }
            if (tail.empty()) return;
            if (hpos < 0) {
              it.print(x + hw, sy, fs, c0s, tail.c_str());
            } else {
              int tx = x + hw;
              if (!pre.empty()) it.print(tx, sy, fs, c0s, pre.c_str());
              it.print(tx + wpre, sy, fs, hilite, seg.c_str());
              if (!post.empty()) it.print(tx + wpre + wseg, sy, fs, c0s, post.c_str());
            }
          };
          it.start_clipping(DX, sy - 2, 784, sy + std::max(SUBH, (int) fs->get_height()) + 2);
          if (!scroll) {
            drawsub(DX);
          } else {
            int cyc = bw + aw + 120;
            int off = (int) (((uint64_t) (millis() - page_t0) * sp / 1000) % cyc);
            drawsub(DX - off);
            drawsub(DX - off + cyc);
          }
          it.end_clipping();
          if (aoff > 0) it.end_clipping();
          slot++;
          }
          }
        }
      }

      {
        static std::string top_prev, second_prev;
        if (view == 0 && !detail && !switching) {
          if (!top_prev.empty() && top_key_now != top_prev && top_key_now == second_prev && id(page_anim).state
              && (page == 0 || pin || lay == 2)) {
            anim_t0 = millis(); id(anim_until) = anim_t0 + 250 + 150 * 9; anim_all = true;
          }
          top_prev = top_key_now; second_prev = second_key_now;
        }
      }
      // Platform layout / clock screen: skip trains too soon to walk to (if a walking time is set), then draw
      if (view != 0 && !detail && !nexts.empty()) {
        size_t pick = 0;
        for (size_t k = 0; k < nexts.size(); k++) {
          const NextTrain &f = nexts[k];
          if (!(walk > 0 && !f.cancelled && f.mins >= 0 && f.mins < walk)) { pick = k; break; }
        }
        const NextTrain *t2 = (pick + 1 < nexts.size()) ? &nexts[pick + 1] : nullptr;
        const NextTrain *t3 = (pick + 2 < nexts.size()) ? &nexts[pick + 2] : nullptr;
        draw_next(view, nexts[pick], t2, t3);
        id(slot_train)[0] = nexts[pick].n;
        slot = 1;
      }

      {
        // publish "minutes until you must leave" to HA (only when it changes)
        int lv = (walk > 0 && leave_mins >= 0) ? leave_mins : -1;
        if (!detail && view == 0 && (!id(leave_in_s).has_state() || (int) id(leave_in_s).state != lv)) id(leave_in_s).publish_state(lv);
      }

      elig_prev = elig;
      id(elig_count) = elig;
      cmp_tall = cmp_tall_now;
      if (detail && !dfound) id(ui_screen) = 0;      // the train has gone: back to the list

      if (switching && !detail) {
        it.printf(400, 175, F_ROWL[fi], amber, TextAlign::CENTER, "Switching station or route");
        if (id(stn_count) > 1) {
          char sb[24];
          snprintf(sb, sizeof(sb), "%d of %d", (int) id(stn_num).state, (int) id(stn_count));
          it.printf(400, 235, F_SUB[fi], sub_col, TextAlign::CENTER, "%s", sb);
        }
      }
      {
        static uint32_t pop_for = 0, pop_until = 0;
        const uint32_t sw_ms = id(stn_switch_ms);
        if (sw_ms != 0 && sw_ms != pop_for && id(data_ms_stn) >= sw_ms) { pop_for = sw_ms; pop_until = millis() + 2000; }
        if (pop_until != 0 && (int32_t) (pop_until - millis()) > 0 && view == 0 && !detail) {
          std::string pn = stn_name;
          if (!id(route_to).empty()) pn += " to " + id(route_to);
          it.filled_rectangle(60, 170, 680, 90, band_col);
          it.rectangle(60, 170, 680, 90, hilite);
          it.rectangle(61, 171, 678, 88, hilite);
          fit(pn, F_ROWL[fi], 640);
          it.print(400, 215, F_ROWL[fi], amber, TextAlign::CENTER, pn.c_str());
        } else pop_until = 0;
      }
      if (id(fav_toast_until) != 0) {
        if ((int32_t) (id(fav_toast_until) - millis()) > 0) {
          it.filled_rectangle(100, 180, 600, 64, band_col);
          it.rectangle(100, 180, 600, 64, hilite);
          it.rectangle(101, 181, 598, 62, hilite);
          it.print(400, 212, id(f_row_0), amber, TextAlign::CENTER, id(fav_toast).c_str());
        } else id(fav_toast_until) = 0;
      }
      if (id(flash_slot) >= 0 && view == 0 && !detail) {
        if (millis() < id(flash_until)) {
          const int sl = id(flash_slot);
          const int top = sl > 0 ? id(slot_ybot)[sl - 1] : 6 + HDR;
          const int bot = id(slot_ybot)[sl];
          if (bot > top) { it.rectangle(10, top, 780, bot - top, hilite); it.rectangle(11, top + 1, 778, bot - top - 2, hilite); }
        } else {
          id(flash_slot) = -1;
          if (id(pending_detail) > 0) { id(detail_train) = id(pending_detail); id(ui_screen) = 2; id(last_fresh) = millis(); }
          id(pending_detail) = 0;
        }
      }
      // nothing to show: say why
      if (slot == 0 && !detail && elig == 0) {
        it.filled_rectangle(0, 0, 800, 416, bg_col);         // clear the column headings and empty row bands (the footer starts at 418)
        std::string l1, l2;
        bool big = false;
        std::string h1, h2;          // help lines in the smaller, softer text
        bool waiting = false;        // show moving dots
        const bool setup_scr = !wifi_ok || !api_ok || dms == 0;
        if (!wifi_ok) {
          l1 = "Connecting to Wi-Fi"; h1 = "This usually takes a few seconds"; waiting = true;
        } else if (!api_ok) {
          l1 = "Waiting for Home Assistant";
          h1 = "Add the board in Settings > Devices & services";
          const std::string ip = id(wifi_ip_ts).state;
          if (!ip.empty()) h2 = "Board address: " + ip;
          waiting = true;
        } else if (dms == 0 && millis() < 120000) {
          l1 = "Connected to Home Assistant"; h1 = "Waiting for train data from the automation"; waiting = true;
        } else if (dms == 0) {
          l1 = "No train data received";
          h1 = "Check the UK Departure Board automation";
          h2 = "is set up and switched on in Home Assistant";
        } else if (millis() - dms > 30UL * 60000UL) {
          l1 = "Train data is out of date";
          char ab[40];
          snprintf(ab, sizeof(ab), "Last update %u min ago", (unsigned) ((millis() - dms) / 60000));
          h1 = ab;
          h2 = "Check Home Assistant and My Rail Commute";
        } else if (!filt.empty()) {
          l1 = "No trains calling at"; l2 = filt;
        } else if (n_recent > 0) {
          l1 = "Waiting for new train times";
          h1 = "The trains listed have all just left";
          h2 = "At a busy station, a route works better";
          waiting = true;
        } else {
          l1 = "No more trains"; l2 = "tonight"; big = true;
        }
        if (big) {
          // nothing more today: big clock with the message underneath
          draw_bigclock();
          it.printf(400, 300, F_ROWL[fi], amber, TextAlign::CENTER, "No more trains tonight");
        } else {
          if (setup_scr) draw_logo(400, 30, 6, 2, 2, amber, band_col, 0);
          // which step of the setup guide helps here ("" = no QR code)
          const char *anchor = !wifi_ok ? "wifi" : (!api_ok ? "home-assistant" : ((dms == 0 || millis() - dms > 30UL * 60000UL) ? "trains" : ""));
          const bool qr = anchor[0] != 0;
          int yy = qr ? 125 : ((h1.empty() && l2.empty()) ? 190 : 140);
          it.print(400, yy, F_ROWL[fi], amber, TextAlign::CENTER, l1.c_str());
          if (!l2.empty()) { yy += qr ? 55 : 65; it.print(400, yy, F_ROWL[fi], amber, TextAlign::CENTER, l2.c_str()); }
          if (!h1.empty()) { yy += qr ? 50 : 60; fit(h1, F_SUB[fi], 760); it.print(400, yy, F_SUB[fi], sub_col, TextAlign::CENTER, h1.c_str()); }
          if (!h2.empty()) { yy += 36 + (qr ? 0 : 4); fit(h2, F_SUB[fi], 760); it.print(400, yy, F_SUB[fi], sub_col, TextAlign::CENTER, h2.c_str()); }
          if (qr) {
            static std::string qr_url;
            const std::string url = std::string("https://grimmnorth.github.io/departure-board/#") + anchor;
            if (qr_url != url) { id(qr_help).set_value(url); qr_url = url; }
            const int n = id(qr_help).get_size(), sc = 3, box = n * sc + 8 * sc;   // 4 modules of white all round
            const int bx = 400 - box / 2, by = 280;
            it.filled_rectangle(bx, by, box, box, Color(255, 255, 255));
            it.qr_code(bx + 4 * sc, by + 4 * sc, id(qr_help), Color(0, 0, 0), sc);
            it.printf(bx + box + 16, by + box / 2, F_SUB[fi], sub_col, TextAlign::CENTER_LEFT, "Scan for help");
            yy -= 10;
          }
          if (waiting) {
            // five dots, one lit, moving along so you can see the board is working
            const int lit = (int) ((millis() / 300) % 5);
            for (int d = 0; d < 5; d++) it.filled_circle(400 - 2 * 24 + d * 24, yy + 55, d == lit ? 6 : 4, d == lit ? amber : grey);
          }
        }
      }

      // footer: station left, status/info in the middle, clock right
      const int fy = 418;
      std::string info;
      Color infoc = amber;
      bool walk_ic = false;                      // draw a walking figure before the info text
      uint32_t age_min = dms ? (millis() - dms) / 60000 : 0;
      if (detail) { info = "< Prev  Close  Next >"; infoc = amber; }
      else if (!wifi_ok) { info = "No Wi-Fi"; infoc = red; }
      else if (!api_ok) { info = "No Home Assistant"; infoc = red; }
      else if (dms != 0 && age_min >= 5) {
        char ab[32];
        snprintf(ab, sizeof(ab), "Data %d min old", (int) age_min);
        info = ab;
        infoc = red;
      }
      else if (id(disruption_banner).state && departure::valid(disr) && disr != "Normal" && disr != "No service") {
        info = disr;
        infoc = (disr.find("ajor") != std::string::npos || disr.find("ritical") != std::string::npos || disr.find("evere") != std::string::npos) ? red : orange;
      }
      else if (walk > 0 && leave_mins >= 0) {
        char lb[32];
        if (leave_mins <= 0) snprintf(lb, sizeof(lb), "Now");
        else snprintf(lb, sizeof(lb), "%d min", leave_mins);
        info = lb;
        if (leave_mins > 2) infoc = green;
        else if (leave_mins > 0) infoc = orange;
        else infoc = (millis() / 700) % 2 ? orange : grey;   // "Now": a slow blink
        walk_ic = true;
      }
      else if (!id(help_seen) && view == 0) {
        info = "Tap the clock for settings";
        infoc = sub_col;
      }
      else if (pages > 1) {
        char pb[24];
        snprintf(pb, sizeof(pb), "%d/%d", page + 1, pages);
        info = pb;
        infoc = amber;
      }
      const Color footc = (id(footer_colour).active_index().value_or(0) == 1) ? (id(bg_col).r > 200 ? Color(26, 26, 26) : Color(255, 255, 255)) : amber;   // logo and station name (dark on a light background)
      std::string foot = STATION_NAMES[si];
      if (id(layout_select).active_index().value_or(0) == 3 && !id(plat_filter).state.empty() && !detail) foot += "  Platform " + id(plat_filter).state;
      if (info.empty() && (HDR == 0 || view != 0)) {
        if (!filt.empty()) foot += " > " + filt;
        else if (!id(route_to).empty()) foot += " > " + id(route_to);
      }
      int fx = 20;
      if (id(show_logo).state && (id(src_tfl) ? id(logo_tfl_ok) : id(logo_ok))) {
        // custom logo from Home Assistant, centred in the 56x35 logo space
        auto *lg = id(src_tfl) ? id(custom_logo_tfl) : id(custom_logo);
        if (id(src_tfl)) {
          // TfL logo in the footer colour: its coloured parts (a roundel's ring and bar) in the footer colour and
          // its white parts (the lettering) left in the background colour; an all-white logo is drawn whole
          const int ox = 20 + (56 - lg->get_width()) / 2, oy = fy + 7 + (35 - lg->get_height()) / 2;
          for (int py = 0; py < lg->get_height(); py++)
            for (int px = 0; px < lg->get_width(); px++) {
              const Color c = lg->get_pixel(px, py);
              if (c.w < 128) continue;                                   // transparent
              const bool light = (c.r * 30 + c.g * 59 + c.b * 11) / 100 > 190;
              it.draw_pixel_at(ox + px, oy + py, (light && !id(logo_tfl_light)) ? bg_col : footc);
            }
        } else it.image(20 + (56 - lg->get_width()) / 2, fy + 7 + (35 - lg->get_height()) / 2, lg, footc, bg_col);
        fx = 20 + 56 + 14;
      } else if (id(show_logo).state) {
        int lx = 20, ly = fy + 7;
        if (id(src_tfl)) {
          // tunnel, 56x35: an arch with the track running into the distance
          for (int py = 0; py <= 24; py++)
            for (int px = 4; px <= 52; px++) {
              const int ddx = px - 28, ddy = py - 24, d2 = ddx * ddx + ddy * ddy;
              if (d2 >= 20 * 20 && d2 < 24 * 24) it.draw_pixel_at(lx + px, ly + py, footc);
            }
          it.filled_rectangle(lx + 4, ly + 24, 4, 11, footc);                // the arch's sides
          it.filled_rectangle(lx + 49, ly + 24, 4, 11, footc);
          const int sly[3] = {20, 25, 30}, shw[3] = {6, 9, 12}, sh[3] = {2, 2, 3};
          for (int k = 0; k < 3; k++) it.filled_rectangle(lx + 28 - shw[k], ly + sly[k], 2 * shw[k] + 1, sh[k], footc);   // sleepers
          it.line(lx + 27, ly + 14, lx + 15, ly + 34, footc);                // rails
          it.line(lx + 28, ly + 14, lx + 16, ly + 34, footc);
          it.line(lx + 28, ly + 14, lx + 40, ly + 34, footc);
          it.line(lx + 29, ly + 14, lx + 41, ly + 34, footc);
        } else {
          // railway track, 56x35
          for (int sx = 3; sx < 56; sx += 11) it.filled_rectangle(lx + sx, ly + 7, 4, 22, footc);   // sleepers
          it.filled_rectangle(lx, ly + 11, 56, 3, footc);                    // rails
          it.filled_rectangle(lx, ly + 22, 56, 3, footc);
        }
        fx = 20 + 56 + 14;
      }
      // station, message and clock share one baseline; the clock is placed first, then the rest fits around it
      const int fb = fy + 34;
      int clk_left = 784;
      if (tv) {
        char cb[24];
        int hh = now.hour;
        const char *ap = "";
        if (id(clock_12h).state) { ap = hh >= 12 ? "pm" : "am"; hh = hh % 12; if (hh == 0) hh = 12; }
        if (id(show_seconds).state) snprintf(cb, sizeof(cb), "%02d:%02d:%02d%s", hh, now.minute, now.second, ap);
        else snprintf(cb, sizeof(cb), "%02d:%02d%s", hh, now.minute, ap);
        int kbx, kby, kbw, kbh;
        it.get_text_bounds(784, fb, cb, F_CLK[fi], TextAlign::BASELINE_RIGHT, &kbx, &kby, &kbw, &kbh);
        clk_left = kbx;
        it.printf(784, fb, F_CLK[fi], amber, TextAlign::BASELINE_RIGHT, "%s", cb);
      }
      id(msg_icon_x) = -1;
      if (id(msg_n) > 0 && !detail && !switching && id(msg_scroll).active_index().value_or(3) != 0) {   // not when Hidden
        const int icx = clk_left - 34, icy = fb - 11;
        const bool flash = millis() - id(msg_new_ms) < 6000 && (millis() / 400) % 2;   // flashes when a message arrives
        const Color ic = flash ? hilite : orange;
        it.circle(icx, icy, 16, ic);
        it.circle(icx, icy, 15, ic);
        it.printf(icx, icy, F_SUB[fi], ic, TextAlign::CENTER, "i");
        if (id(msg_n) > 1) {
          char nb[4];
          snprintf(nb, sizeof(nb), "%d", std::min(id(msg_n), 9));
          it.filled_circle(icx + 15, icy - 11, 10, ic);
          it.printf(icx + 15, icy - 11, id(f_hdr_0), bg_col, TextAlign::CENTER, "%s", nb);
        }
        id(msg_icon_x) = icx - 30;
        clk_left = icx - 20;
      }
      id(spk_icon_x) = -1;
      {
        const bool muted = id(board_media).is_muted();
        const auto mst = id(board_media).state;
        const bool talking = mst == media_player::MEDIA_PLAYER_STATE_ANNOUNCING || mst == media_player::MEDIA_PLAYER_STATE_PLAYING;
        if (id(sounds_sw).state && (muted || talking) && !detail && !switching) {
          const int scx = clk_left - 40, scy = fb - 11;
          const Color sc = muted ? grey : amber;
          it.filled_rectangle(scx - 14, scy - 5, 6, 11, sc);                         // the box
          it.filled_rectangle(scx - 8, scy - 5, 8, 11, sc);                          // the cone
          it.filled_triangle(scx - 8, scy - 5, scx - 1, scy - 12, scx - 1, scy - 5, sc);
          it.filled_triangle(scx - 8, scy + 5, scx - 1, scy + 12, scx - 1, scy + 5, sc);
          if (muted) {
            for (int d = -1; d <= 1; d++) {                                            // a cross where the waves would be
              it.line(scx + 5 + d, scy - 6, scx + 15 + d, scy + 6, sc);
              it.line(scx + 15 + d, scy - 6, scx + 5 + d, scy + 6, sc);
            }
          } else {
            const int nw = 1 + (millis() / 300) % 3;                                   // one, two, three waves, over and over
            for (int w = 0; w < nw; w++) {
              const int r0 = 6 + w * 6;
              for (int a = -50; a <= 50; a += 3) {
                const float rad = a * 3.14159f / 180.0f;
                for (int r = r0; r <= r0 + 1; r++)
                  it.draw_pixel_at(scx + (int) (r * cosf(rad)), scy + (int) (r * sinf(rad)), sc);
              }
            }
          }
          id(spk_icon_x) = scx - 24;
          clk_left = scx - 26;
        }
      }
      id(upd_icon_x) = -1;
      if (id(fw_update).state == update::UPDATE_STATE_AVAILABLE && !detail && !switching) {
        // update ready: an up arrow in a circle, left of the clock (and of the message icon)
        const int ucx = clk_left - 34, ucy = fb - 11;
        it.circle(ucx, ucy, 16, orange);
        it.circle(ucx, ucy, 15, orange);
        it.filled_triangle(ucx, ucy - 10, ucx - 8, ucy, ucx + 8, ucy, orange);
        it.filled_rectangle(ucx - 3, ucy, 7, 10, orange);
        id(upd_icon_x) = ucx - 30;
        clk_left = ucx - 20;
      }
      if (wx_ok() && !detail && !switching) {
        const std::string &tt = id(wx_temp);
        int tbx, tby, tbw, tbh;
        it.get_text_bounds(0, 0, tt.c_str(), F_SUB[fi], TextAlign::TOP_LEFT, &tbx, &tby, &tbw, &tbh);
        const int tr = clk_left - 30;                              // right edge of the number
        it.print(tr, fb, F_SUB[fi], amber, TextAlign::BASELINE_RIGHT, tt.c_str());
        it.circle(tr + 6, fb - 21, 3, amber); it.circle(tr + 6, fb - 21, 2, amber);   // degree sign
        const int icx = tr - tbw - 20;
        draw_wx(icx, fb - 11, 28, id(wx_cond), amber);
        clk_left = icx - 18;
      }
      int info_left = clk_left;
      if (!info.empty()) {
        fit(info, F_SUB[fi], clk_left - 24 - (fx + 160) - (walk_ic ? 34 : 0));
        int ibx, iby, ibw, ibh;
        it.get_text_bounds(0, 0, info.c_str(), F_SUB[fi], TextAlign::TOP_LEFT, &ibx, &iby, &ibw, &ibh);
        info_left = clk_left - 24 - ibw;
        it.print(clk_left - 24, fb, F_SUB[fi], infoc, TextAlign::BASELINE_RIGHT, info.c_str());
        if (walk_ic) {
          // a walking figure, 28 px tall, standing on the text baseline
          const int wx = info_left - 20, wt = fb - 28;
          auto thick = [&](int x0, int y0, int x1, int y1) {
            for (int d = -1; d <= 1; d++) it.line(x0 + d, y0, x1 + d, y1, infoc);
          };
          it.filled_circle(wx + 3, wt + 4, 4, infoc);          // head
          thick(wx + 2, wt + 10, wx, wt + 19);                 // body
          thick(wx + 1, wt + 12, wx - 6, wt + 17);             // back arm
          thick(wx + 2, wt + 12, wx + 8, wt + 16);             // front arm
          thick(wx, wt + 19, wx - 6, wt + 28);                 // back leg
          thick(wx, wt + 19, wx + 4, wt + 23);                 // front leg, bent at the knee
          thick(wx + 4, wt + 23, wx + 6, wt + 28);
          info_left -= 34;
        }
      }
      // station messages: every few minutes they scroll once across the footer, in place of the station name
      bool mscroll = false;
      {
        static uint32_t ms_t0 = 0, ms_last = 0;
        const int msi = id(msg_scroll).active_index().value_or(3);
        const uint32_t every = msi == 2 ? 120000UL : (msi == 3 ? 300000UL : 600000UL);
        const int mx0 = fx, mx1 = info_left - 20;
        if (msi >= 2 && id(msg_n) > 0 && id(scroll_enabled).state && !detail && !switching && mx1 - mx0 > 80) {
          if (ms_t0 == 0 && (ms_last == 0 || millis() - ms_last > every)) ms_t0 = millis();
          if (ms_t0 != 0) {
            // one message per pass, taking turns; long ones are cut at about 200 characters (tap the i for the rest)
            static int ms_idx = 0;
            std::vector<std::string> ml;
            {
              std::string cur;
              for (char ch : id(msg_text)) {
                if (ch == '\n') { if (cur.find_first_not_of(' ') != std::string::npos) ml.push_back(cur); cur.clear(); }
                else cur += ch;
              }
              if (cur.find_first_not_of(' ') != std::string::npos) ml.push_back(cur);
            }
            std::string mt = ml.empty() ? std::string("") : ml[ms_idx % ml.size()];
            if (mt.size() > 200) {
              size_t cut = mt.rfind(' ', 200);
              mt = mt.substr(0, cut == std::string::npos ? 200 : cut) + "... (tap the i to read on)";
            }
            int mbx, mby, mw, mbh;
            it.get_text_bounds(0, 0, mt.c_str(), F_SUB[fi], TextAlign::TOP_LEFT, &mbx, &mby, &mw, &mbh);
            const int msp = std::max(60, sp * 2);                    // a little brisker than the calling points
            const int off = (int) ((uint64_t) (millis() - ms_t0) * msp / 1000);
            if (mt.empty() || off > (mx1 - mx0) + 40 + mw) { ms_t0 = 0; ms_last = millis(); ms_idx++; }
            else {
              mscroll = true;
              const int x = mx1 - off;
              it.start_clipping(mx0, fb - 40, mx1, fb + 12);
              it.filled_circle(x + 14, fb - 11, 14, orange);                   // an orange "i" leads the message
              it.printf(x + 14, fb - 11, F_SUB[fi], bg_col, TextAlign::CENTER, "i");
              it.print(x + 40, fb, F_SUB[fi], orange, TextAlign::BASELINE_LEFT, mt.c_str());   // orange, like the i
              it.end_clipping();
            }
          }
        } else ms_t0 = 0;
      }
      if (!mscroll) {
        fit(foot, F_SUB[fi], info_left - 20 - fx);
        it.print(fx, fb, F_SUB[fi], footc, TextAlign::BASELINE_LEFT, foot.c_str());
      }
      }();
      // the frame is copied to the screen as soon as this returns: start it on a vsync, so the copy runs just
      // behind the panel's scan instead of across it
      static SemaphoreHandle_t vs = nullptr;
      if (vs == nullptr) {
        vs = xSemaphoreCreateBinary();
        struct VsH : public mipi_rgb::MipiRgb {
          static esp_lcd_panel_handle_t get(mipi_rgb::MipiRgb *d) { return d->*(&VsH::handle_); }
        };
        esp_lcd_rgb_panel_event_callbacks_t cbs = {};
        cbs.on_vsync = [](esp_lcd_panel_handle_t, const esp_lcd_rgb_panel_event_data_t *, void *ctx) -> bool {
          BaseType_t woken = pdFALSE;
          xSemaphoreGiveFromISR((SemaphoreHandle_t) ctx, &woken);
          return woken == pdTRUE;
        };
        if (esp_lcd_rgb_panel_register_event_callbacks(VsH::get(id(main_display)), &cbs, vs) != ESP_OK) vs = (SemaphoreHandle_t) 1;
      }
      if (vs != (SemaphoreHandle_t) 1) {
        xSemaphoreTake(vs, 0);                        // forget an old one
        xSemaphoreTake(vs, pdMS_TO_TICKS(45));        // a frame is about 32 ms
      }

qr_code:
  - id: qr_help              # setup screens: a link to the step in the setup guide (changed as the board goes through setup)
    value: "https://grimmnorth.github.io/departure-board/"

image:
  # Custom logo: light pixels are drawn in the theme colour, dark/transparent ones are left out.
  - platform: online_image
    id: custom_logo
    url: "http://homeassistant.local:8123/local/departure-board-logo.png"   # replaced by the logo image setting
    format: PNG
    type: BINARY
    transparency: chroma_key
    resize: 56x35
    buffer_size: 16384
    on_download_finished:
      - lambda: 'id(logo_ok) = true;'
    on_error:
      - lambda: 'id(logo_ok) = false;'
  # Custom logo for TfL (Tube / DLR) stations, set in the "TfL board logo image" setting
  - platform: online_image
    id: custom_logo_tfl
    url: "http://homeassistant.local:8123/local/departure-board-tfl-logo.png"   # replaced by the TfL logo image setting
    format: PNG
    type: RGB565          # read in colour, drawn in the footer colour (see the logo drawing)
    transparency: chroma_key
    resize: 56x35
    buffer_size: 16384
    on_download_finished:
      - lambda: |-
          // an all-light logo (white on transparent) is drawn whole; a coloured one has its light parts cut out
          auto *lg = id(custom_logo_tfl);
          int dark = 0, light = 0;
          for (int py = 0; py < lg->get_height(); py++)
            for (int px = 0; px < lg->get_width(); px++) {
              const Color c = lg->get_pixel(px, py);
              if (c.w < 128) continue;
              if ((c.r * 30 + c.g * 59 + c.b * 11) / 100 > 190) light++; else dark++;
            }
          id(logo_tfl_light) = dark * 10 < light;      // almost no dark pixels
          id(logo_tfl_ok) = true;
    on_error:
      - lambda: 'id(logo_tfl_ok) = false;'
