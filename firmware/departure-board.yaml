number:
  - platform: template
    name: "Departure board trains shown"
    id: train_count
    min_value: 3
    max_value: 5
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    name: "Departure board night brightness"
    id: night_level
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 20
  - platform: template
    name: "Departure board idle dim after"
    id: idle_minutes
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = never dim when idle
  - platform: template
    name: "Departure board idle brightness"
    id: idle_level
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 30
  - platform: template
    name: "Departure board departed grace"
    id: departed_grace
    min_value: 1
    max_value: 5
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 1          # minutes a train stays listed after its time
  - platform: template
    name: "Departure board clock screen after"
    id: clock_after
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = off. After this long without a touch, show the big clock screen
  - platform: template
    name: "Departure board walking time"
    id: walk_minutes
    min_value: 0
    max_value: 30
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 0          # 0 = off. Trains sooner than this are greyed out

datetime:
  - platform: template
    name: "Departure board night starts"
    id: night_start
    type: time
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
  - platform: template
    name: "Departure board night ends"
    id: night_end
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"

switch:
  - platform: template
    name: "Departure board night dimming"
    id: night_dimming
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Departure board night screen off"
    id: night_screen_off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # on = screen goes fully off at night; tap to wake for a minute
  - platform: template
    name: "Departure board countdown"
    id: countdown_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # on = "Due" / "5 min" instead of "On time" / expected time
  - platform: template
    name: "Departure board large text"
    id: text_large
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # large text shows at most 4 trains
  - platform: template
    name: "Departure board scrolling text"
    id: scroll_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON    # off = long lines are shortened with ...
  - platform: template
    name: "Departure board clock seconds"
    id: show_seconds
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Departure board 12 hour clock"
    id: clock_12h
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Departure board hide cancelled"
    id: hide_cancelled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Departure board show platform"
    id: show_platform
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Departure board disruption banner"
    id: disruption_banner
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Departure board focus mode"
    id: focus_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # on = one big view of just the next train
  - platform: template
    name: "Departure board show logo"
    id: show_logo
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Departure board demo mode"
    id: demo_mode
    optimistic: true
    restore_mode: ALWAYS_OFF   # shows a fake delayed and cancelled train, for testing colours

text:
  - platform: template
    name: "Departure board destination filter"
    id: dest_filter
    mode: text
    min_length: 0
    max_length: 40
    optimistic: true
    restore_value: true
    initial_value: ""     # e.g. "Hull" = only trains calling at Hull
  - platform: template
    name: "Departure board favourite stop"
    id: fav_stop
    mode: text
    min_length: 0
    max_length: 40
    optimistic: true
    restore_value: true
    initial_value: ""     # a stop name to highlight on the board, e.g. "Hull"
  - platform: template
    name: "Departure board favourite trains"
    id: fav_times
    mode: text
    min_length: 0
    max_length: 80
    optimistic: true
    restore_value: true
    initial_value: ""     # departure times to underline, e.g. "07:42, 08:15"

select:
  - platform: template
    name: "Departure board update channel"
    id: update_channel
    optimistic: true
    restore_value: true
    initial_option: "Stable"
    options: ["Stable", "Beta"]
    entity_category: config
    on_value:
      - lambda: |-
          id(fw_update).set_source_url(x == "Beta" ? "${update_url_beta}" : "${update_url}");
      - if:
          condition:
            lambda: 'return millis() > 60000;'   # changed by hand, not restored at boot
          then:
            - component.update: fw_update
  - platform: template
    name: "Departure board theme"
    id: theme_select
    optimistic: true
    restore_value: true
    initial_option: "Classic amber"
    options: ["Classic amber", "White LED", "Modern LCD", "Retro green", "High contrast", "Daylight"]
    on_value:
      - script.execute: apply_theme
  - platform: template
    name: "Departure board station"
    id: station_select
    optimistic: true
    restore_value: true
    initial_option: "Station"
    options: ["Station"]
  - platform: template
    name: "Departure board scroll speed"
    id: scroll_speed
    optimistic: true
    restore_value: true
    initial_option: "Medium"
    options: ["Slow", "Medium", "Fast"]
  - platform: template
    name: "Departure board font"
    id: font_select
    optimistic: true
    restore_value: true
    initial_option: "Doto"
    options: ["Doto", "DotGothic", "VT323", "B612 Mono"]

