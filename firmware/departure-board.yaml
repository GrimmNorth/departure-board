            it.end_clipping();
          }
          ink_y += hs + gap;
        }
        if (has_pl) {
          const int ytop = ink_y - sT;
          std::string sep = (!pl.empty() && !op.empty()) ? "   " : "";
          fit(op, fs2, 760 - width(pl + sep, fs2));
          const int wp = width(pl + sep, fs2);
          const int x0 = 400 - (wp + width(op, fs2)) / 2;
          if (!pl.empty()) it.printf(x0, ytop, fs2, changed ? orange : amber, TextAlign::TOP_LEFT, "%s", pl.c_str());
          if (!op.empty()) it.printf(x0 + wp, ytop, fs2, amber, TextAlign::TOP_LEFT, "%s", op.c_str());
        }

        // the 2nd and 3rd trains, on a band above the footer
        if (t2 != nullptr) {
          const FocusTrain *nx[2] = {t2, t3};
          const char *ords[2] = {"2nd ", "3rd "};
          const std::string sep = "   ";
          const int ws = (t3 != nullptr) ? width(sep, fs2) : 0;
          std::string head[2], dst[2];
          int wo[2] = {0, 0}, wh[2] = {0, 0}, wd[2] = {0, 0};
          int fixed = ws;
          for (int k = 0; k < 2; k++) {
            if (nx[k] == nullptr) continue;
            head[k] = nx[k]->sched + " ";
            dst[k] = departure::destination(nx[k]->calls, 40);
            wo[k] = width(ords[k], fs2);
            wh[k] = width(head[k], fs2);
            wd[k] = width(dst[k], fs2);
            fixed += wo[k] + wh[k];
          }
          // too long with the "2nd" / "3rd" labels: leave them out
          if (fixed + wd[0] + wd[1] > 760) for (int k = 0; k < 2; k++) { fixed -= wo[k]; wo[k] = 0; }
          // share the room: a short destination leaves the rest for a long one
          const int avail = 760 - fixed;
          int cap[2] = {avail, 0};
          if (t3 != nullptr) {
            if (wd[0] + wd[1] <= avail) { cap[0] = wd[0]; cap[1] = wd[1]; }
            else if (wd[0] <= avail / 2) { cap[0] = wd[0]; cap[1] = avail - wd[0]; }
            else if (wd[1] <= avail / 2) { cap[1] = wd[1]; cap[0] = avail - wd[1]; }
            else { cap[0] = avail / 2; cap[1] = avail - avail / 2; }
          }
          int w = ws;
          for (int k = 0; k < 2; k++) {
            if (nx[k] == nullptr) continue;
            fit(dst[k], fs2, cap[k]);
            wd[k] = width(dst[k], fs2);
            w += wo[k] + wh[k] + wd[k];
          }
          band_at(fs2, strip_top);
          int x = 400 - w / 2;
          for (int k = 0; k < 2; k++) {
            if (nx[k] == nullptr) continue;
            if (k == 1) x += ws;
            if (wo[k] > 0) it.printf(x, strip_top, fs2, grey, TextAlign::TOP_LEFT, "%s", ords[k]);
            x += wo[k];
            const Color c = nx[k]->cancelled ? red : amber;
            it.printf(x, strip_top, fs2, c, TextAlign::TOP_LEFT, "%s", head[k].c_str());
            x += wh[k];
            it.printf(x, strip_top, fs2, c, TextAlign::TOP_LEFT, "%s", dst[k].c_str());
            x += wd[k];
          }
        }
      };
      auto draw_detail = [&](std::string sched, std::string exp, std::string plat, std::string pchg, std::string calls,
                             std::string reason, std::string oper, std::string delaym, std::string stops,
                             std::string sarr, std::string earr, std::string pprev, bool cancelled, bool late) {

        // ---------- detail page: laid out like a departure row, on the board's bands ----------
        font::Font *fh = F_ROW[fi], *fd = F_SUB[fi];
        int hT, hB, dT, dB;
        ink_of(fh, hT, hB);
        ink_of(fd, dT, dB);
        const int LHB = dB - dT + 8;                         // one band
        const Color BAND = band_col;                 // follows the theme
        auto bandline = [&](int y, font::Font *f) {
          int t, b;
          ink_of(f, t, b);
          it.filled_rectangle(10, y + t - 4, 780, b - t + 8, BAND);
        };
        int bx, by, bw, bh;
        const bool bus = plat.find("Bus") != std::string::npos || plat.find("bus") != std::string::npos;

        // line 1: time, destination, platform, status - the same columns as the list
        int y = 6 + HDR - hT + 6;                    // below the column headings, when they are on
        bandline(y, fh);
        Color sc = cancelled ? red : (late ? orange : green);
        std::string st = cancelled ? std::string("Cancelled") : ((late && departure::valid(exp)) ? exp : (late ? std::string("Delayed") : std::string("On time")));
        // Tube: the line and direction, and where the train is now ("At Platform", "Between X and Y")
        std::string tline = oper, tloc;
        if (id(src_tfl)) {
          const size_t a = oper.find(" - ");
          const size_t b = a == std::string::npos ? std::string::npos : oper.find(" - ", a + 3);
          if (b != std::string::npos) { tline = oper.substr(0, b); tloc = oper.substr(b + 3); }
          if (!cancelled) {
            const std::string sn = id(station_ts).state;
            const bool arr = tloc == "At Platform" || (!sn.empty() && (tloc.rfind("At " + sn, 0) == 0 || tloc.rfind("Approaching " + sn, 0) == 0));
            const int tm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
            st = arr ? std::string("Arriving") : (tm <= 1 ? std::string("Due") : to_string(tm) + " min");
            sc = green;
          }
        }
        std::string pl = cancelled ? std::string("") : (bus ? std::string("Bus") : (departure::valid(plat) ? plat : std::string("")));
        int plw = 0;
        if (!pl.empty()) it.get_text_bounds(0, 0, pl.c_str(), fh, TextAlign::TOP_LEFT, &bx, &by, &plw, &bh);
        std::string dd = departure::destination(calls, 60);
        fit(dd, fh, (pl.empty() ? 784 - 140 : 610 - plw - 16) - 130);
        it.printf(18, y, fh, amber, "%s", sched.c_str());
        it.printf(130, y, fh, amber, "%s", dd.c_str());
        if (!pl.empty()) it.printf(610, y, fh, departure::truthy(pchg) ? orange : amber, TextAlign::TOP_RIGHT, "%s", pl.c_str());
        it.printf(784, y, fh, sc, TextAlign::TOP_RIGHT, "%s", st.c_str());
        if (id(src_tfl) && id(tfl_colours).state && pprev.size() == 7 && pprev[0] == '#') {
          int cr = strtol(pprev.substr(1, 2).c_str(), nullptr, 16), cg = strtol(pprev.substr(3, 2).c_str(), nullptr, 16), cb2 = strtol(pprev.substr(5, 2).c_str(), nullptr, 16);
          warm_rgb(cr, cg, cb2);
          const int mx = std::max(cr, std::max(cg, cb2));
          if (mx == 0) { cr = cg = cb2 = 200; } else if (mx < 150) { cr = cr * 150 / mx; cg = cg * 150 / mx; cb2 = cb2 * 150 / mx; }
          it.filled_rectangle(10, y + hT - 4, 5, (hB - hT + 8) * 2 + 3, Color(cr, cg, cb2));
        }
        y += (hB - hT + 8) + 3;
        if (id(src_tfl)) {
          auto wrap2 = [&](const std::string &txt, int x, int &yy, Color c) {      // up to two lines
            std::string rem = txt;
            for (int ln = 0; ln < 2 && !rem.empty(); ln++) {
              std::string line;
              size_t p = 0, next = std::string::npos;
              while (true) {
                size_t e = rem.find(' ', p);
                if (e == std::string::npos) e = rem.size();
                std::string cand = rem.substr(0, e);
                it.get_text_bounds(0, 0, cand.c_str(), fd, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
                if (bw > 784 - x && !line.empty()) break;
                line = cand; next = e + 1;
                if (e >= rem.size()) break;
                p = e + 1;
              }
              rem = (next < rem.size()) ? rem.substr(next) : "";
              if (ln == 1 && !rem.empty()) line += " ...";
              fit(line, fd, 784 - x);
              it.printf(x, yy, fd, c, "%s", line.c_str());
              yy += LHB;
            }
          };
          // line 2: the line and direction
          bandline(y, fd);
          std::string tl = tline;
          fit(tl, fd, 784 - 130);
          it.printf(130, y, fd, sub_col, "%s", tl.c_str());
          y += LHB + 14;
          // where the train is now
          if (!tloc.empty() && !cancelled) {
            it.printf(18, y, fd, grey, "Now");
            wrap2(tloc, 130, y, amber);
            y += 10;
          }
          // the next trains from the same platform
          if (departure::valid(plat)) {
            const std::string *S[10] = {&id(stn_t1_scheduled_departure).state, &id(stn_t2_scheduled_departure).state, &id(stn_t3_scheduled_departure).state, &id(stn_t4_scheduled_departure).state, &id(stn_t5_scheduled_departure).state, &id(stn_t6_scheduled_departure).state, &id(stn_t7_scheduled_departure).state, &id(stn_t8_scheduled_departure).state, &id(stn_t9_scheduled_departure).state, &id(stn_t10_scheduled_departure).state};
            const std::string *E[10] = {&id(stn_t1_expected_departure).state, &id(stn_t2_expected_departure).state, &id(stn_t3_expected_departure).state, &id(stn_t4_expected_departure).state, &id(stn_t5_expected_departure).state, &id(stn_t6_expected_departure).state, &id(stn_t7_expected_departure).state, &id(stn_t8_expected_departure).state, &id(stn_t9_expected_departure).state, &id(stn_t10_expected_departure).state};
            const std::string *P[10] = {&id(stn_t1_platform).state, &id(stn_t2_platform).state, &id(stn_t3_platform).state, &id(stn_t4_platform).state, &id(stn_t5_platform).state, &id(stn_t6_platform).state, &id(stn_t7_platform).state, &id(stn_t8_platform).state, &id(stn_t9_platform).state, &id(stn_t10_platform).state};
            const std::string *C[10] = {&id(stn_t1_calling_points).state, &id(stn_t2_calling_points).state, &id(stn_t3_calling_points).state, &id(stn_t4_calling_points).state, &id(stn_t5_calling_points).state, &id(stn_t6_calling_points).state, &id(stn_t7_calling_points).state, &id(stn_t8_calling_points).state, &id(stn_t9_calling_points).state, &id(stn_t10_calling_points).state};
            int shown = 0;
            bool past_this = false;
            for (int i = 0; i < 10 && shown < 2; i++) {
              if (!departure::valid(*S[i]) || *P[i] != plat) continue;
              if (!past_this) { if (*S[i] == sched && *C[i] == calls) past_this = true; continue; }
              if (departure::departed(E[i]->empty() ? *S[i] : *E[i], nowmin, grace)) continue;
              if (shown == 0) { it.printf(18, y, fd, grey, "Then from platform %s", plat.c_str()); y += LHB; }
              const int tm = departure::minutes_until(E[i]->empty() ? *S[i] : *E[i], nowmin);
              char cd[16];
              if (tm <= 1) snprintf(cd, sizeof(cd), "Due"); else snprintf(cd, sizeof(cd), "%d min", tm);
              int cdw;
              it.get_text_bounds(0, 0, cd, fd, TextAlign::TOP_LEFT, &bx, &by, &cdw, &bh);
              std::string dn = departure::destination(*C[i], 60);
              fit(dn, fd, 784 - cdw - 24 - 130);
              it.printf(18, y, fd, amber, "%s", S[i]->c_str());
              it.printf(130, y, fd, amber, "%s", dn.c_str());
              it.printf(784, y, fd, green, TextAlign::TOP_RIGHT, "%s", cd);
              y += LHB;
              shown++;
            }
            if (shown) y += 10;
          }
          // the line's status (from the London Underground integration, sent as messages)
          std::string lname = tline.substr(0, tline.find(" - "));
          std::string key = lname.substr(0, lname.find(' '));
          std::string found;
          {
            std::string cur;
            for (char ch : id(msg_text) + "\n") {
              if (ch == '\n') { if (!key.empty() && cur.find(key) != std::string::npos) { found = cur; break; } cur.clear(); }
              else cur += ch;
            }
          }
          if (y < 400 && !lname.empty()) {
            if (!found.empty()) wrap2(found, 18, y, orange);
            else it.printf(18, y, fd, green, "%s: Good service", lname.c_str());
          }
          return;
        }

        // line 2: operator, countdown on the right
        char cb[24] = "";
        if (!cancelled) {
          int dm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
          if (dm >= 0) {
            if (dm <= 1) snprintf(cb, sizeof(cb), "Due");
            else if (dm < 60) snprintf(cb, sizeof(cb), "in %d min", dm);
            else snprintf(cb, sizeof(cb), "in %dh %02dm", dm / 60, dm % 60);
          }
        }
        int cw = 0;
        if (cb[0]) it.get_text_bounds(0, 0, cb, fd, TextAlign::TOP_LEFT, &bx, &by, &cw, &bh);
        bandline(y, fd);
        std::string op = departure::valid(oper) ? oper : std::string("");
        if (departure::truthy(pchg) && departure::valid(pprev) && !bus) op += (op.empty() ? "" : "  -  ") + std::string("was platform ") + pprev;
        fit(op, fd, 784 - (cw ? cw + 24 : 0) - 130);
        it.printf(130, y, fd, amber, "%s", op.c_str());
        if (cb[0]) it.printf(784, y, fd, late ? orange : green, TextAlign::TOP_RIGHT, "%s", cb);
        y += LHB + 3;

        // line 3: replacement bus / delay / arrival
        if (delaym.size() > 2 && delaym.compare(delaym.size() - 2, 2, ".0") == 0) delaym.resize(delaym.size() - 2);
        std::string l3;
        Color l3c = amber;
        if (bus) l3 = "Replacement bus";
        if (cancelled) { l3 += (l3.empty() ? "" : "  -  ") + std::string("Cancelled"); l3c = red; }
        else {
          if (late && departure::valid(delaym) && delaym != "0") l3 += (l3.empty() ? "" : "  -  ") + delaym + " min late";
          if (departure::valid(sarr)) {
            bool latearr = departure::valid(earr) && earr != sarr;
            l3 += (l3.empty() ? "" : "  -  ") + std::string("Arrives ") + (latearr ? earr : sarr);
          }
        }
        if (!l3.empty()) {
          bandline(y, fd);
          fit(l3, fd, 784 - 130);
          it.printf(130, y, fd, l3c, "%s", l3.c_str());
          y += LHB + 3;
        }
        // delay or cancellation reason, wrapped onto up to two lines
        if (departure::valid(reason)) {
          std::string rem = reason;
          for (int ln = 0; ln < 2 && !rem.empty(); ln++) {
            std::string line;
            size_t p = 0, next = std::string::npos;
            while (p <= rem.size()) {
              size_t e = rem.find(' ', p);
              if (e == std::string::npos) e = rem.size();
              std::string cand = rem.substr(0, e);
              it.get_text_bounds(0, 0, cand.c_str(), fd, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
              if (bw > 784 - 130 && !line.empty()) break;
              line = cand;
              next = e + 1;
              if (e >= rem.size()) break;
              p = e + 1;
            }
            rem = (next != std::string::npos && next < rem.size()) ? rem.substr(next) : "";
            if (ln == 1 && !rem.empty()) line += " ...";
            fit(line, fd, 784 - 130);
            bandline(y, fd);
            it.printf(130, y, fd, amber, "%s", line.c_str());
            y += LHB + 3;
          }
        }

        // calling points: heading, then a route line in two columns, paged when long
        std::vector<std::pair<std::string, std::string>> stp;
        if (departure::valid(stops)) {
          size_t pos = 0;
          while (pos < stops.size()) {
            size_t e = stops.find(", ", pos);
            std::string item = stops.substr(pos, e == std::string::npos ? std::string::npos : e - pos);
            pos = (e == std::string::npos) ? stops.size() : e + 2;
            if (item.size() > 6 && item[item.size() - 6] == ' ') stp.push_back({item.substr(0, item.size() - 6), item.substr(item.size() - 5)});
            else stp.push_back({item, ""});
          }
        } else {
          for (auto &p : departure::points(calls)) stp.push_back({p, ""});
        }
        if (stp.empty()) return;
        y += 5;
        int rows = (414 - (y + LHB + dT - 4)) / (LHB + 3);
        if (rows < 1) rows = 1;
        const int per = rows * 2;
        const int npages = ((int) stp.size() + per - 1) / per;
        const int pg = npages > 1 ? (int) ((millis() / 8000) % npages) : 0;
        it.printf(18, y, fd, grey, id(src_tfl) ? "Going to" : "Calling at");
        if (npages > 1) it.printf(784, y, fd, grey, TextAlign::TOP_RIGHT, "%d of %d", pg + 1, npages);
        y += LHB;
        int tmw;
        it.get_text_bounds(0, 0, "00:00", fd, TextAlign::TOP_LEFT, &bx, &by, &tmw, &bh);
        const int first = pg * per;
        const int last_i = std::min((int) stp.size(), first + per);
        for (int r = 0; r < rows && first + r < last_i; r++) bandline(y + r * (LHB + 3), fd);
        for (int i = first; i < last_i; i++) {
          int k = i - first, col = k / rows, row = k % rows;
          int x0 = 18 + col * 392;
          int yy = y + row * (LHB + 3);
          int lx = x0 + tmw + 16;
          int my = yy + (dT + dB) / 2;
          bool is_last = (i == (int) stp.size() - 1);
          bool fav = !fstop.empty() && departure::ieq(stp[i].first, fstop);
          Color tc = fav ? hilite : amber;
          // the route line joins the stops; it carries on past the edge of a page when the route does
          if (row > 0 || i > 0) it.filled_rectangle(lx - 1, yy + dT - 4, 2, my - (yy + dT - 4), amber);
          if (!is_last) it.filled_rectangle(lx - 1, my, 2, (yy + dB + 4 + (row < rows - 1 ? 3 : 0)) - my, amber);
          it.filled_circle(lx, my, is_last ? 6 : 4, amber);
          if (!stp[i].second.empty())
            it.printf(x0 + tmw, yy, fd, fav ? hilite : (late ? orange : amber), TextAlign::TOP_RIGHT, "%s", stp[i].second.c_str());
          std::string nm = stp[i].first;
          fit(nm, fd, (last_i - first <= rows ? 784 : x0 + 383) - (lx + 18));
          it.printf(lx + 18, yy, fd, tc, "%s", nm.c_str());
        }
      };

      if (HDR > 0 && view == 0) {
        font::Font *fh = id(f_hdr_0);
        const Color hc = bg_col.r > 200 ? Color(26, 26, 26) : Color(255, 255, 255);   // white (dark on Daylight)
        const int hy = 5;                                                            // letters well clear of the line
        it.printf(TX, hy, fh, hc, "Time");
        // "Destination (all call at Leeds)" on a route or with the board's own "calling at" filter
        std::string dh = "Destination";
        if (!filt.empty()) dh += " (all call at " + filt + ")";
        else if (!id(route_to).empty()) dh += " (all call at " + id(route_to) + ")";
        fit(dh, fh, (id(show_platform).state ? PX - 60 : 784 - 70) - DX);
        it.printf(DX, hy, fh, hc, "%s", dh.c_str());
        if (id(show_platform).state) it.printf(PX, hy, fh, hc, TextAlign::TOP_RIGHT, "Plat");
        it.printf(784, hy, fh, hc, TextAlign::TOP_RIGHT, "Expected");
      }
      // ---- train 1 ----
      {
        std::string sched, exp, stat, plat, pchg, calls, dreason, creason, oper, delaym, stops, sarr, earr, pprev;
        switch (si) {
          case 0: sched = id(stn_t1_scheduled_departure).state; exp = id(stn_t1_expected_departure).state; stat = id(stn_t1_status).state; plat = id(stn_t1_platform).state; pchg = id(stn_t1_platform_changed).state; calls = id(stn_t1_calling_points).state; dreason = id(stn_t1_delay_reason).state; creason = id(stn_t1_cancellation_reason).state; oper = id(stn_t1_operator).state; delaym = id(stn_t1_delay_minutes).state; stops = id(stn_t1_stops).state; sarr = id(stn_t1_scheduled_arrival).state; earr = id(stn_t1_estimated_arrival).state; pprev = id(stn_t1_previous_platform).state; break;
        }
        std::string reason = (stat == "cancelled") ? creason : dreason;
        // Tube rows: "Jubilee - N/bound - Left West Hampstead" so where the train is fits
        std::string oper_s = oper;
        if (id(src_tfl)) {
          size_t lp = oper_s.find(" line - ");
          if (lp != std::string::npos) oper_s.erase(lp, 5);
          static const char *const DIRS[4][2] = {{"Northbound", "N/bound"}, {"Southbound", "S/bound"}, {"Eastbound", "E/bound"}, {"Westbound", "W/bound"}};
          for (auto &d : DIRS) { size_t dp = oper_s.find(d[0]); if (dp != std::string::npos) { oper_s.replace(dp, strlen(d[0]), d[1]); break; } }
        }
        bool cancelled = (stat == "cancelled");
        if (departure::valid(sched) && nowmin >= 0) {
          const std::string &tt = exp.size() >= 5 ? exp : sched;
          int dm = ((atoi(tt.substr(0, 2).c_str()) * 60 + atoi(tt.substr(3, 2).c_str()) - nowmin) % 1440 + 1440) % 1440;
          if (dm <= 720 || 1440 - dm <= 10) n_recent++;
        }
        if (departure::valid(sched) && !departure::departed(exp.empty() ? sched : exp, nowmin, grace)
            && departure::calls_at(calls, filt) && !(cancelled && id(hide_cancelled).state)) {
          std::string dest = departure::destination(calls, DMAX);
          bool late = (stat == "delayed");
          const int eidx = elig++;
          if (eidx < 10) id(elig_list)[eidx] = 1;
          const int tnum = 1;
          if (eidx < 10) cmp_tall_now[eidx] = (late || cancelled) && departure::valid(reason);
          {
            int lm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
            if (leave_mins < 0 && !cancelled && lm >= 0 && lm >= walk) leave_mins = lm - walk;
          }
          if (detail) {
            if (id(detail_train) == 1) {
              draw_detail(sched, exp, plat, pchg, calls, reason, oper, delaym, stops, sarr, earr, pprev, cancelled, late); dfound = true;
            }
          } else if (view != 0) {
            focus_add(1, sched, exp, plat, pchg, pprev, calls, oper, delaym, reason, cancelled, late);
          } else if ((lay == 2 ? (slot < 10 && eidx < 10 && cmp_y[eidx < 10 ? eidx : 0] != C_NONE) : slot < count) && on_page(eidx) && !switching) {
          id(slot_train)[slot] = 1;
          id(slot_ybot)[slot] = (lay == 2) ? cmp_bot[eidx] : 6 + HDR + (slot + 1) * H;
          int y = (lay == 2) ? cmp_y[eidx] : 6 + HDR + slot * H + pad;
