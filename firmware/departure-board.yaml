    internal: true
  - platform: template
    id: stn_t10_estimated_arrival
    internal: true
  - platform: template
    id: stn_t10_previous_platform
    internal: true
  - platform: template
    id: stn_t1_stops
    internal: true
  - platform: template
    id: stn_t2_stops
    internal: true
  - platform: template
    id: stn_t3_stops
    internal: true
  - platform: template
    id: stn_t4_stops
    internal: true
  - platform: template
    id: stn_t5_stops
    internal: true
  - platform: template
    id: stn_t6_stops
    internal: true
  - platform: template
    id: stn_t7_stops
    internal: true
  - platform: template
    id: stn_t8_stops
    internal: true
  - platform: template
    id: stn_t9_stops
    internal: true
  - platform: template
    id: stn_t10_stops
    internal: true
  - platform: wifi_info
    ip_address:
      id: wifi_ip_ts
      name: "Departure board IP"
      internal: true
    ssid:
      id: wifi_ssid_ts
      name: "Departure board SSID"
      internal: true
  - platform: version
    id: esphome_ver_ts
    name: "Departure board ESPHome version"
    hide_timestamp: true
    internal: true

sensor:
  - platform: wifi_signal
    id: wifi_rssi_s
    name: "Departure board Wi-Fi signal"
    update_interval: 30s
    entity_category: diagnostic
  - platform: uptime
    name: "Departure board uptime"
    entity_category: diagnostic
  - platform: debug
    free:
      id: heap_free
      name: "Departure board free memory"
      entity_category: diagnostic
    block:
      name: "Departure board largest free memory block"
      entity_category: diagnostic
  - platform: template
    name: "Departure board data age"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (id(data_ms_stn) == 0) return NAN;     // nothing received since start-up
      return (float) ((millis() - id(data_ms_stn)) / 60000);
  - platform: template
    id: leave_in_s
    name: "Departure board leave in"
    unit_of_measurement: "min"
    accuracy_decimals: 0

display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    dimensions:
      width: 800
      height: 480
    invert_colors: true      # both this and pclk_inverted are required
    color_order: RGB
    auto_clear_enabled: false
    update_interval: 250ms
    de_pin: GPIO41
    hsync_pin: GPIO39
    vsync_pin: GPIO40
    pclk_pin: GPIO0
    pclk_frequency: 15MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red: [GPIO14, GPIO21, GPIO47, GPIO48, GPIO45]
      green: [GPIO9, GPIO46, GPIO3, GPIO8, GPIO16, GPIO1]
      blue: [GPIO15, GPIO7, GPIO6, GPIO5, GPIO4]
    lambda: |-
      it.fill(bg_col);

      // boot splash
      if (millis() < 6000) {
        it.printf(400, 170, id(f_row_1), amber, TextAlign::CENTER, "UK Departure Board");
        it.printf(400, 225, id(f_sub_1), amber, TextAlign::CENTER, "Version %s", ESPHOME_PROJECT_VERSION);
        it.printf(400, 255, id(f_sub_1), amber, TextAlign::CENTER, "ESPHome %s", id(esphome_ver_ts).state.c_str());
        if (wifi::global_wifi_component->is_connected())
          it.printf(400, 280, id(f_sub_1), green, TextAlign::CENTER, "Wi-Fi connected");
        else
          it.printf(400, 280, id(f_sub_1), orange, TextAlign::CENTER, "Connecting to Wi-Fi...");
        return;
      }

      auto now = id(ha_time).now();
      bool tv = now.is_valid();
      int nowmin = tv ? now.hour * 60 + now.minute : -1;
      const char *THEME_NAMES[] = {"Classic", "White LED", "Modern LCD", "Retro green", "High contrast", "Daylight"};
      const char *FONT_NAMES[] = {"Doto", "DotGothic", "VT323", "B612 Mono"};
      std::string stn_name = id(station_ts).state.empty() ? std::string("Departures") : id(station_ts).state;
      const char *STATION_NAMES[] = {stn_name.c_str()};
      int si = id(station_select).active_index().value_or(0);
      uint32_t dms = 0;
      std::string disr;
      switch (si) {
        case 0: dms = id(data_ms_stn); disr = id(stn_status).state; break;
      }

      // ---------------- settings screen (tap the clock to open) ----------------
      if (id(ui_screen) == 1) {
        if (millis() - id(last_fresh) > 30000) {
          id(ui_screen) = 0;                    // close after 30 s without a touch
        } else {
          static const char *SPEEDN[3] = {"Slow", "Medium", "Fast"};
          int R = 0;
          auto lab = [&](int row, const char *s) {
            it.printf(20, 50 + row * 46 + 21, id(f_row_1), amber, TextAlign::CENTER_LEFT, "%s", s);
          };
          auto val = [&](int row, Color c, const char *s) {
            it.printf(776, 50 + row * 46 + 21, id(f_row_1), c, TextAlign::CENTER_RIGHT, "%s", s);
          };
          auto pm = [&](int row, const char *v) {
            int ry = 50 + row * 46;
            it.rectangle(510, ry, 80, 42, amber);
            it.printf(550, ry + 21, id(f_row_1), amber, TextAlign::CENTER, "-");
            it.rectangle(700, ry, 80, 42, amber);
            it.printf(740, ry + 21, id(f_row_1), amber, TextAlign::CENTER, "+");
            it.printf(645, ry + 21, id(f_row_1), amber, TextAlign::CENTER, "%s", v);
          };
          auto onoff = [&](int row, bool on) { val(row, on ? green : red, on ? "On" : "Off"); };
          char buf[40];
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          const bool api_ok = api::global_api_server->is_connected();
          static const char *PAGE_NAMES[5] = {"Display", "Trains", "Extras", "Screen", "Status"};
          it.printf(20, 25, id(f_row_1), amber, TextAlign::CENTER_LEFT, "Settings %d/5  %s", id(settings_page) + 1, PAGE_NAMES[id(settings_page)]);
          if (id(settings_page) == 0) {
            R = 0; lab(R, "Theme"); val(R, amber, THEME_NAMES[id(theme_select).active_index().value_or(0)]);
            R = 1; lab(R, "Trains shown"); snprintf(buf, sizeof(buf), "%d", (int) id(train_count).state); pm(R, buf);
            R = 2; lab(R, "Text size"); val(R, amber, id(text_large).state ? "Large" : "Normal");
            R = 3; lab(R, "Font"); val(R, amber, FONT_NAMES[id(font_select).active_index().value_or(0)]);
            R = 4; lab(R, "Scroll speed"); val(R, amber, SPEEDN[id(scroll_speed).active_index().value_or(1)]);
            R = 5; lab(R, "Scrolling text"); onoff(R, id(scroll_enabled).state);
            R = 6; lab(R, "Clock seconds"); onoff(R, id(show_seconds).state);
            R = 7; lab(R, "12 hour clock"); onoff(R, id(clock_12h).state);
          }
          else if (id(settings_page) == 1) {
            R = 0; lab(R, "Countdown"); onoff(R, id(countdown_mode).state);
            R = 1; lab(R, "Calling at"); { std::string f = id(dest_filter).state; val(R, f.empty() ? red : green, f.empty() ? "Off" : f.c_str()); }
            R = 2; lab(R, "Hide cancelled"); onoff(R, id(hide_cancelled).state);
            R = 3; lab(R, "Show platform"); onoff(R, id(show_platform).state);
            R = 4; lab(R, "Departed grace"); snprintf(buf, sizeof(buf), "%d min", (int) id(departed_grace).state); pm(R, buf);
            R = 5; lab(R, "Walking time"); if (id(walk_minutes).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(walk_minutes).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
          }
          else if (id(settings_page) == 2) {
            R = 0; lab(R, "Highlight stop"); { std::string f = id(fav_stop).state; val(R, f.empty() ? red : green, f.empty() ? "Off" : f.c_str()); }
            R = 1; lab(R, "Disruption banner"); onoff(R, id(disruption_banner).state);
            R = 2; lab(R, "Show logo"); onoff(R, id(show_logo).state);
            R = 3; lab(R, "Focus mode"); onoff(R, id(focus_mode).state);
            R = 4; lab(R, "Clock screen after"); if (id(clock_after).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(clock_after).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
          }
          else if (id(settings_page) == 3) {
            R = 0; lab(R, "Brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) (id(backlight).current_values.get_brightness() * 100 + 0.5f)); pm(R, buf);
            R = 1; lab(R, "Night dimming"); onoff(R, id(night_dimming).state);
            R = 2; lab(R, "Night brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) id(night_level).state); pm(R, buf);
            R = 3; lab(R, "Night starts"); snprintf(buf, sizeof(buf), "%02d:%02d", id(night_start).hour, id(night_start).minute); pm(R, buf);
            R = 4; lab(R, "Night ends"); snprintf(buf, sizeof(buf), "%02d:%02d", id(night_end).hour, id(night_end).minute); pm(R, buf);
            R = 5; lab(R, "Night screen off"); onoff(R, id(night_screen_off).state);
            R = 6; lab(R, "Idle dim after"); if (id(idle_minutes).state > 0) snprintf(buf, sizeof(buf), "%d min", (int) id(idle_minutes).state); else snprintf(buf, sizeof(buf), "Off"); pm(R, buf);
            R = 7; lab(R, "Idle brightness"); snprintf(buf, sizeof(buf), "%d%%", (int) id(idle_level).state); pm(R, buf);
          }
          else if (id(settings_page) == 4) {
            R = 0; lab(R, "Wi-Fi"); if (wifi_ok) { std::string s = id(wifi_ssid_ts).state; if (s.size() > 14) s.resize(14); snprintf(buf, sizeof(buf), "%s %ddBm", s.c_str(), (int) id(wifi_rssi_s).state); val(R, green, buf); } else val(R, red, "Offline");
            R = 1; lab(R, "IP address"); val(R, amber, id(wifi_ip_ts).state.c_str());
            R = 2; lab(R, "Home Assistant"); val(R, api_ok ? green : red, api_ok ? "Connected" : "Offline");
            R = 3; lab(R, "Data age"); if (dms == 0) val(R, amber, "No data yet"); else { unsigned am = (millis() - dms) / 60000; snprintf(buf, sizeof(buf), "%u min", am); val(R, am >= 15 ? red : green, buf); }
            R = 4; lab(R, "Uptime"); { uint32_t u = millis() / 1000; snprintf(buf, sizeof(buf), "%ud %uh %um", (unsigned) (u / 86400), (unsigned) (u % 86400 / 3600), (unsigned) (u % 3600 / 60)); val(R, amber, buf); }
            R = 5; lab(R, "ESPHome"); val(R, amber, id(esphome_ver_ts).state.c_str());
            R = 6; lab(R, "Firmware"); snprintf(buf, sizeof(buf), "%s %s", ESPHOME_PROJECT_VERSION, __DATE__); val(R, amber, buf);
            R = 7; lab(R, "Free memory"); if (id(heap_free).has_state()) { snprintf(buf, sizeof(buf), "%d KB", (int) (id(heap_free).state / 1024)); val(R, amber, buf); } else val(R, amber, "...");
          }
          it.rectangle(60, 426, 300, 46, amber);
          it.printf(210, 449, id(f_row_1), amber, TextAlign::CENTER, "Next >");
          it.rectangle(440, 426, 300, 46, amber);
          it.printf(590, 449, id(f_row_1), amber, TextAlign::CENTER, "Close");
          return;
        }
      }

      // ---------------- departures screen ----------------
      const bool L = id(text_large).state;
      int count = (int) id(train_count).state;
      if (count < 3) count = 3;
      if (count > 5) count = 5;
      if (L && count > 4) count = 4;            // large text only has room for 4 trains
      const int H = 406 / count;                // pixel height of one train (two lines)
      const int fi = id(font_select).active_index().value_or(0);
      font::Font *F_ROW[] = {id(f_row_0), id(f_row_1), id(f_row_2), id(f_row_3)};
      font::Font *F_SUB[] = {id(f_sub_0), id(f_sub_1), id(f_sub_2), id(f_sub_3)};
      font::Font *F_CLK[] = {id(f_clk_0), id(f_clk_1), id(f_clk_2), id(f_clk_3)};
      font::Font *F_ROWL[] = {id(f_row_l_0), id(f_row_l_1), id(f_row_l_2), id(f_row_l_3)};
      font::Font *F_SUBL[] = {id(f_sub_l_0), id(f_sub_l_1), id(f_sub_l_2), id(f_sub_l_3)};
      font::Font *F_BIG[] = {id(f_big_0), id(f_big_1), id(f_big_2), id(f_big_3)};
      auto fr = L ? F_ROWL[fi] : F_ROW[fi];
      auto fs = L ? F_SUBL[fi] : F_SUB[fi];
      const int TX = 18;
      const int DX = L ? 175 : 130;             // destination / sub-line x
      const int PX = L ? 540 : 610;             // platform column (right edge)
      const int DMAX = L ? 12 : 21;             // destination max characters
      const int SUBOFF = L ? 50 : 37;           // sub-line offset below the main line
      const int SUBH = L ? 38 : 32;
      const int SW = 784 - DX;                  // sub-line width
      int pad = (H - (SUBOFF + SUBH)) / 2;
      if (pad < 0) pad = 0;
      const int speeds[3] = {20, 30, 50};       // scroll px per second
      const int sp = speeds[id(scroll_speed).active_index().value_or(1)];
      const std::string filt = id(dest_filter).state;
      const std::string favs = id(fav_times).state;
      const std::string fstop = id(fav_stop).state;       // favourite stop to highlight
      const int walk = (int) id(walk_minutes).state;
      const int grace = (int) id(departed_grace).state;
      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      const bool api_ok = api::global_api_server->is_connected();
      int leave_mins = -1;
      int slot = 0;
      if (id(ui_screen) == 2 && millis() - id(last_fresh) > 30000) id(ui_screen) = 0;   // detail view times out
      const bool detail = (id(ui_screen) == 2);
      // view: 0 = list, 1 = focus on the next train, 2 = clock screen (after idle time)
      const bool clock_idle = id(clock_after).state > 0 && (millis() - id(last_touch_any)) > (uint32_t) (id(clock_after).state * 60000.0f);
      const int view = detail ? 0 : (clock_idle ? 2 : (id(focus_mode).state ? 1 : 0));
      bool dfound = false;
      if (!detail) for (int i = 0; i < 6; i++) id(slot_train)[i] = 0;

      // shorten s with "..." until it fits in maxw pixels
      auto fit = [&](std::string &s, font::Font *f, int maxw) {
        if (maxw < 20) { s.clear(); return; }
        int fbx, fby, fbw, fbh;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &fbx, &fby, &fbw, &fbh);
        if (fbw <= maxw) return;
        while (!s.empty()) {
          s.pop_back();
          while (!s.empty() && s.back() == ' ') s.pop_back();
          std::string t = s + "...";
          it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &fbx, &fby, &fbw, &fbh);
          if (fbw <= maxw) { s = t; return; }
        }
      };
      auto draw_bigclock = [&]() {
        if (!tv) return;
        int hh = now.hour;
        const char *ap = "";
        if (id(clock_12h).state) { ap = hh >= 12 ? "pm" : "am"; hh = hh % 12; if (hh == 0) hh = 12; }
        char cb[16];
        snprintf(cb, sizeof(cb), "%02d:%02d%s", hh, now.minute, ap);
        it.printf(400, 105, F_BIG[fi], amber, TextAlign::CENTER, "%s", cb);
        std::string ds = now.strftime("%A %d %B");
        it.printf(400, 215, F_ROWL[fi], amber, TextAlign::CENTER, "%s", ds.c_str());
      };
      auto draw_next = [&](int vw, std::string sched, std::string exp, std::string plat, std::string calls,
                           std::string oper, std::string delaym, bool cancelled, bool late) {
        std::string dest = departure::destination(calls, 24);
        int mins = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
        Color sc = cancelled ? red : (late ? orange : green);
        if (delaym.size() > 2 && delaym.compare(delaym.size() - 2, 2, ".0") == 0) delaym.resize(delaym.size() - 2);
        std::string st = cancelled ? "Cancelled" : (late ? "Delayed" : "On time");
        if (late && departure::valid(delaym) && delaym != "0") st += " " + delaym + " min";
        std::string pl = (departure::valid(plat) && !cancelled) ? "Platform " + plat : "";
        if (vw == 2) {
          draw_bigclock();
          it.printf(400, 290, F_ROWL[fi], amber, TextAlign::CENTER, "%s  %s", sched.c_str(), dest.c_str());
          std::string l2 = pl.empty() ? st : pl + "   " + st;
          it.printf(400, 350, F_SUB[fi], sc, TextAlign::CENTER, "%s", l2.c_str());
        } else {
          it.printf(400, 45, F_ROWL[fi], amber, TextAlign::CENTER, "%s  %s", sched.c_str(), dest.c_str());
          if (cancelled) {
            it.printf(400, 190, F_ROWL[fi], red, TextAlign::CENTER, "Cancelled");
          } else {
            char cb[24];
            if (mins < 0) snprintf(cb, sizeof(cb), "--");
            else if (mins <= 1) snprintf(cb, sizeof(cb), "Due");
            else if (mins < 60) snprintf(cb, sizeof(cb), "%d min", mins);
            else snprintf(cb, sizeof(cb), "%dh %02dm", mins / 60, mins % 60);
            it.printf(400, 190, F_BIG[fi], sc, TextAlign::CENTER, "%s", cb);
          }
          it.printf(400, 310, F_ROW[fi], sc, TextAlign::CENTER, "%s", st.c_str());
          std::string l3 = pl;
          if (departure::valid(oper)) l3 += (l3.empty() ? "" : "   ") + oper;
          it.printf(400, 360, F_SUB[fi], amber, TextAlign::CENTER, "%s", l3.c_str());
        }
      };
      auto draw_detail = [&](std::string sched, std::string exp, std::string plat, std::string pchg, std::string calls,
                             std::string reason, std::string oper, std::string delaym, std::string stops,
                             std::string sarr, std::string earr, std::string pprev, bool cancelled, bool late) {

        // ---------- header: time, destination, status ----------
        const int LH = F_SUB[fi]->get_height() + 4;            // line height follows the chosen font
        int bx, by, bw, bh;
        Color sc = cancelled ? red : (late ? orange : green);
        std::string st = cancelled ? std::string("Cancelled") : (late ? (departure::valid(exp) ? "Exp " + exp : std::string("Delayed")) : std::string("On time"));
        it.get_text_bounds(0, 0, sched.c_str(), F_ROW[fi], TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
        const int dx = 18 + bw + 20;                           // content column, lined up under the destination
        int stw;
        it.get_text_bounds(0, 0, st.c_str(), F_ROW[fi], TextAlign::TOP_LEFT, &bx, &by, &stw, &bh);
        std::string dd = departure::destination(calls, 60);
        fit(dd, F_ROW[fi], 784 - stw - 24 - dx);
        it.printf(18, 8, F_ROW[fi], amber, "%s", sched.c_str());
        it.printf(dx, 8, F_ROW[fi], amber, "%s", dd.c_str());
        it.printf(784, 8, F_ROW[fi], sc, TextAlign::TOP_RIGHT, "%s", st.c_str());
        int cy = 8 + F_ROW[fi]->get_height() + 6;

        // ---------- platform and operator, countdown on the right ----------
        char cb[24] = "";
        if (!cancelled) {
          int dm = departure::minutes_until(exp.empty() ? sched : exp, nowmin);
          if (dm >= 0) {
            if (dm <= 1) snprintf(cb, sizeof(cb), "Due");
            else if (dm < 60) snprintf(cb, sizeof(cb), "in %d min", dm);
            else snprintf(cb, sizeof(cb), "in %dh %02dm", dm / 60, dm % 60);
          }
        }
        int cw = 0;
        if (cb[0]) it.get_text_bounds(0, 0, cb, F_SUB[fi], TextAlign::TOP_LEFT, &bx, &by, &cw, &bh);
        std::string l2;
        if (departure::valid(plat) && !cancelled) {
          l2 = "Platform " + plat;
          if (departure::truthy(pchg) && departure::valid(pprev)) l2 += " (was " + pprev + ")";
        }
        if (departure::valid(oper)) l2 += (l2.empty() ? "" : "  -  ") + oper;
        fit(l2, F_SUB[fi], 784 - (cw ? cw + 24 : 0) - dx);
        it.printf(dx, cy, F_SUB[fi], departure::truthy(pchg) ? orange : amber, "%s", l2.c_str());
        if (cb[0]) it.printf(784, cy, F_SUB[fi], late ? orange : green, TextAlign::TOP_RIGHT, "%s", cb);
        cy += LH;

        // ---------- delay, reason, arrival ----------
        if (delaym.size() > 2 && delaym.compare(delaym.size() - 2, 2, ".0") == 0) delaym.resize(delaym.size() - 2);
        if (late && !cancelled && departure::valid(exp)) {
          std::string l3 = "Expected " + exp;
          if (departure::valid(delaym) && delaym != "0") l3 += "  -  " + delaym + " min late";
          fit(l3, F_SUB[fi], 784 - dx);
          it.printf(dx, cy, F_SUB[fi], orange, "%s", l3.c_str());
          cy += LH;
        }
        if (departure::valid(reason)) {
          std::string rem = reason;
          for (int ln = 0; ln < 2 && !rem.empty(); ln++) {
            std::string line;
            size_t p = 0, next = std::string::npos;
            while (p <= rem.size()) {
              size_t e = rem.find(' ', p);
              if (e == std::string::npos) e = rem.size();
              std::string cand = rem.substr(0, e);
              it.get_text_bounds(0, 0, cand.c_str(), F_SUB[fi], TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
              if (bw > 784 - dx && !line.empty()) break;
              line = cand;
              next = e + 1;
              if (e >= rem.size()) break;
              p = e + 1;
            }
            rem = (next != std::string::npos && next < rem.size()) ? rem.substr(next) : "";
            if (ln == 1 && !rem.empty()) line += " ...";
            fit(line, F_SUB[fi], 784 - dx);
            it.printf(dx, cy, F_SUB[fi], cancelled ? red : orange, "%s", line.c_str());
            cy += LH;
          }
        }
        if (departure::valid(sarr) && !cancelled) {
          bool latearr = departure::valid(earr) && earr != sarr;
          std::string l4 = "Arrives " + (latearr ? earr : sarr);
          if (latearr) l4 += "  (due " + sarr + ")";
          it.printf(dx, cy, F_SUB[fi], latearr ? orange : amber, "%s", l4.c_str());
          cy += LH;
        }

        // ---------- calling points as a route line ----------
        std::vector<std::pair<std::string, std::string>> stp;
        if (departure::valid(stops)) {
          size_t pos = 0;
          while (pos < stops.size()) {
            size_t e = stops.find(", ", pos);
            std::string item = stops.substr(pos, e == std::string::npos ? std::string::npos : e - pos);
