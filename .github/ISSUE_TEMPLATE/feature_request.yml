name: Idea or feature request
description: Suggest something new for the board
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the board to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
      description: A photo of a real station board doing it is great, if you have one.
