blueprint:
  name: UK Departure Board - send trains to the board
  author: GrimmNorth
  description: >-
    Sends departures to your UK Departure Board every minute. Pick your board and a
    My Rail Commute station or route (set it to 10 services and a 1-minute departed
    train grace period). At busy stations, use a route (e.g. Manchester Piccadilly to Leeds).
    Tube and DLR stations come from the London TfL integration (Marketplace).
    Up to 5 stations in total; swipe or tap the station name on the board to switch.
    Optionally, get a phone notification when one of your favourite trains (press and hold
    a train on the board) is late, cancelled or changes platform, and station-style announcements
    on the board's speaker or any Home Assistant speaker. Use one automation per board.
  domain: automation
  source_url: https://github.com/GrimmNorth/departure-board/blob/main/blueprints/automation/departure-board.yaml
  input:
    board:
      name: Departure board
      description: Your departure board (it appears here once you have added it to Home Assistant).
      selector:
        device:
          filter:
            - integration: esphome
    station:
      name: Station or route
      description: >-
        Your station ("Departures from ...") or a route (e.g. "Manchester Piccadilly to Leeds"),
        from the My Rail Commute integration. A route shows only trains to that destination, which
        suits busy stations.
      selector:
        device:
          filter:
            - integration: my_rail_commute
    more_stations:
      name: More stations or routes (optional)
      description: >-
        Extra stations or routes to switch between. Station 1 is the one above, then these in order.
        The board takes up to 5 stations in total, including any Tube / DLR stations below.
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: my_rail_commute
    tfl_stations:
      name: London Underground / DLR stations (optional)
      description: >-
        Tube or DLR stations from the London TfL integration (Marketplace), after the stations above.
        Pick each station's main sensor, not the "All" or "Scheduled" one. Several lines at one
        station merge and count as one station. Up to 5 stations in total.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - integration: london_tfl
              domain: sensor
    weather:
      name: Weather (optional)
      description: >-
        A weather entity, for the temperature and conditions in the board's footer and on its clock
        screen. Hide it on the board with "Show weather".
      default: ""
      selector:
        entity:
          filter:
            - domain: weather
    fav_phones:
      name: Favourite train alerts (optional)
      description: >-
        Phones (Home Assistant Companion app) to notify when one of your favourite trains is late,
        cancelled or changes platform. Press and hold a train on the board to make it a favourite.
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    fav_min_delay:
      name: Late by at least
      description: Only tell you about a delay of at least this many minutes.
      default: 5
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
          mode: slider
    fav_platform:
      name: Platform changes
      description: Also tell you when a favourite train changes platform.
      default: true
      selector:
        boolean:
    announcements:
      name: Announcement voice and speakers (optional, experimental)
      icon: mdi:bullhorn-outline
      description: >-
        Spoken train announcements need a speaker: one plugged into the board's speaker socket, or any
        speaker you already have in Home Assistant (e.g. a Google Nest Mini). Turn them on and choose which
        trains on the board (Settings > Sound) or on its device page. Here you pick the voice and the speakers.
      collapsed: true
      input:
        ann_speakers:
          name: Speakers
          description: >-
            Leave empty to use the board's own speaker. Or pick any Home Assistant speakers (e.g. a Google Nest Mini)
            to announce on instead; add the board's speaker too if you want both. The chime only plays on the board.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        ann_voice_pick:
          name: Voice
          description: >-
            Who reads the announcements. Google Translate is free and built in; Piper is free and runs on your
            own Home Assistant (needs the Piper app); Home Assistant Cloud needs a Cloud subscription.
            A small speaker sounds much the same with any of them.
          default: google_uk
          selector:
            select:
              options:
                - label: "Google Translate: British"
                  value: google_uk
                - label: "Piper: Northern English (male)"
                  value: "piper:en_GB-northern_english_male-medium"
                - label: "Piper: Alan (male)"
                  value: "piper:en_GB-alan-medium"
                - label: "Piper: Cori (female)"
                  value: "piper:en_GB-cori-high"
                - label: "Piper: Jenny (female)"
                  value: "piper:en_GB-jenny_dioco-medium"
                - label: "Piper: Southern English (female)"
                  value: "piper:en_GB-southern_english_female-low"
                - label: "Home Assistant Cloud: Ryan (male)"
                  value: "cloud:RyanNeural"
                - label: "Home Assistant Cloud: Thomas (male, deeper)"
                  value: "cloud:ThomasNeural"
                - label: "Home Assistant Cloud: Sonia (female)"
                  value: "cloud:SoniaNeural"
                - label: "Home Assistant Cloud: Libby (female, warmer)"
                  value: "cloud:LibbyNeural"
                - label: "Other (set the two options below)"
                  value: custom
        ann_tts:
          name: Other voice service (only with Voice set to Other)
          description: Any other text-to-speech service.
          default: ""
          selector:
            entity:
              filter:
                - domain: tts
        ann_voice:
          name: Other voice name (only with Voice set to Other)
          description: The voice's name in that service, if it has several. Leave empty for its own voice.
          default: ""
          selector:
            text:

mode: queued
max: 5
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: homeassistant
    event: start
  # the board asks for new data straight away when you switch station
  - trigger: event
    event_type: esphome.departure_board_station
    event_data:
      device_id: !input board
  # the board says a favourite train is late, cancelled or has changed platform
  - trigger: event
    id: fav
    event_type: esphome.departure_board_favourite
    event_data:
      device_id: !input board
  # the board says a train has just become late or been cancelled (for announcements)
  - trigger: event
    id: chg
    event_type: esphome.departure_board_change
    event_data:
      device_id: !input board

variables:
  board_id: !input board
  # the board's own entities, looked up once (its settings and which features its firmware has)
  board_ents: "{{ device_entities(board_id) }}"
  first_station: !input station
  extra: !input more_stations
  tfl_in: !input tfl_stations
  weather_in: !input weather
  # announcements are switched on and set up on the board (Settings > Sound)
  ann_sel: "{{ board_ents | select('match', 'select\\..*_announcements$') | first | default('') }}"
  # Sounds off (no speaker) or muted: no announcements at all
  ann_sound: >-
    {% set e = board_ents %}{{ is_state(e | select('match', 'switch\\..*_sounds$') | first | default(''), 'on') and not is_state(e | select('match', 'switch\\..*_mute$') | first | default(''), 'on') }}
  ann_mode: "{{ states(ann_sel) if ann_sel and ann_sound else 'Off' }}"
  # the temperature, rounded ("" when there's no weather entity or it isn't available)
  wx_temp: >-
    {% set t = state_attr(weather_in, 'temperature') if weather_in else none %}{{ (t | float) | round(0) | int if t is number or (t is string and t | float(none) is not none) else '' }}
  wx_cond: "{{ states(weather_in) if weather_in and states(weather_in) not in ['unknown', 'unavailable'] else '' }}"
  # London TfL sensors (the "All" / "Scheduled" ones are mapped to the station's main sensor)
  tfl_list: "{{ (tfl_in if tfl_in is list else ([tfl_in] if tfl_in else [])) | map('regex_replace', '_(all|scheduled)$', '') | list }}"
  # sensors for the same station (one per line) are merged into one board
  tfl_groups: >-
    {% set ns = namespace(names=[], groups=[]) %}{% for e in tfl_list %}{% set n = state_attr(e, 'station_name') or e %}{% set ns2 = namespace(i=-1) %}{% for x in ns.names %}{% if x == n %}{% set ns2.i = loop.index0 %}{% endif %}{% endfor %}{% if ns2.i >= 0 %}{% set ns.groups = ns.groups[:ns2.i] + [ns.groups[ns2.i] + [e]] + ns.groups[ns2.i + 1:] %}{% else %}{% set ns.names = ns.names + [n] %}{% set ns.groups = ns.groups + [[e]] %}{% endif %}{% endfor %}{{ ns.groups }}
  tfl_keys: "{% set ns = namespace(k=[]) %}{% for g in tfl_groups %}{% set ns.k = ns.k + [g[0]] %}{% endfor %}{{ ns.k }}"
  stations: "{{ [first_station] + (extra if extra is list else ([extra] if extra else [])) + tfl_keys }}"
  num_ent: "{{ board_ents | select('match', 'number\\.') | select('search', 'station_number') | first | default('') }}"
  # a switch on the board sends its new number with the signal; otherwise read the board's setting
  pick: >-
    {% if trigger is defined and trigger.platform == 'event' and trigger.event.data.number is defined %}{{ trigger.event.data.number | int(1) }}{% elif num_ent != '' %}{{ states(num_ent) | int(1) }}{% else %}1{% endif %}
  idx: "{{ pick - 1 if 1 <= pick <= (stations | count) else 0 }}"
  station_id: "{{ stations[idx] }}"
  is_tfl: "{{ station_id in tfl_keys }}"
  tfl_members: "{% set ns = namespace(m=[]) %}{% for g in tfl_groups if g[0] == station_id %}{% set ns.m = g %}{% endfor %}{{ ns.m }}"
  svc: "{{ device_attr(board_id, 'name') | slugify }}"
  ents: "{{ [] if is_tfl else device_entities(station_id) }}"
  # how the station's trains have run this week, from My Rail Commute (-1 when not known)
  hist_pct: >-
    {% set e = ents | select('search', 'historical_reliability$') | first | default('') %}{{ states(e) | float(-1) | round(0) | int if e else -1 }}
  hist_avg: >-
    {% set e = ents | select('search', 'historical_delays$') | first | default('') %}{{ states(e) | float(-1) | round(0) | int if e else -1 }}
  status_ent: "{{ ents | select('search', '_status$') | first | default('') }}"
  summary_ent: "{{ ents | select('search', '_summary$') | first | default('') }}"
  by_dest: "{{ state_attr(summary_ent, 'services_by_destination') }}"
  # a My Rail Commute route (e.g. Manchester Piccadilly to Leeds) has a destination; "Departures from" does not
  origin_name: "{% set v = state_attr(status_ent, 'origin_name') if status_ent != '' else none %}{{ v if v else '' }}"
  route_to: "{% set v = state_attr(status_ent, 'destination_name') if status_ent != '' else none %}{{ v if v else '' }}"
  all_trains: "{% set v = state_attr(summary_ent, 'all_trains') if summary_ent != '' else none %}{{ v if v is list else [] }}"
  # a route has no times for each stop, so borrow them from a My Rail Commute "Departures from" station
  # with the same trains (service IDs are per station), if you have one set up
  route_stops: >-
    {% set ns = namespace(m={}) %}{% if route_to and not by_dest %}{% for e in integration_entities('my_rail_commute') | select('search', '_summary$') %}{% set bd = state_attr(e, 'services_by_destination') %}{% if bd is mapping %}{% for dest in bd.values() %}{% for s in (dest.services if dest.services is defined else []) if s.service_id is defined and s.service_id not in ns.m %}{% set p = namespace(out=[]) %}{% for c in (s.calling_point_details if s.calling_point_details is defined else []) %}{% set tm = c.expected if (c.expected | string | regex_match('^[0-9]{2}:[0-9]{2}$')) else c.scheduled %}{% set p.out = p.out + [c.name ~ ' ' ~ tm] %}{% endfor %}{% if p.out %}{% set ns.m = dict(ns.m, **{s.service_id: p.out | join(', ')}) %}{% endif %}{% endfor %}{% endfor %}{% endif %}{% endfor %}{% endif %}{{ ns.m }}
  # setup checks, for Home Assistant notifications
  note_id: "uk_departure_board_{{ svc }}"
  # minutes since the station's data stopped coming (-1 when it's fine)
  data_bad_for: >-
    {% set e = (tfl_members[0] if tfl_members else '') if is_tfl else summary_ent %}{% if e and states(e) in ['unavailable', 'unknown'] and states[e] is not none %}{{ ((now() - states[e].last_changed).total_seconds() / 60) | int }}{% elif not e %}0{% else %}-1{% endif %}
  # trains that had left more than 3 minutes before My Rail Commute last fetched them but were still listed:
  # its grace period is too long. Measured from the fetch time, not now, so a train that leaves between
  # two updates (or while updates pause at night) doesn't count.
  stale_trains: >-
    {% set lu = state_attr(summary_ent, 'last_updated') if summary_ent != '' else none %}{% set dt = (lu | as_datetime(none)) if lu is string else lu %}{% set ft = as_local(dt) if dt else now() %}{% set ns = namespace(n=0) %}{% set nm = ft.hour * 60 + ft.minute %}{% for t in all_trains if t is mapping and not t.get('is_cancelled', false) %}{% set ex = t.get('expected_departure', '') | string %}{% set tm = ex if ex | regex_match('^[0-9]{2}:[0-9]{2}') else t.get('scheduled_departure', '') | string %}{% if tm | regex_match('^[0-9]{2}:[0-9]{2}') %}{% set d = (nm - ((tm[:2] | int) * 60 + (tm[3:5] | int))) % 1440 %}{% if 3 < d < 720 %}{% set ns.n = ns.n + 1 %}{% endif %}{% endif %}{% endfor %}{{ ns.n }}
  # London TfL: live trains from every line at the station (timetable-only ones left out), sorted by time,
  # each with its line's name and colour; the station's name; and the lines' status from London Underground
  tfl_lines: >-
    {{ {'bakerloo': ['Bakerloo line', '#8A4513', 'bakerloo'], 'central': ['Central line', '#E32017', 'central'], 'circle': ['Circle line', '#FFD300', 'circle'], 'district': ['District line', '#00782A', 'district'], 'hammersmith': ['Hammersmith & City line', '#F3A9BB', 'hammersmith_city'], 'jubilee': ['Jubilee line', '#A0A5A9', 'jubilee'], 'metropolitan': ['Metropolitan line', '#9B0056', 'metropolitan'], 'northern': ['Northern line', '#000000', 'northern'], 'piccadilly': ['Piccadilly line', '#003688', 'piccadilly'], 'victoria': ['Victoria line', '#0098D4', 'victoria'], 'waterloo': ['Waterloo & City line', '#95CDBA', 'waterloo_city'], 'dlr': ['DLR', '#00A4A7', 'dlr'], 'elizabeth': ['Elizabeth line', '#6950A1', 'elizabeth_line']} }}
  tfl_deps: >-
    {% set out = namespace(l=[]) %}{% for e in tfl_members %}{% set tok = (e | replace('sensor.london_tfl_', '')).split('_')[0] %}{% set info = tfl_lines.get(tok, ['', '', '']) %}{% set c = state_attr(e, 'line_colours') %}{% set col = info[1] if info[1] else ('#%02X%02X%02X' | format(c.r, c.g, c.b) if c is mapping else '') %}{% set dl = state_attr(e, 'departures') %}{% for d in (dl if dl is list else []) if d.expected is defined and '🕒' not in (d.destination | string) %}{% set out.l = out.l + [dict(d, ln=info[0], col=col)] %}{% endfor %}{% endfor %}{{ out.l | sort(attribute='expected') }}
  tfl_name: >-
    {% set n = state_attr(station_id, 'station_name') if is_tfl else none %}{{ (n | string) | regex_replace('\\s+(Underground|DLR|Rail|Elizabeth line)?\\s*Station$', '', ignorecase=True) if n else '' }}
  tfl_status: >-
    {% set ns = namespace(m=[]) %}{% for e in tfl_members %}{% set tok = (e | replace('sensor.london_tfl_', '')).split('_')[0] %}{% set info = tfl_lines.get(tok) %}{% if info %}{% set st = 'sensor.london_underground_' ~ info[2] %}{% set v = states(st) %}{% if v not in ['Good Service', 'unknown', 'unavailable'] %}{% set dsc = (state_attr(st, 'Description') or '') | regex_replace('\\s+', ' ') | trim %}{% set m = dsc if dsc and dsc != 'Nothing to report' else info[0] ~ ': ' ~ v %}{% if m not in ns.m %}{% set ns.m = ns.m + [m] %}{% endif %}{% endif %}{% endif %}{% endfor %}{{ ns.m | join('\n') }}
  # the station's name as the board shows it (favourites are saved with it, e.g. "07:42 York")
  stn_name: >-
    {{ tfl_name if is_tfl and tfl_name else (origin_name if origin_name | length > 0 else (device_attr(station_id, 'name') | regex_replace('^\\s*(departures|trains)\\s+from\\s+', '', ignorecase=True))) }}
  # National Rail station messages (engineering works, strikes...), one per line, without the web links
  messages: >-
    {% if is_tfl %}{{ tfl_status }}{% else %}{% set ns = namespace(out=[]) %}{% set raw = state_attr(summary_ent, 'nrcc_messages') if summary_ent != '' else none %}{% for m in (raw if raw is list else []) %}{% if m is mapping %}{% set v = m.get('Value', m.get('value', '')) %}{% else %}{% set v = m %}{% endif %}{% set v = (v | string) | regex_replace('<[^>]*>', '') | replace('&amp;', '&') | replace('&quot;', '"') | replace('&#39;', "'") | replace('&lt;', '<') | replace('&gt;', '>') | replace('&nbsp;', ' ') | regex_replace('[‘’]', "'") | regex_replace('[“”]', '"') | regex_replace('[–—]', '-') | regex_replace('[^\x20-\x7E]', ' ') | regex_replace('\s+', ' ') | trim | truncate(400, true, '...') %}{% if v %}{% set ns.out = ns.out + [v] %}{% endif %}{% endfor %}{{ ns.out | join('\n') }}{% endif %}

actions:
  # a favourite train alert from the board: notify the chosen phones, then stop (no trains to send)
  - if:
      - "{{ trigger.id == 'fav' }}"
    then:
      - variables:
          phones_in: !input fav_phones
          min_delay: !input fav_min_delay
          want_plat: !input fav_platform
          phones: "{{ phones_in if phones_in is list else ([phones_in] if phones_in else []) }}"
          fd: "{{ trigger.event.data }}"
          dmin: "{{ fd.delay | int(0) }}"
          train: >-
            {{ fd.sched }}{{ ' from ' ~ fd.station if fd.station else '' }}{{ ' to ' ~ fd.destination if fd.destination else '' }}
          reason: "{{ (fd.reason ~ '.') | replace('..', '.') if fd.reason else '' }}"
          send: >-
            {{ phones | count > 0 and (fd.kind == 'cancelled' or (fd.kind == 'delayed' and dmin >= min_delay | int)
               or (fd.kind == 'platform' and want_plat and fd.platform)) }}
          title: >-
            {% if fd.kind == 'cancelled' %}{{ fd.sched }} cancelled{% elif fd.kind == 'delayed' %}{{ fd.sched }} running {{ dmin }} min late{% else %}{{ fd.sched }}: now platform {{ fd.platform }}{% endif %}
          message: >-
            {% if fd.kind == 'cancelled' %}Your {{ train }} has been cancelled.{{ ' ' ~ reason if reason else '' }}{% elif fd.kind == 'delayed' %}Your {{ train }} is running {{ dmin }} minutes late{{ ', now expected at ' ~ fd.expected if fd.expected else '' }}.{{ ' ' ~ reason if reason else '' }}{% else %}Your {{ train }} now leaves from platform {{ fd.platform }}.{% endif %}
      - if:
          - "{{ send }}"
        then:
          - repeat:
              for_each: "{{ phones }}"
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  continue_on_error: true
                  data:
                    title: "{{ title }}"
                    message: "{{ message }}"
                    data:
                      tag: "departure_board_{{ fd.sched | replace(':', '') }}"
      - stop: Favourite train alert handled
  # everything except an announcement-only run: send the trains and the rest to the board
  - if:
      - "{{ trigger.id != 'chg' }}"
    then:
      # this blueprint's version, so the board can say when it needs re-importing. Raise it whenever a
      # change needs the new blueprint (and BP_NEED in the firmware). Only newer boards have the action.
      - if:
          - "{{ board_ents | select('search', '_blueprint$') | list | count > 0 }}"
        then:
          - action: "esphome.{{ svc }}_set_blueprint_version"
            continue_on_error: true
            data:
              ver: 3
      - action: "esphome.{{ svc }}_update_status"
        continue_on_error: true
        data:
          station: "{{ stn_name }}"
          status: >-
            {{ states(status_ent) if status_ent != '' else '' }}
      # National Rail or London TfL: TfL boards count down and show the tunnel logo.
      # Only boards with a "Data source" sensor have this action.
      - if:
          - "{{ board_ents | select('search', '_data_source$') | list | count > 0 }}"
        then:
          - action: "esphome.{{ svc }}_update_source"
            continue_on_error: true
            data:
              kind: "{{ 'tfl' if is_tfl else 'rail' }}"
      # the route's destination for the board's "Destination (to ... only)" heading. Only boards with the
      # route feature have the action (they also have a "Route" sensor); calling a missing action stops the automation.
      - if:
          - "{{ board_ents | select('search', '_route$') | list | count > 0 }}"
        then:
          - action: "esphome.{{ svc }}_update_route"
            continue_on_error: true
            data:
              to: "{{ route_to }}"
      # weather and the station's reliability. Only boards with a "Show weather" switch have these actions.
      - if:
          - "{{ board_ents | select('search', '_show_weather$') | list | count > 0 }}"
        then:
          - action: "esphome.{{ svc }}_update_weather"
            continue_on_error: true
            data:
              temp: "{{ wx_temp | string if wx_cond != '' else '' }}"
              cond: "{{ wx_cond }}"
          - action: "esphome.{{ svc }}_update_history"
            continue_on_error: true
            data:
              pct: "{{ hist_pct }}"
              avg: "{{ hist_avg }}"
      # station messages for the "i" in the footer. Only boards with a "Station messages" sensor have this action.
      - if:
          - "{{ board_ents | select('search', '_station_messages$') | list | count > 0 }}"
        then:
          - action: "esphome.{{ svc }}_update_messages"
            continue_on_error: true
            data:
              msgs: "{{ messages }}"
      # the next 10 trains, one entry each: London TfL live trains, or My Rail Commute's trains
      - variables:
          rows: >-
            {% set ns = namespace(r=[]) %}{% for i in range(1, 11) %}{% if is_tfl %}{% set d = tfl_deps[i - 1] if i <= (tfl_deps | count) else {} %}{% set tm = (as_datetime(d.expected) | as_local).strftime('%H:%M') if d.expected is defined else '' %}{% set des = d.line.designation if d.line is defined and d.line.designation is defined else '' %}{% set loc = d.current_location if d.current_location is defined and d.current_location else '' %}{% set parts = [d.ln if d.ln is defined else '', des.split(' - ')[0] if ' - ' in des else des, loc] %}{% set ns.r = ns.r + [{
              'sched': tm, 'expct': tm, 'plat': des.split(' - ')[-1] if ' - ' in des else '', 'pchg': '',
              'stat': '' if not tm else ('arriving' if loc == 'At Platform' or loc.startswith('At ' ~ tfl_name) or loc.startswith('Approaching ' ~ tfl_name) else 'on_time'),
              'dreason': '', 'creason': '', 'oper': parts | select | join(' - ') if tm else '', 'delaym': '', 'sarr': '', 'earr': '',
              'pprev': d.col if tm and d.col is defined else '', 'stops': '',
              'calls': [d.destination | regex_replace('^\\W+', '') | trim] if tm and d.destination is defined else []}] %}{% else %}{% set t = ents | select('search', '_train_' ~ i ~ '$') | first | default('') %}{% set sid = state_attr(t, 'service_id') if t != '' else '' %}{% set c = state_attr(t, 'calling_points') if t != '' else none %}{% set c = c if c is list else [] %}{% set c0 = c %}{% set fd = (all_trains | selectattr('service_id', 'eq', sid) | map(attribute='destination') | first | default('')) if route_to and sid else '' %}{% if fd and (c | count == 0 or c[-1] != fd) %}{% set c = c + [fd] %}{% endif %}{% set st = namespace(out=[]) %}{% if by_dest and sid %}{% for dest in by_dest.values() %}{% for sv in dest.services if sv.service_id == sid %}{% for q in sv.calling_point_details %}{% set qt = q.expected if (q.expected | regex_match('^[0-9]{2}:[0-9]{2}$')) else q.scheduled %}{% set st.out = st.out + [q.name ~ ' ' ~ qt] %}{% endfor %}{% endfor %}{% endfor %}{% elif sid and sid in route_stops %}{% set st.out = [route_stops[sid]] %}{% elif route_to %}{% set ea = state_attr(t, 'estimated_arrival') %}{% set at = ea if (ea | string | regex_match('^[0-9]{2}:[0-9]{2}$')) else state_attr(t, 'scheduled_arrival') %}{% for q in c0 %}{% set st.out = st.out + [q ~ (' ' ~ at if q == route_to and at else '')] %}{% endfor %}{% if fd and fd not in c0 %}{% set st.out = st.out + [fd] %}{% endif %}{% endif %}{% set ns.r = ns.r + [{
              'sched': state_attr(t, 'scheduled_departure') or '', 'expct': state_attr(t, 'expected_departure') or '',
              'plat': state_attr(t, 'platform') or '', 'pchg': (state_attr(t, 'platform_changed') if state_attr(t, 'platform_changed') is not none else '') | string,
              'stat': state_attr(t, 'status') or '', 'dreason': state_attr(t, 'delay_reason') or '', 'creason': state_attr(t, 'cancellation_reason') or '',
              'oper': state_attr(t, 'operator') or '', 'delaym': (state_attr(t, 'delay_minutes') if state_attr(t, 'delay_minutes') is not none else '') | string,
              'sarr': state_attr(t, 'scheduled_arrival') or '', 'earr': state_attr(t, 'estimated_arrival') or '', 'pprev': state_attr(t, 'previous_platform') or '',
              'stops': st.out | join(', ') | truncate(250, true, ''), 'calls': c}] %}{% endif %}{% endfor %}{{ ns.r }}
          # boards from 2.3.0 take all ten trains in one message, so they never show half old, half new trains
          fw_ver: >-
            {% set u = board_ents | select('match', 'update\\.') | first | default('') %}{% set v = (state_attr(u, 'installed_version') or '0') | string %}{% set p = (v.split('.') + ['0', '0'])[:3] | map('int', 0) | list %}{{ p[0] * 10000 + p[1] * 100 + p[2] }}
      - if:
          - "{{ fw_ver | int >= 20300 }}"
        then:
          - action: "esphome.{{ svc }}_update_trains"
            continue_on_error: true
            data:
              sched: "{{ rows | map(attribute='sched') | map('string') | list }}"
              expct: "{{ rows | map(attribute='expct') | map('string') | list }}"
              plat: "{{ rows | map(attribute='plat') | map('string') | list }}"
              pchg: "{{ rows | map(attribute='pchg') | map('string') | list }}"
              stat: "{{ rows | map(attribute='stat') | map('string') | list }}"
              dreason: "{{ rows | map(attribute='dreason') | map('string') | list }}"
              creason: "{{ rows | map(attribute='creason') | map('string') | list }}"
              oper: "{{ rows | map(attribute='oper') | map('string') | list }}"
              delaym: "{{ rows | map(attribute='delaym') | map('string') | list }}"
              sarr: "{{ rows | map(attribute='sarr') | map('string') | list }}"
              earr: "{{ rows | map(attribute='earr') | map('string') | list }}"
              pprev: "{{ rows | map(attribute='pprev') | map('string') | list }}"
              stops: "{{ rows | map(attribute='stops') | map('string') | list }}"
              calls: "{% set ns = namespace(l=[]) %}{% for r in rows %}{% set ns.l = ns.l + [r.calls | to_json(ensure_ascii=False)] %}{% endfor %}{{ ns.l }}"
        else:
          - repeat:
              for_each: "{{ rows }}"
              sequence:
                - action: "esphome.{{ svc }}_update_train"
                  continue_on_error: true
                  data:
                    n: "{{ repeat.index }}"
                    sched: "{{ repeat.item.sched }}"
                    expct: "{{ repeat.item.expct }}"
                    plat: "{{ repeat.item.plat }}"
                    pchg: "{{ repeat.item.pchg }}"
                    stat: "{{ repeat.item.stat }}"
                    dreason: "{{ repeat.item.dreason }}"
                    creason: "{{ repeat.item.creason }}"
                    oper: "{{ repeat.item.oper }}"
                    delaym: "{{ repeat.item.delaym }}"
                    sarr: "{{ repeat.item.sarr }}"
                    earr: "{{ repeat.item.earr }}"
                    pprev: "{{ repeat.item.pprev }}"
                    stops: "{{ repeat.item.stops }}"
                    calls: "{{ repeat.item.calls }}"
      # tell the board how many stations there are
      - action: "esphome.{{ svc }}_set_station_count"
        continue_on_error: true
        data:
          count: "{{ stations | count }}"
      # a notification in Home Assistant when the board can't get trains, or My Rail Commute needs a setting changed.
      # Each one clears itself once it's fixed.
      - if:
          - "{{ data_bad_for | int >= 15 }}"
        then:
          - action: persistent_notification.create
            continue_on_error: true
            data:
              notification_id: "{{ note_id }}_data"
              title: "UK Departure Board: no trains"
              message: >-
                {{ stn_name if stn_name else 'The board\'s station' }} hasn't sent any trains for {{ data_bad_for }} minutes.
                {% if is_tfl %}Check the London TfL integration in Settings > Devices & services.{% else %}Check My Rail Commute in
                Settings > Devices & services: if it shows an error, your National Rail Darwin token may have expired or been
                mistyped, so reconfigure it with a new token.{% endif %}
        else:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: "{{ note_id }}_data"
      - if:
          - "{{ not is_tfl and stale_trains | int > 0 }}"
        then:
          - action: persistent_notification.create
            continue_on_error: true
            data:
              notification_id: "{{ note_id }}_grace"
              title: "UK Departure Board: change one My Rail Commute setting"
              message: >-
                My Rail Commute is still listing trains that left a few minutes ago, so they take up rows on the board.
                Open {{ stn_name if stn_name else 'your station' }} in Settings > Devices & services > My Rail Commute, choose
                Configure > Disruption, and set "Departed train grace period" to 1 minute. This message goes away by itself once it's fixed.
        else:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: "{{ note_id }}_grace"
  # announcements: a few minutes before each train from the station on the board (not Tube / DLR), once a minute
  - if:
      - "{{ ann_mode in ['All trains', 'Delays only', 'Favourites only'] and trigger is defined and (trigger.platform == 'time_pattern' or trigger.id == 'chg') }}"
    then:
      - variables:
          which: "{{ ['delayed', 'cancelled'] if ann_mode == 'Delays only' else ['on_time', 'delayed', 'cancelled'] }}"
          # Favourites only: the board's favourite trains, "HH:MM" or "HH:MM Station", comma separated
          fav_times: >-
            {% set ns = namespace(l=[]) %}{% if ann_mode == 'Favourites only' %}{% set fe = board_ents | select('match', 'text\\..*_favourite_trains$') | first | default('') %}{% for f in (states(fe) if fe else '').split(',') %}{% set f = f | trim %}{% set hm = f[:5] %}{% set st = f[5:] | trim %}{% if hm | regex_match('^[0-9]{2}:[0-9]{2}$') and (st == '' or st | lower == stn_name | lower) %}{% set ns.l = ns.l + [hm] %}{% endif %}{% endfor %}{% endif %}{{ ns.l }}
          before: "{{ states(board_ents | select('match', 'number\\..*_announce_before$') | first | default('')) | int(5) }}"
          chime: "{{ is_state(board_ents | select('match', 'switch\\..*_chime_first$') | first | default(''), 'on') }}"
          spk_in: !input ann_speakers
          pick: !input ann_voice_pick
          tts_in: !input ann_tts
          voice_in: !input ann_voice
          # quiet between the board's Night starts and Night ends (or sunset to sunrise when night follows the sun)
          quiet: >-
            {% set qs = board_ents | select('match', 'switch\\..*_quiet_at_night$') | first | default('') %}{% if not is_state(qs, 'on') %}false{% elif is_state(board_ents | select('match', 'switch\\..*_night_follows_sun$') | first | default(''), 'on') %}{{ is_state('sun.sun', 'below_horizon') }}{% else %}{% set q_from = states(board_ents | select('match', 'time\\..*_night_starts$') | first | default('')) %}{% set q_to = states(board_ents | select('match', 'time\\..*_night_ends$') | first | default('')) %}{% set n = now().strftime('%H:%M:%S') %}{% if not (q_from | regex_match('^[0-9]{2}:[0-9]{2}')) or not (q_to | regex_match('^[0-9]{2}:[0-9]{2}')) or q_from == q_to %}false{% elif q_from < q_to %}{{ q_from <= n < q_to }}{% else %}{{ n >= q_from or n < q_to }}{% endif %}{% endif %}
          speakers: >-
            {% set l = spk_in if spk_in is list else ([spk_in] if spk_in else []) %}{{ l if l else board_ents | select('match', 'media_player\\.') | list }}
          # the speech service, voice and language for the chosen voice (British English throughout)
          tts_ent: >-
            {% set all = states.tts | map(attribute='entity_id') | list %}{% set want = 'google_translate' if pick == 'google_uk' else ('piper' if pick.startswith('piper:') else ('home_assistant_cloud' if pick.startswith('cloud:') else '')) %}{% set m = all | select('search', want) | first | default('') if want else '' %}{{ m if m else (tts_in if tts_in else (all | first | default(''))) }}
          voice: "{{ pick.split(':', 1)[1] if ':' in pick else (voice_in if pick == 'custom' else '') }}"
          lang: "{{ 'en' if pick == 'google_uk' else ('en_GB' if pick.startswith('piper:') else ('en-GB' if pick.startswith('cloud:') else '')) }}"
          tts_opts: "{{ {'tld': 'co.uk'} if pick == 'google_uk' else ({'voice': voice} if voice else {}) }}"
          a_ents: "{{ device_entities(station_id) }}"
          a_sum: "{{ a_ents | select('search', '_summary$') | first | default('') }}"
          a_all: "{% set v = state_attr(a_sum, 'all_trains') if a_sum else none %}{{ v if v is list else [] }}"
          # the trains to announce this minute, of the kinds chosen: each train that many minutes before its booked
          # time; a delayed train with a new time again that many minutes before the new time ("next_delayed")
          due: >-
            {% set ns = namespace(l=[]) %}{% if trigger.id == 'chg' %}{% set ce = trigger.event.data %}{% set t = a_ents | select('search', '_train_' ~ (ce.train | int(0)) ~ '$') | first | default('') %}{% set sd = state_attr(t, 'scheduled_departure') | string if t else '' %}{% set ex0 = state_attr(t, 'expected_departure') | string if t else '' %}{% set tm = ex0 if ex0 | regex_match('^[0-9]{2}:[0-9]{2}$') else sd[:5] %}{% set nm0 = now().hour * 60 + now().minute %}{% set ahead = ((tm[:2] | int(0)) * 60 + (tm[3:5] | int(0)) - nm0) % 1440 if tm | regex_match('^[0-9]{2}:[0-9]{2}$') else -1 %}{% if t and sd[:5] == ce.sched and 0 < ahead <= 720 and ce.kind in which and (ann_mode != 'Favourites only' or sd in fav_times) %}{% set ns.l = [[t, ce.kind]] %}{% endif %}{{ ns.l }}{% else %}{% set nm = now().hour * 60 + now().minute %}{% for i in range(1, 11) %}{% set t = a_ents | select('search', '_train_' ~ i ~ '$') | first | default('') %}{% if t %}{% set sd = state_attr(t, 'scheduled_departure') | string %}{% if sd | regex_match('^[0-9]{2}:[0-9]{2}$') and (ann_mode != 'Favourites only' or sd in fav_times) %}{% set ex = state_attr(t, 'expected_departure') | string %}{% set ex_ok = ex | regex_match('^[0-9]{2}:[0-9]{2}$') %}{% set k = 'cancelled' if state_attr(t, 'is_cancelled') or state_attr(t, 'status') == 'cancelled' else ('delayed' if (state_attr(t, 'delay_minutes') | int(0)) > 0 or (ex_ok and ex != sd) or ex | lower == 'delayed' else 'on_time') %}{% if k in which and ((sd[:2] | int) * 60 + (sd[3:5] | int) - nm) % 1440 == before | int %}{% set ns.l = ns.l + [[t, k]] %}{% endif %}{% if k == 'delayed' and 'delayed' in which and ex_ok and ex != sd and ((ex[:2] | int) * 60 + (ex[3:5] | int) - nm) % 1440 == before | int %}{% set ns.l = ns.l + [[t, 'next_delayed']] %}{% endif %}{% endif %}{% endif %}{% endfor %}{{ ns.l }}{% endif %}
      - condition: "{{ not is_tfl and not quiet and tts_ent != '' and speakers | count > 0 and due | count > 0 }}"
      - repeat:
          for_each: "{{ due }}"
          sequence:
            - variables:
                t: "{{ repeat.item[0] }}"
                kind: "{{ repeat.item[1] }}"
                sd: "{{ state_attr(t, 'scheduled_departure') }}"
                ex: "{{ state_attr(t, 'expected_departure') | string }}"
                plat: "{{ state_attr(t, 'platform') or '' }}"
                oper: "{{ state_attr(t, 'operator') or '' }}"
                cps: "{% set c = state_attr(t, 'calling_points') %}{{ c if c is list else [] }}"
                dest: >-
                  {% set sid = state_attr(t, 'service_id') %}{% set d = (a_all | selectattr('service_id', 'eq', sid) | map(attribute='destination') | first | default('')) if sid else '' %}{{ d if d else (cps[-1] if cps else '') }}
                stops: >-
                  {% set c = cps[:10] %}{% if c and c[-1] == dest %}{% if c | count > 1 %}Calling at {{ c[:-1] | join(', ') }} and {{ c[-1] }}.{% endif %}{% elif c %}Calling at {{ c[:-1] | join(', ') ~ ' and ' if c | count > 1 else '' }}{{ c[-1] }}, then on to {{ dest }}.{% endif %}
                svc_name: "the {{ sd }} {{ oper ~ ' ' if oper else '' }}service to {{ dest }}"
                reason: >-
                  {% set r = state_attr(t, 'cancellation_reason') if kind == 'cancelled' else state_attr(t, 'delay_reason') %}{{ (r ~ '.') | replace('..', '.') | replace(' delayed by ', ' delayed, by ', 1) | replace(' cancelled because ', ' cancelled, because ', 1) if r else '' }}
                # the commas split each sentence into short pieces: Google's voice reads at most 100 characters at a time and
                # otherwise breaks mid-name ("Manchester ... Airport"); the pauses sound like a real station announcer
                message: >-
                  {% if kind == 'cancelled' %}We are sorry to announce, that {{ svc_name }} has been cancelled.{{ ' ' ~ reason if reason else '' }}{% elif kind == 'delayed' %}We are sorry to announce, that {{ svc_name }} is delayed{{ ', and is now expected at ' ~ ex if ex | regex_match('^[0-9]{2}:[0-9]{2}$') else '' }}.{{ ' ' ~ reason if reason else '' }}{% elif kind == 'next_delayed' %}The next train to depart from {{ 'platform ' ~ plat if plat else 'this station' }}, will be the delayed {{ svc_name[4:] }}, now expected at {{ ex }}. {{ stops }}{% else %}The next train to depart from {{ 'platform ' ~ plat if plat else 'this station' }}, will be {{ svc_name }}. {{ stops }}{% endif %}{% if kind != 'cancelled' and state_attr(t, 'platform_changed') and plat %} Please note, this train will now depart from platform {{ plat }}.{% endif %}
            - if:
                - "{{ chime and board_ents | select('search', '_test_sound$') | list | count > 0 }}"
              then:
                - action: "esphome.{{ svc }}_play_chime"
                  continue_on_error: true
                # ask for the speech straight away: making and fetching it takes a second or two. Boards from 2.3.3
                # play the voice over the end of the chime; older ones would cut the chime off, so wait a little there
                - delay:
                    milliseconds: >-
                      {% set u = board_ents | select('match', 'update\\.') | first | default('') %}{% set v = (state_attr(u, 'installed_version') or '0') | string %}{% set p = (v.split('.') + ['0', '0'])[:3] | map('int', 0) | list %}{{ 0 if p[0] * 10000 + p[1] * 100 + p[2] >= 20303 else 600 }}
            - if:
                - "{{ lang != '' }}"
              then:
                - action: tts.speak
                  continue_on_error: true
                  target:
                    entity_id: "{{ tts_ent }}"
                  data:
                    media_player_entity_id: "{{ speakers }}"
                    message: "{{ message }}"
                    language: "{{ lang }}"
                    options: "{{ tts_opts }}"
              else:
                - action: tts.speak
                  continue_on_error: true
                  target:
                    entity_id: "{{ tts_ent }}"
                  data:
                    media_player_entity_id: "{{ speakers }}"
                    message: "{{ message }}"
                    options: "{{ tts_opts }}"
            # let it finish before the next one
            - delay: 3
            - wait_template: "{{ speakers | select('is_state', ['playing', 'buffering']) | list | count == 0 }}"
              timeout: 60
