- title: 🔧 System
  path: system
  type: sections
  max_columns: 3
  header: *id001
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:information-outline
      heading_style: title
    - type: tile
      entity: sensor.departure_board_xxxxxx_wi_fi_signal
      name: Wi-Fi signal
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.departure_board_xxxxxx_uptime
      name: Uptime
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.departure_board_xxxxxx_free_memory
      name: Free memory
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.departure_board_xxxxxx_display_frame_time
      name: Frame time
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.departure_board_xxxxxx_restart_reason
      name: Last restart
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.departure_board_xxxxxx_blueprint
      name: Blueprint
      icon: mdi:file-document-refresh
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Firmware
      icon: mdi:chip
      heading_style: title
    - type: tile
      entity: update.departure_board_xxxxxx_firmware
      name: Firmware
      grid_options:
        columns: 12
      features:
      - type: update-actions
      features_position: bottom
    - type: tile
      entity: select.departure_board_xxxxxx_update_channel
      name: Update channel
      grid_options:
        columns: 12
      icon: mdi:source-branch
      features:
      - type: select-options
      features_position: bottom
    - type: tile
      entity: switch.departure_board_xxxxxx_install_updates_automatically
      name: Install updates automatically
      grid_options:
        columns: 12
      icon: mdi:update
      features:
      - type: toggle
      features_position: bottom
  - type: grid
    cards:
    - type: heading
      heading: Logos
      icon: mdi:image
      heading_style: title
    - type: entities
      title: Custom logo images
      icon: mdi:link
      entities:
      - entity: text.departure_board_xxxxxx_national_rail_board_logo_image
        name: National Rail board
      - entity: text.departure_board_xxxxxx_tfl_board_logo_image
        name: TfL board
    - type: markdown
      text_only: true
      content: <sub>A PNG about 56 x 35 pixels in your Home Assistant `www` folder, e.g. `http://<home-assistant-ip>:8123/local/logo.png`. Clear it for the built-in logo.</sub>
  - type: grid
    cards:
    - type: heading
      heading: Maintenance
      icon: mdi:wrench
      heading_style: title
    - type: tile
      entity: select.departure_board_xxxxxx_demo_mode
      name: Demo mode
      grid_options:
        columns: 12
      icon: mdi:presentation-play
      features:
      - type: select-options
      features_position: bottom
    - type: tile
      entity: button.departure_board_xxxxxx_restart
      name: Restart
      grid_options:
        columns: 6
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.departure_board_xxxxxx_restart
        confirmation:
          text: Restart the departure board?
    - type: tile
      entity: button.departure_board_xxxxxx_restart_in_safe_mode
      name: Safe mode
      grid_options:
        columns: 6
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.departure_board_xxxxxx_restart_in_safe_mode
        confirmation:
          text: Restart in safe mode? The board shows nothing until it is updated or restarted.
    - type: tile
      entity: button.departure_board_xxxxxx_factory_reset_clears_wi_fi_and_settings
      name: Factory reset
      grid_options:
        columns: 12
      icon: mdi:restore-alert
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.departure_board_xxxxxx_factory_reset_clears_wi_fi_and_settings
        confirmation:
          text: Factory reset clears the board's Wi-Fi and every setting. Continue?
