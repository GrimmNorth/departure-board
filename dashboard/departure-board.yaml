# UK Departure Board - Home Assistant dashboard
#
# 1. Settings > Dashboards > Add dashboard > New dashboard from scratch, name it "Departure Board".
# 2. Open it, then the pencil (Edit dashboard) > three dots > Raw configuration editor.
# 3. Delete what's there and paste this whole file.
# 4. Replace every "departure_board_xxxxxx" with your board's prefix, then Save.
#    Find the prefix in any of the board's entity IDs: select.departure_board_ab12cd_layout -> departure_board_ab12cd
#    (Ctrl+F in the editor, or Cmd+F on a Mac, opens find and replace.)
#
# Only built-in cards are used, so nothing else needs installing.

views:
- title: 🚆 Board
  path: board
  type: sections
  max_columns: 3
  header: &id001
    layout: start
    card:
      type: markdown
      text_only: true
      content: <img src="https://raw.githubusercontent.com/GrimmNorth/departure-board/main/docs/logo/banner.png" height="56" alt="UK Departure Board">
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Now showing
      icon: mdi:train
      heading_style: title
    - type: tile
      entity: button.departure_board_xxxxxx_previous_station
      name: Back
      icon: mdi:chevron-left
      hide_state: true
      vertical: true
      grid_options:
        columns: 3
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.departure_board_xxxxxx_previous_station
    - type: tile
      entity: sensor.departure_board_xxxxxx_station
      name: Station
      icon: mdi:map-marker
      vertical: true
      grid_options:
        columns: 6
    - type: tile
      entity: button.departure_board_xxxxxx_next_station
      name: Next
      icon: mdi:chevron-right
      hide_state: true
      vertical: true
      grid_options:
        columns: 3
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.departure_board_xxxxxx_next_station
    - type: tile
      entity: sensor.departure_board_xxxxxx_leave_in
      name: Leave in
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.departure_board_xxxxxx_station_messages
      name: Station messages
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Quick controls
      icon: mdi:gesture-tap
      heading_style: title
    - type: tile
      entity: number.departure_board_xxxxxx_brightness
      name: Brightness
      grid_options:
        columns: 12
      icon: mdi:brightness-6
      features:
      - type: numeric-input
        style: slider
      features_position: bottom
    - type: tile
      entity: select.departure_board_xxxxxx_layout
      name: Layout
      grid_options:
        columns: 12
      icon: mdi:view-agenda
      features:
      - type: select-options
      features_position: bottom
    - type: tile
      entity: switch.departure_board_xxxxxx_countdown
      name: Countdown
      grid_options:
        columns: 6
      icon: mdi:timer-outline
      features:
      - type: toggle
      features_position: bottom
    - type: tile
      entity: text.departure_board_xxxxxx_platform
      name: Platform
      icon: mdi:sign-direction
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: select.departure_board_xxxxxx_layout
        state: Platform
    - type: tile
      entity: switch.departure_board_xxxxxx_train_numbers
      name: Train numbers
      icon: mdi:format-list-numbered
      grid_options:
        columns: 6
      features: &id002
      - type: toggle
      features_position: bottom
      visibility:
      - condition: state
        entity: select.departure_board_xxxxxx_layout
        state_not: Platform
