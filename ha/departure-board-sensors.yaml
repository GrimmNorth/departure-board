# UK Departure Board - Home Assistant side. Paste this into configuration.yaml.
#
# BEFORE YOU PASTE, do two things:
#   1) Find/replace  YOUR_PREFIX  with your My Rail Commute entity prefix. For example, if your first
#      train is sensor.departures_from_beverley_train_1 then the prefix is departures_from_beverley.
#   2) Change the station name on the line marked CHANGE (shown at the bottom of the board).
#
# If configuration.yaml already has a 'template:' section, paste only the lines from '  - sensor:' down
# under it. Then: Developer tools > YAML > Check configuration > Reload template entities.
# It creates fixed-name sensors (sensor.departure_board_*) that the board reads.
template:
  - sensor:
      - name: "Departure Board Status"
        unique_id: departure_board_status
        state: "{{ states('sensor.YOUR_PREFIX_status') }}"
        attributes:
          station: "YOUR STATION"   # CHANGE
      - name: "Departure Board Train 1"
        unique_id: departure_board_train_1
        state: "{{ states('sensor.YOUR_PREFIX_train_1') }}"
        attributes:
          scheduled_departure: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'scheduled_departure') %}{{ '' if v is none else v }}
          expected_departure: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'expected_departure') %}{{ '' if v is none else v }}
          platform: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'platform') %}{{ '' if v is none else v }}
          platform_changed: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'platform_changed') %}{{ '' if v is none else v }}
          status: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'status') %}{{ '' if v is none else v }}
          calling_points: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'calling_points') %}{{ '' if v is none else v }}
          delay_reason: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'delay_reason') %}{{ '' if v is none else v }}
          cancellation_reason: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'cancellation_reason') %}{{ '' if v is none else v }}
          operator: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'operator') %}{{ '' if v is none else v }}
          delay_minutes: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'delay_minutes') %}{{ '' if v is none else v }}
          scheduled_arrival: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'scheduled_arrival') %}{{ '' if v is none else v }}
          estimated_arrival: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'estimated_arrival') %}{{ '' if v is none else v }}
          previous_platform: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'previous_platform') %}{{ '' if v is none else v }}
          last_updated: >-
            {% set v = state_attr('sensor.YOUR_PREFIX_train_1', 'last_updated') %}{{ '' if v is none else v }}
      - name: "Departure Board Train 1 stops"
        unique_id: departure_board_train_1_stops
        state: >-
          {% set sid = state_attr('sensor.YOUR_PREFIX_train_1','service_id') %}{% set d = state_attr('sensor.YOUR_PREFIX_summary','services_by_destination') %}{% set ns = namespace(out=[]) %}{% if d and sid %}{% for dest in d.values() %}{% for s in dest.services %}{% if s.service_id == sid %}{% for p in s.calling_point_details %}{% set t = p.expected if (p.expected | regex_match('^[0-9]{2}:[0-9]{2}$')) else p.scheduled %}{% set ns.out = ns.out + [p.name ~ ' ' ~ t] %}{% endfor %}{% endif %}{% endfor %}{% endfor %}{% endif %}{{ ns.out | join(', ') | truncate(250, true, '') }}
