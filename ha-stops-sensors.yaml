# Optional: per-stop times for the departure board.
# 1) Find/replace  departures_from_your_station  with YOUR entity prefix (same one as in your device file)
#    and  YOUR STATION  with your station name.
# 2) Add to configuration.yaml (if you already have 'template:', paste only the '- sensor:' block under it).
# 3) Developer tools > YAML > Reload template entities.
# The board works without this; it then shows a plain 'Calling at' list.
template:
  - sensor:
      - name: "departures_from_your_station Train 1 stops"
        unique_id: departure_board_train_1_stops
        state: >-
          {% set sid = state_attr('sensor.departures_from_your_station_train_1','service_id') %}{% set d = state_attr('sensor.departures_from_your_station_summary','services_by_destination') %}{% set ns = namespace(out=[]) %}{% if d and sid %}{% for dest in d.values() %}{% for s in dest.services %}{% if s.service_id == sid %}{% for p in s.calling_point_details %}{% set t = p.expected if (p.expected | regex_match('^[0-9]{2}:[0-9]{2}$')) else p.scheduled %}{% set ns.out = ns.out + [p.name ~ ' ' ~ t] %}{% endfor %}{% endif %}{% endfor %}{% endfor %}{% endif %}{{ ns.out | join(', ') | truncate(250, true, '') }}
      - name: "departures_from_your_station Train 2 stops"
